<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="initGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="bppGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="readyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="destroyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Spring Bean Lifecycle &amp; Container Architecture</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">From BeanDefinition to Injection, Aware Hooks, BPP Interception, Proxy Generation, and Destruction</text>

  <!-- Phase 1: Container Startup & BeanDefinition Registry -->
  <g transform="translate(40, 100)">
    <rect width="1020" height="90" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#58a6ff"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#58a6ff">PHASE 1: Definition &amp; Registry</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">1. Component Scanning (@Component, @Configuration, @Bean) produces AnnotatedBeanDefinition</text>
    <text x="25" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">2. <tspan fill="#79c0ff" font-family="monospace">BeanFactoryPostProcessor (BFPP)</tspan> executes (e.g., PropertySourcesPlaceholderConfigurer resolves ${...} before any bean instance exists)</text>
  </g>

  <!-- Phase 2: Instantiation & Dependency Injection -->
  <g transform="translate(40, 210)">
    <!-- Box 1: Instantiation -->
    <rect x="0" y="0" width="320" height="130" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="6" rx="3" fill="url(#initGrad)"/>
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">1. Instantiation</text>
    <text x="18" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Raw reflection call:</text>
    <text x="18" y="75" font-family="monospace" font-size="11" fill="#79c0ff">Constructor.newInstance()</text>
    <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">Exposes ObjectFactory to</text>
    <text x="18" y="115" font-family="monospace" font-size="11" fill="#d29922">singletonFactories (3rd Level)</text>

    <!-- Arrow 1 to 2 -->
    <line x1="320" y1="65" x2="350" y2="65" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 2: Populate Properties -->
    <rect x="350" y="0" width="320" height="130" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="350" y="0" width="320" height="6" rx="3" fill="url(#initGrad)"/>
    <text x="368" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">2. Populate Properties</text>
    <text x="368" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Dependency Injection:</text>
    <text x="368" y="75" font-family="monospace" font-size="11" fill="#79c0ff">AutowiredAnnotationBPP</text>
    <text x="368" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">Resolves @Autowired, @Value,</text>
    <text x="368" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">and @Inject fields and setters</text>

    <!-- Arrow 2 to 3 -->
    <line x1="670" y1="65" x2="700" y2="65" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 3: Aware Hooks -->
    <rect x="700" y="0" width="320" height="130" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="700" y="0" width="320" height="6" rx="3" fill="url(#initGrad)"/>
    <text x="718" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">3. Aware Interfaces</text>
    <text x="718" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Injected infrastructure callbacks:</text>
    <text x="718" y="75" font-family="monospace" font-size="11" fill="#7ee787">setBeanName(String)</text>
    <text x="718" y="95" font-family="monospace" font-size="11" fill="#7ee787">setBeanFactory(BeanFactory)</text>
    <text x="718" y="115" font-family="monospace" font-size="11" fill="#7ee787">setApplicationContext(Ctx)</text>
  </g>

  <!-- Phase 3: Initialization & Proxy Wrapping (The BPP Core) -->
  <g transform="translate(40, 360)">
    <!-- Box 4: BPP Before -->
    <rect x="0" y="0" width="320" height="135" rx="8" fill="url(#cardGrad)" stroke="#d29922" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="6" rx="3" fill="url(#bppGrad)"/>
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e3b341">4. BPP Before Initialization</text>
    <text x="18" y="52" font-family="monospace" font-size="11" fill="#79c0ff">postProcessBeforeInitialization()</text>
    <text x="18" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">Common processors:</text>
    <text x="18" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">- CommonAnnotationBeanPostProcessor</text>
    <text x="18" y="115" font-family="monospace" font-size="11" fill="#f0883e">  triggers @PostConstruct</text>

    <!-- Arrow 4 to 5 -->
    <line x1="320" y1="67" x2="350" y2="67" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 5: InitializingBean -->
    <rect x="350" y="0" width="320" height="135" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="350" y="0" width="320" height="6" rx="3" fill="url(#initGrad)"/>
    <text x="368" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">5. Initialization Callbacks</text>
    <text x="368" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Execution order:</text>
    <text x="368" y="75" font-family="monospace" font-size="11" fill="#7ee787">1. @PostConstruct (via BPP)</text>
    <text x="368" y="95" font-family="monospace" font-size="11" fill="#79c0ff">2. InitializingBean.afterProps()</text>
    <text x="368" y="115" font-family="monospace" font-size="11" fill="#c9d1d9">3. custom init-method in XML/@Bean</text>

    <!-- Arrow 5 to 6 -->
    <line x1="670" y1="67" x2="700" y2="67" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 6: BPP After (AOP PROXY!) -->
    <rect x="700" y="0" width="320" height="135" rx="8" fill="url(#cardGrad)" stroke="#a371f7" stroke-width="2"/>
    <rect x="700" y="0" width="320" height="6" rx="3" fill="url(#proxyGrad)"/>
    <text x="718" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#a371f7">6. BPP After (AOP Wrapping)</text>
    <text x="718" y="52" font-family="monospace" font-size="11" fill="#79c0ff">postProcessAfterInitialization()</text>
    <text x="718" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f0f6fc">Wraps target in <tspan fill="#a371f7" font-weight="700">Dynamic Proxy</tspan>:</text>
    <text x="718" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">- CGLIB or JDK Proxy generated</text>
    <text x="718" y="115" font-family="monospace" font-size="11" fill="#f0883e">  @Transactional, @Async, @Retryable</text>
  </g>

  <!-- Phase 4: Ready / In Service & Destruction -->
  <g transform="translate(40, 515)">
    <!-- Box 7: Ready in Singleton Pool -->
    <rect x="0" y="0" width="570" height="145" rx="8" fill="url(#cardGrad)" stroke="#2ea043" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="6" rx="3" fill="url(#readyGrad)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#2ea043">7. Live in Service (1st Level Cache: singletonObjects)</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">Bean is fully initialized, proxy-wrapped (if advised), and cached in the ConcurrentHashMap.</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Any caller requesting the bean via <tspan fill="#79c0ff" font-family="monospace">applicationContext.getBean()</tspan> or <tspan fill="#79c0ff" font-family="monospace">@Autowired</tspan></text>
    <text x="25" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">receives the proxy instance directly from the singleton cache with zero reflection overhead.</text>
    <text x="25" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#7ee787">✓ Prototype beans skip caching and run through steps 1-6 upon each request.</text>

    <!-- Arrow 7 to 8 -->
    <line x1="570" y1="72" x2="650" y2="72" stroke="#f85149" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="580" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#f85149">Shutdown</text>

    <!-- Box 8: Destruction -->
    <rect x="650" y="0" width="370" height="145" rx="8" fill="url(#cardGrad)" stroke="#da3633" stroke-width="1.5"/>
    <rect x="650" y="0" width="370" height="6" rx="3" fill="url(#destroyGrad)"/>
    <text x="670" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f85149">8. Container Destruction</text>
    <text x="670" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Triggered on <tspan fill="#f85149" font-family="monospace">ConfigurableApplicationContext.close()</tspan>:</text>
    <text x="670" y="82" font-family="monospace" font-size="11" fill="#c9d1d9">1. @PreDestroy annotated methods</text>
    <text x="670" y="102" font-family="monospace" font-size="11" fill="#79c0ff">2. DisposableBean.destroy()</text>
    <text x="670" y="122" font-family="monospace" font-size="11" fill="#8b949e">3. custom destroy-method in XML/@Bean</text>
  </g>
</svg>
