<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="initGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="bppGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="readyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="destroyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Spring Bean Lifecycle &amp; Container Architecture</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">From BeanDefinition to Injection, Aware Hooks, BPP Interception, Proxy Generation, and Destruction</text>

  <!-- Phase 1: Container Startup & BeanDefinition Registry -->
  <g transform="translate(40, 105)">
    <rect width="1120" height="95" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="2"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#58a6ff"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">PHASE 1: Definition &amp; Registry</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Component Scanning (@Component, @Configuration, @Bean) produces AnnotatedBeanDefinition objects</text>
    <text x="25" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">2. <tspan fill="#79c0ff" font-family="monospace">BeanFactoryPostProcessor (BFPP)</tspan> executes (e.g., PropertySourcesPlaceholderConfigurer resolves ${...} before any bean exists)</text>
  </g>

  <!-- Phase 2: Instantiation & Dependency Injection -->
  <g transform="translate(40, 215)">
    <!-- Box 1: Instantiation -->
    <g transform="translate(0, 0)">
      <rect width="350" height="155" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
      <rect width="350" height="6" rx="3" fill="url(#initGrad)"/>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">1. Instantiation</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Raw reflection constructor call:</text>
      <text x="18" y="82" font-family="monospace" font-size="13" fill="#79c0ff">Constructor.newInstance()</text>
      <text x="18" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Exposes early ObjectFactory to</text>
      <text x="18" y="134" font-family="monospace" font-size="13" fill="#d29922">singletonFactories (3rd Level Cache)</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 355 80 L 375 80" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Box 2: Populate Properties -->
    <g transform="translate(385, 0)">
      <rect width="350" height="155" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
      <rect width="350" height="6" rx="3" fill="url(#initGrad)"/>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">2. Populate Properties (DI)</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Dependency Injection resolution:</text>
      <text x="18" y="82" font-family="monospace" font-size="13" fill="#7ee787">@Autowired, @Value, @Inject</text>
      <text x="18" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Resolves circular references via</text>
      <text x="18" y="134" font-family="monospace" font-size="13" fill="#79c0ff">earlySingletonObjects (2nd Level Cache)</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 740 80 L 760 80" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Box 3: Aware Hooks -->
    <g transform="translate(770, 0)">
      <rect width="350" height="155" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
      <rect width="350" height="6" rx="3" fill="url(#initGrad)"/>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">3. Aware Interfaces</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Spring infrastructure callbacks:</text>
      <text x="18" y="82" font-family="monospace" font-size="13" fill="#e3b341">• BeanNameAware.setBeanName()</text>
      <text x="18" y="106" font-family="monospace" font-size="13" fill="#e3b341">• BeanFactoryAware.setBeanFactory()</text>
      <text x="18" y="130" font-family="monospace" font-size="13" fill="#e3b341">• ApplicationContextAware</text>
    </g>
  </g>

  <!-- Phase 3: BPP & Initialization Hooks -->
  <g transform="translate(40, 385)">
    <!-- Box 4: BPP Before -->
    <g transform="translate(0, 0)">
      <rect width="350" height="165" rx="8" fill="url(#cardGrad)" stroke="#d29922" stroke-width="1.5"/>
      <rect width="350" height="6" rx="3" fill="url(#bppGrad)"/>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#e3b341">4. BPP Before Initialization</text>
      <text x="18" y="58" font-family="monospace" font-size="13" fill="#79c0ff">postProcessBeforeInitialization()</text>
      <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Executes before any custom init logic:</text>
      <text x="18" y="108" font-family="monospace" font-size="13" fill="#7ee787">ApplicationContextAwareProcessor</text>
      <text x="18" y="134" font-family="monospace" font-size="13" fill="#8b949e">CommonAnnotationBeanPostProcessor</text>
    </g>

    <!-- Arrow 4 to 5 -->
    <path d="M 355 85 L 375 85" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Box 5: InitializingBean -->
    <g transform="translate(385, 0)">
      <rect width="350" height="165" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
      <rect width="350" height="6" rx="3" fill="url(#initGrad)"/>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">5. Initialization Callbacks</text>
      <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Strict sequential execution order:</text>
      <text x="18" y="84" font-family="monospace" font-size="13" fill="#7ee787">1. @PostConstruct (via BPP)</text>
      <text x="18" y="108" font-family="monospace" font-size="13" fill="#79c0ff">2. InitializingBean.afterPropertiesSet()</text>
      <text x="18" y="134" font-family="monospace" font-size="13" fill="#c9d1d9">3. custom init-method in @Bean</text>
    </g>

    <!-- Arrow 5 to 6 -->
    <path d="M 740 85 L 760 85" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Box 6: BPP After (AOP Proxy Wrapping!) -->
    <g transform="translate(770, 0)">
      <rect width="350" height="165" rx="8" fill="url(#cardGrad)" stroke="#a371f7" stroke-width="2"/>
      <rect width="350" height="6" rx="3" fill="url(#proxyGrad)"/>
      <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#a371f7">6. BPP After (AOP Wrapping)</text>
      <text x="18" y="58" font-family="monospace" font-size="13" fill="#79c0ff">postProcessAfterInitialization()</text>
      <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f0f6fc">Wraps raw bean in <tspan fill="#a371f7" font-weight="700">Dynamic Proxy</tspan>:</text>
      <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• CGLIB or JDK Proxy generated</text>
      <text x="18" y="134" font-family="monospace" font-size="13" fill="#f0883e">  @Transactional, @Async, @Retryable</text>
    </g>
  </g>

  <!-- Phase 4: Ready / In Service & Destruction -->
  <g transform="translate(40, 565)">
    <!-- Box 7: Ready in Singleton Pool -->
    <g transform="translate(0, 0)">
      <rect width="640" height="295" rx="8" fill="url(#cardGrad)" stroke="#2ea043" stroke-width="2"/>
      <rect width="640" height="6" rx="3" fill="url(#readyGrad)"/>
      <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3fb950">7. Live in Service (1st Level Cache: singletonObjects)</text>
      <text x="25" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#c9d1d9">Bean is fully initialized, proxy-wrapped (if advised), and cached in ConcurrentHashMap.</text>
      <text x="25" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#8b949e">Any caller requesting the bean via <tspan fill="#79c0ff" font-family="monospace">applicationContext.getBean()</tspan> or <tspan fill="#79c0ff" font-family="monospace">@Autowired</tspan></text>
      <text x="25" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#8b949e">receives the proxy instance directly from the singleton cache with zero reflection overhead.</text>
      <text x="25" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#7ee787">✓ Prototype beans skip caching and run through steps 1-6 upon each request.</text>
      <text x="25" y="200" font-family="monospace" font-size="13" fill="#3fb950">Default Scope: Singleton (1 instance per Spring ApplicationContext container)</text>
    </g>

    <!-- Shutdown Arrow -->
    <path d="M 645 150 L 675 150" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="645" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f85149">Shutdown</text>

    <!-- Box 8: Destruction -->
    <g transform="translate(680, 0)">
      <rect width="440" height="295" rx="8" fill="url(#cardGrad)" stroke="#da3633" stroke-width="2"/>
      <rect width="440" height="6" rx="3" fill="url(#destroyGrad)"/>
      <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f85149">8. Container Destruction</text>
      <text x="25" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#8b949e">Triggered on <tspan fill="#f85149" font-family="monospace">ApplicationContext.close()</tspan>:</text>
      <text x="25" y="100" font-family="monospace" font-size="13" fill="#c9d1d9">1. @PreDestroy annotated methods</text>
      <text x="25" y="130" font-family="monospace" font-size="13" fill="#79c0ff">2. DisposableBean.destroy()</text>
      <text x="25" y="160" font-family="monospace" font-size="13" fill="#8b949e">3. custom destroyMethod in @Bean</text>
      <text x="25" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#f85149">Releases thread pools, DB connections, and locks gracefully</text>
    </g>
  </g>
</svg>