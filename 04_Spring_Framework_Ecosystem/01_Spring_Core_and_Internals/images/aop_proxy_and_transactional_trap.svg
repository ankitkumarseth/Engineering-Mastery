<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="proxyGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad2)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Spring AOP Proxy Architecture &amp; The Self-Invocation Trap</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Why calling a @Transactional or @Async method via 'this' completely bypasses proxy interception</text>

  <!-- External Client / Controller -->
  <g transform="translate(40, 105)">
    <rect width="220" height="480" rx="8" fill="url(#cardGrad2)" stroke="#30363d" stroke-width="2"/>
    <rect width="220" height="6" rx="3" fill="#58a6ff"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Caller / Client</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">e.g. OrderController</text>

    <g transform="translate(15, 75)">
      <rect width="190" height="95" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="24" font-family="monospace" font-size="13" fill="#79c0ff">@Autowired</text>
      <text x="15" y="48" font-family="monospace" font-size="13" fill="#c9d1d9">OrderService</text>
      <text x="15" y="72" font-family="monospace" font-size="13" fill="#8b949e">orderService;</text>
    </g>

    <g transform="translate(15, 190)">
      <text x="5" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Invokes method:</text>
      <text x="5" y="48" font-family="monospace" font-size="14" font-weight="700" fill="#7ee787">orderService</text>
      <text x="5" y="70" font-family="monospace" font-size="14" font-weight="700" fill="#7ee787"> .checkout();</text>
    </g>

    <g transform="translate(15, 290)">
      <rect width="190" height="150" rx="6" fill="#0d1117" stroke="#388bfd" stroke-dasharray="4 4"/>
      <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#58a6ff">Holds reference to:</text>
      <text x="15" y="52" font-family="monospace" font-size="13" font-weight="700" fill="#a371f7">OrderService$$</text>
      <text x="15" y="74" font-family="monospace" font-size="13" font-weight="700" fill="#a371f7">SpringCGLIB$$0</text>
      <text x="15" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Dynamic subclass</text>
      <text x="15" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">generated by Spring</text>
    </g>
  </g>

  <!-- Arrow Client -> Proxy -->
  <path d="M 260 300 L 290 300" fill="none" stroke="#a371f7" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Spring CGLIB Proxy Container -->
  <g transform="translate(300, 105)">
    <rect width="440" height="480" rx="8" fill="url(#cardGrad2)" stroke="#a371f7" stroke-width="2"/>
    <rect width="440" height="6" rx="3" fill="url(#proxyGrad2)"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#a371f7">Spring AOP Proxy (CGLIB Subclass)</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">MethodInterceptor Advice Chain</text>

    <!-- Interceptor Box 1: Transaction Begin -->
    <g transform="translate(20, 75)">
      <rect width="400" height="90" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">1. TransactionInterceptor</text>
      <text x="15" y="48" font-family="monospace" font-size="13" fill="#7ee787">TransactionManager.getTransaction()</text>
      <text x="15" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Opens DB connection; sets autoCommit=false</text>
    </g>

    <!-- Forward arrow -->
    <path d="M 220 165 L 220 195" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <!-- Delegate to Target -->
    <g transform="translate(20, 200)">
      <rect width="400" height="95" rx="6" fill="#161b22" stroke="#388bfd"/>
      <text x="15" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">2. Delegate to Target Instance</text>
      <text x="15" y="48" font-family="monospace" font-size="13" fill="#79c0ff">target.checkout();</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Calls actual business logic method</text>
    </g>

    <!-- Return arrow -->
    <path d="M 220 295 L 220 325" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

    <!-- Interceptor Box 3: Transaction Commit / Rollback -->
    <g transform="translate(20, 330)">
      <rect width="400" height="125" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">3. Transaction Commit / Rollback</text>
      <text x="15" y="50" font-family="monospace" font-size="13" fill="#7ee787">try { txManager.commit(status); }</text>
      <text x="15" y="74" font-family="monospace" font-size="13" fill="#f85149">catch (Exception ex) {</text>
      <text x="15" y="98" font-family="monospace" font-size="13" fill="#f85149">  txManager.rollback(status); }</text>
    </g>
  </g>

  <!-- Arrow Proxy -> Target -->
  <path d="M 740 245 L 770 245" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Target Bean Instance (Where Trap Happens) -->
  <g transform="translate(780, 105)">
    <rect width="380" height="480" rx="8" fill="url(#cardGrad2)" stroke="#da3633" stroke-width="2"/>
    <rect width="380" height="6" rx="3" fill="url(#dangerGrad)"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f85149">Target Instance (Raw POJO)</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">The Self-Invocation / 'this' Trap</text>

    <!-- Method A: checkout() -->
    <g transform="translate(15, 75)">
      <rect width="350" height="135" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="24" font-family="monospace" font-size="13" fill="#e3b341">@Transactional</text>
      <text x="15" y="48" font-family="monospace" font-size="13" font-weight="700" fill="#f0f6fc">public void checkout() {</text>
      <text x="30" y="72" font-family="monospace" font-size="13" fill="#8b949e">// updates DB ...</text>
      <text x="30" y="96" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">this.sendAuditLog(); // TRAP!</text>
      <text x="15" y="120" font-family="monospace" font-size="13" fill="#f0f6fc">}</text>
    </g>

    <!-- Self-invocation arrow inside target -->
    <path d="M 220 185 C 270 210, 270 250, 220 275" fill="none" stroke="#f85149" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrowRed)"/>
    <rect x="230" y="215" width="135" height="32" rx="4" fill="#21262d" stroke="#f85149"/>
    <text x="240" y="236" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">Direct 'this' Call!</text>

    <!-- Method B: sendAuditLog() -->
    <g transform="translate(15, 275)">
      <rect width="350" height="180" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="15" y="26" font-family="monospace" font-size="13" fill="#f85149">@Transactional(REQUIRES_NEW)</text>
      <text x="15" y="52" font-family="monospace" font-size="13" font-weight="700" fill="#f0f6fc">public void sendAuditLog() {</text>
      <text x="30" y="78" font-family="monospace" font-size="13" fill="#8b949e">// Expected independent TX,</text>
      <text x="30" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">❌ BUT RUNS IN CALLER TX!</text>
      <text x="30" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Proxy was NEVER invoked!</text>
      <text x="15" y="156" font-family="monospace" font-size="13" fill="#f0f6fc">}</text>
    </g>
  </g>

  <!-- Architectural Solutions Banner -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="270" rx="8" fill="url(#cardGrad2)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#successGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">Staff / Principal Architectural Antidotes for Self-Invocation</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Eliminating proxy bypass through clean architectural boundaries and programmatic execution</text>

    <g transform="translate(20, 72)">
      <!-- Solution 1 -->
      <g transform="translate(0, 0)">
        <rect width="345" height="175" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#58a6ff">1. Extract Collaborator (Preferred)</text>
        <text x="15" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Move <tspan fill="#79c0ff" font-family="monospace">sendAuditLog()</tspan> into dedicated</text>
        <text x="15" y="78" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">AuditLogService</text>
        <text x="15" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Enforces Single Responsibility Principle</text>
        <text x="15" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">and routes call through fresh CGLIB proxy.</text>
      </g>

      <!-- Solution 2 -->
      <g transform="translate(365, 0)">
        <rect width="350" height="175" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#58a6ff">2. Programmatic TransactionTemplate</text>
        <text x="15" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Eliminate annotations entirely:</text>
        <text x="15" y="80" font-family="monospace" font-size="13" fill="#7ee787">txTemplate.execute(status -&gt; {</text>
        <text x="25" y="104" font-family="monospace" font-size="13" fill="#c9d1d9">  sendAuditLog(); return null;</text>
        <text x="15" y="128" font-family="monospace" font-size="13" fill="#7ee787">});</text>
        <text x="15" y="154" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Explicit scoping without proxy traps</text>
      </g>

      <!-- Solution 3 -->
      <g transform="translate(735, 0)">
        <rect width="345" height="175" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#e3b341">3. Self-Injection with @Lazy</text>
        <text x="15" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Inject proxy into target instance:</text>
        <text x="15" y="80" font-family="monospace" font-size="13" fill="#7ee787">@Autowired @Lazy</text>
        <text x="15" y="104" font-family="monospace" font-size="13" fill="#c9d1d9">private OrderService self;</text>
        <text x="15" y="132" font-family="monospace" font-size="13" fill="#79c0ff">self.sendAuditLog();</text>
        <text x="15" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Avoids circular dependency with @Lazy</text>
      </g>
    </g>
  </g>
</svg>