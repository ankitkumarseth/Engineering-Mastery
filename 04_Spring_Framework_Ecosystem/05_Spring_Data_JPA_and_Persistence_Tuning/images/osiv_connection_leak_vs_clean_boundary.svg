<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>

    <marker id="arrowRed7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowGreen7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad7)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Open-Session-In-View (OSIV) Anti-Pattern vs. Clean Transaction Boundary</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Why spring.jpa.open-in-view=true causes catastrophic HikariCP connection starvation under enterprise load</text>

  <!-- TOP PANEL: The OSIV Anti-Pattern (Default) -->
  <g transform="translate(50, 105)">
    <rect width="1100" height="350" rx="10" fill="url(#cardGrad7)" stroke="#da3633" stroke-width="2"/>
    <rect width="1100" height="6" rx="3" fill="url(#badGrad)"/>
    <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f85149">ANTI-PATTERN: spring.jpa.open-in-view=true (Default Spring Boot Behavior)</text>
    <text x="30" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Hibernate Session is kept open across the ENTIRE HTTP Request lifecycle (Borrow on Filter, Hold through I/O)</text>

    <!-- Phase Boxes across Request Timeline -->
    <!-- Step 1: Filter -->
    <rect x="30" y="80" width="180" height="135" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="42" y="106" font-family="monospace" font-size="13.5" font-weight="700" fill="#e3b341">1. Filter Ingress</text>
    <text x="42" y="128" font-family="monospace" font-size="12" fill="#e3b341">OpenEntityManager</text>
    <text x="42" y="146" font-family="monospace" font-size="12" fill="#e3b341">InViewInterceptor</text>
    <text x="42" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Opens Session</text>
    <text x="42" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f85149">Borrows DB Conn!</text>

    <!-- Arrow 1 to 2 -->
    <line x1="210" y1="147" x2="242" y2="147" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed7)"/>

    <!-- Step 2: Controller -->
    <rect x="245" y="80" width="180" height="135" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="257" y="106" font-family="monospace" font-size="13.5" font-weight="700" fill="#79c0ff">2. Controller Ingress</text>
    <text x="257" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Dispatches request</text>
    <text x="257" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">to service layer.</text>
    <text x="257" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f85149">Conn held idle!</text>

    <!-- Arrow 2 to 3 -->
    <line x1="425" y1="147" x2="457" y2="147" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed7)"/>

    <!-- Step 3: Service -->
    <rect x="460" y="80" width="200" height="135" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="472" y="106" font-family="monospace" font-size="13.5" font-weight="700" fill="#3fb950">3. Service Layer</text>
    <text x="472" y="128" font-family="monospace" font-size="12.5" fill="#79c0ff">@Transactional</text>
    <text x="472" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Executes queries.</text>
    <text x="472" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7ee787">Active DB: ~4ms</text>
    <text x="472" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f85149">Does NOT release!</text>

    <!-- Arrow 3 to 4 -->
    <line x1="660" y1="147" x2="692" y2="147" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed7)"/>

    <!-- Step 4: JSON Serialization / External IO -->
    <rect x="695" y="80" width="230" height="135" rx="6" fill="#161b22" stroke="#da3633" stroke-width="2"/>
    <text x="707" y="106" font-family="monospace" font-size="13.5" font-weight="700" fill="#f85149">4. View / JSON I/O</text>
    <text x="707" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Jackson serializes DTO.</text>
    <text x="707" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f85149">Triggers N+1 lazy queries!</text>
    <text x="707" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Network stream write</text>
    <text x="707" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f85149">Latency: 100-300ms</text>

    <!-- Arrow 4 to 5 -->
    <line x1="925" y1="147" x2="957" y2="147" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed7)"/>

    <!-- Step 5: Filter Egress -->
    <rect x="960" y="80" width="110" height="135" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="970" y="106" font-family="monospace" font-size="13.5" font-weight="700" fill="#e3b341">5. Egress</text>
    <text x="970" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Filter closes</text>
    <text x="970" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Session &amp;</text>
    <text x="970" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">finally frees</text>
    <text x="970" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2ea043">connection</text>

    <!-- Summary Bar -->
    <rect x="30" y="235" width="1040" height="95" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="45" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">💥 Total Connection Hold Duration: ~250ms (for only 4ms of actual SQL execution!)</text>
    <text x="45" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#c9d1d9">Holding DB connections during JSON serialization and client network I/O exhausts the HikariCP connection pool.</text>
    <text x="45" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Slow mobile clients or downstream network latency cause total pool starvation and cascading 504 gateway timeouts.</text>
  </g>

  <!-- BOTTOM PANEL: Production Best Practice (OSIV Disabled) -->
  <g transform="translate(50, 480)">
    <rect width="1100" height="385" rx="10" fill="url(#cardGrad7)" stroke="#238636" stroke-width="2"/>
    <rect width="1100" height="6" rx="3" fill="url(#goodGrad)"/>
    <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3fb950">PRODUCTION STANDARD: spring.jpa.open-in-view=false (Strict Service Boundaries)</text>
    <text x="30" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Database connection is borrowed and released STRICTLY inside the @Transactional service method</text>

    <!-- Clean Timeline -->
    <!-- Step 1: Controller -->
    <rect x="30" y="80" width="280" height="145" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="45" y="108" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">1. Controller Layer</text>
    <text x="45" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Receives HTTP request.</text>
    <text x="45" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#7ee787">✓ Zero DB connection borrowed!</text>
    <text x="45" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Invokes transactional Service method.</text>
    <text x="45" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Pool remains 100% available for others.</text>

    <!-- Arrow 1 to 2 -->
    <line x1="310" y1="152" x2="350" y2="152" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen7)"/>

    <!-- Step 2: Service Layer (Bounded Transaction) -->
    <rect x="355" y="80" width="410" height="145" rx="6" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="375" y="108" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">2. Service Method (@Transactional Boundary)</text>
    <text x="375" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">• Acquires HikariCP Connection on demand (0.1ms)</text>
    <text x="375" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#79c0ff">• Executes JOIN FETCH / DTO Projection (3.8ms)</text>
    <text x="375" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#3fb950">• Transaction Commits → IMMEDIATELY RETURNS CONN!</text>
    <text x="375" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Connection returned before exiting service method.</text>

    <!-- Arrow 2 to 3 -->
    <line x1="765" y1="152" x2="805" y2="152" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen7)"/>

    <!-- Step 3: View / Response Serialization -->
    <rect x="810" y="80" width="260" height="145" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="825" y="108" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">3. View / JSON Serialization</text>
    <text x="825" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Jackson serializes detached DTO.</text>
    <text x="825" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#7ee787">✓ Zero DB connection held!</text>
    <text x="825" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Completely immune to slow clients</text>
    <text x="825" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">or external network delays.</text>

    <!-- Summary Bar -->
    <rect x="30" y="245" width="1040" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="45" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">🚀 Total Connection Hold Duration: STRICTLY 4ms (Released Immediately Upon Commit)!</text>
    <text x="45" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#c9d1d9">Enables 50x higher concurrent throughput on identical hardware with a lean pool of 10-20 HikariCP connections.</text>
    <text x="45" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Enforces strict layer isolation: Accessing uninitialized lazy collections outside the boundary throws LazyInitializationException,</text>
    <text x="45" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">safely guaranteeing that all relational data is explicitly fetched via JOIN FETCH, EntityGraph, or DTO Projections.</text>
  </g>
</svg>
