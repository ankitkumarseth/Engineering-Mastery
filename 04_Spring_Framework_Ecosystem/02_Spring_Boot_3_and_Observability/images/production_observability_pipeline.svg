<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="obsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowBlue4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad4)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Spring Boot 3 Enterprise Observability &amp; Telemetry Pipeline</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Unifying Distributed Tracing (Micrometer Tracing/OTel), Metrics (Prometheus), MDC Logging &amp; K8s Probes</text>

  <!-- Inbound Request Block -->
  <g transform="translate(40, 105)">
    <rect width="280" height="480" rx="8" fill="url(#cardGrad4)" stroke="#30363d" stroke-width="2"/>
    <rect width="280" height="6" rx="3" fill="#58a6ff"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">Inbound HTTP / Kafka</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Distributed Request Ingress</text>

    <!-- W3C Traceparent Header Box -->
    <g transform="translate(15, 75)">
      <rect width="250" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">W3C traceparent:</text>
      <text x="15" y="50" font-family="monospace" font-size="13" fill="#79c0ff">00-4bf92f3577b34da6</text>
      <text x="15" y="72" font-family="monospace" font-size="13" fill="#79c0ff">a3ce929d0e0e4736-01</text>
      <text x="15" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">(Version-TraceId-SpanId-Flags)</text>
    </g>

    <g transform="translate(15, 210)">
      <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#c9d1d9">Observation Filter:</text>
      <text x="5" y="48" font-family="monospace" font-size="13" fill="#7ee787">ServerHttpObservationFilter</text>
      <text x="5" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Intercepts incoming request</text>
      <text x="5" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Extracts TraceId from header</text>
      <text x="5" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Creates new child Span</text>
    </g>

    <!-- Virtual Thread MDC Box -->
    <g transform="translate(15, 360)">
      <rect width="250" height="100" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">MDC Propagation</text>
      <text x="15" y="52" font-family="monospace" font-size="13" fill="#c9d1d9">[traceId, spanId]</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Bound to ThreadLocal &amp; Virtual Threads</text>
    </g>
  </g>

  <!-- Arrow Inbound -> Engine -->
  <path d="M 320 345 L 350 345" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>

  <!-- Core Observability Engine (Boot 3) -->
  <g transform="translate(360, 105)">
    <rect width="500" height="480" rx="8" fill="url(#cardGrad4)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#obsGrad)"/>
    <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">Core Observability Engine (Micrometer 1.10+)</text>
    <text x="25" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Unified Observation API: One instrumentation for Traces + Metrics</text>

    <!-- ObservationRegistry Box -->
    <g transform="translate(20, 75)">
      <rect width="460" height="115" rx="6" fill="#161b22" stroke="#388bfd"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">ObservationRegistry &amp; Observation.create()</text>
      <text x="15" y="52" font-family="monospace" font-size="13" fill="#7ee787">Observation.createNotStarted("http.server.requests", reg)</text>
      <text x="15" y="74" font-family="monospace" font-size="13" fill="#7ee787">  .lowCardinalityKeyValue("status", "200")</text>
      <text x="15" y="96" font-family="monospace" font-size="13" fill="#7ee787">  .observe(() -&gt; handleRequest());</text>
    </g>

    <!-- Dual Handlers inside Engine -->
    <g transform="translate(20, 210)">
      <!-- Tracing Handler -->
      <g transform="translate(0, 0)">
        <rect width="460" height="115" rx="6" fill="#161b22" stroke="#8957e5"/>
        <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#a371f7">DefaultTracingObservationHandler</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Bridges to <tspan font-family="monospace" fill="#a371f7">micrometer-tracing-bridge-otel</tspan></text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Creates Span with high-cardinality tags (userId, orderId)</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Propagates W3C B3 / traceparent to downstream HTTP/gRPC</text>
      </g>

      <!-- Metrics Handler -->
      <g transform="translate(0, 130)">
        <rect width="460" height="115" rx="6" fill="#161b22" stroke="#d29922"/>
        <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">DefaultMeterObservationHandler</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Bridges to <tspan font-family="monospace" fill="#e3b341">MeterRegistry (Prometheus)</tspan></text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Increments Counter, updates Timer &amp; Percentiles</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Zero duplicate instrumentation overhead</text>
      </g>
    </g>
  </g>

  <!-- Arrow Engine -> Outlets -->
  <path d="M 860 345 L 890 345" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>

  <!-- Enterprise Actuator Outlets -->
  <g transform="translate(900, 105)">
    <rect width="260" height="480" rx="8" fill="url(#cardGrad4)" stroke="#30363d" stroke-width="2"/>
    <rect width="260" height="6" rx="3" fill="#d29922"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#e3b341">Actuator Outlets</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Telemetry Targets</text>

    <!-- Outlet 1: OTLP -->
    <g transform="translate(15, 75)">
      <rect width="230" height="110" rx="6" fill="#161b22" stroke="#8957e5"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#a371f7">OTLP Traces Export</text>
      <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Streams via gRPC / HTTP</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#79c0ff">→ Jaeger / Grafana Tempo</text>
      <text x="15" y="96" font-family="monospace" font-size="13" fill="#3fb950">Sub-second span export</text>
    </g>

    <!-- Outlet 2: Prometheus -->
    <g transform="translate(15, 205)">
      <rect width="230" height="120" rx="6" fill="#161b22" stroke="#d29922"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">/actuator/prometheus</text>
      <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Scraped by Prometheus</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">Provides raw text metrics</text>
      <text x="15" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">for Grafana dashboards</text>
    </g>

    <!-- Outlet 3: Structured JSON Logs -->
    <g transform="translate(15, 345)">
      <rect width="230" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#f0f6fc">Structured JSON Logs</text>
      <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Logstash / Vector ship to</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#79c0ff">Elasticsearch / Loki with</text>
      <text x="15" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#79c0ff">correlated trace IDs</text>
    </g>
  </g>

  <!-- Lower Section: Kubernetes Native Health Probes (Liveness & Readiness) -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="270" rx="8" fill="url(#cardGrad4)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#k8sGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">Kubernetes Cloud-Native Health Probes: Liveness vs. Readiness</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Preventing cascade crash loops while preserving high availability</text>

    <!-- Liveness -->
    <g transform="translate(20, 72)">
      <rect width="525" height="180" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="28" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">GET /actuator/health/liveness</text>
      <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Indicates whether internal JVM state is alive (no fatal deadlock / OOM).</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f85149">⚠️ Failure Action: Kubelet KILLS the pod and restarts container.</text>
      <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Rule of thumb: NEVER check external dependencies (DB/Kafka) here!</text>
      <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">If DB goes down, DB outage becomes entire cluster pod restart storm!</text>
    </g>

    <!-- Readiness -->
    <g transform="translate(565, 72)">
      <rect width="530" height="180" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="28" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">GET /actuator/health/readiness</text>
      <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Indicates whether application can safely accept incoming network traffic.</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#e3b341">⚠️ Failure Action: K8s removes pod IP from Service endpoints.</text>
      <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Pod stays alive to finish in-flight requests or warm up local caches.</text>
      <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Safe to verify DB connection pool availability here.</text>
    </g>
  </g>
</svg>