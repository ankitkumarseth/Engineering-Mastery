<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="aotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <marker id="arrowGreen3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowBlue3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad3)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Spring Boot 3 Auto-Configuration &amp; AOT Engine</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">From @EnableAutoConfiguration and AutoConfiguration.imports to @Conditional evaluation and GraalVM AOT</text>

  <!-- Top Row: 3 Architecture Steps -->
  <g transform="translate(40, 105)">
    <!-- Step 1: Trigger -->
    <g transform="translate(0, 0)">
      <rect width="350" height="235" rx="8" fill="url(#cardGrad3)" stroke="#30363d" stroke-width="2"/>
      <rect width="350" height="6" rx="3" fill="#58a6ff"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">1. Trigger &amp; Selection</text>
      <text x="20" y="60" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">@SpringBootApplication</text>
      <text x="35" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">meta-annotated with:</text>
      <text x="35" y="108" font-family="monospace" font-size="13" fill="#e3b341">@EnableAutoConfiguration</text>
      <text x="20" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Activates internal selector:</text>
      <text x="20" y="168" font-family="monospace" font-size="13" fill="#79c0ff">AutoConfigurationImportSelector</text>
      <text x="20" y="196" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Queries candidate configuration classes</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 355 120 L 415 120" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue3)"/>

    <!-- Step 2: Discovery File Shift -->
    <g transform="translate(425, 0)">
      <rect width="350" height="235" rx="8" fill="url(#cardGrad3)" stroke="#388bfd" stroke-width="2"/>
      <rect width="350" height="6" rx="3" fill="#388bfd"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#79c0ff">2. Discovery SPI Architecture</text>

      <!-- Legacy Boot 2.x -->
      <g transform="translate(15, 50)">
        <rect width="320" height="60" rx="4" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f85149">❌ DEPRECATED IN BOOT 3 (Legacy):</text>
        <text x="15" y="44" font-family="monospace" font-size="13" fill="#8b949e">META-INF/spring.factories</text>
      </g>

      <!-- Modern Boot 3.x -->
      <g transform="translate(15, 120)">
        <rect width="320" height="95" rx="4" fill="#161b22" stroke="#238636"/>
        <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#3fb950">✓ BOOT 3 PRODUCTION STANDARD:</text>
        <text x="15" y="48" font-family="monospace" font-size="13" fill="#7ee787">META-INF/spring/</text>
        <text x="15" y="70" font-family="monospace" font-size="13" fill="#7ee787">org.springframework.boot.autoconfigure.</text>
        <text x="15" y="88" font-family="monospace" font-size="13" fill="#7ee787">AutoConfiguration.imports</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 780 120 L 800 120" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue3)"/>

    <!-- Step 3: Ordering & DAG -->
    <g transform="translate(810, 0)">
      <rect width="350" height="235" rx="8" fill="url(#cardGrad3)" stroke="#30363d" stroke-width="2"/>
      <rect width="350" height="6" rx="3" fill="#e3b341"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#e3b341">3. Ordering &amp; DAG Sorting</text>
      <text x="20" y="60" font-family="monospace" font-size="13" fill="#7ee787">@AutoConfigureOrder(HIGHEST)</text>
      <text x="20" y="84" font-family="monospace" font-size="13" fill="#79c0ff">@AutoConfiguration(</text>
      <text x="35" y="108" font-family="monospace" font-size="13" fill="#e3b341">  after = DataSourceAutoConfig.class,</text>
      <text x="35" y="132" font-family="monospace" font-size="13" fill="#e3b341">  before = WebMvcAutoConfig.class)</text>
      <text x="20" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Sorts candidate DAG before filtering</text>
      <text x="20" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Guarantees deterministic bean graph</text>
    </g>
  </g>

  <!-- Step 4: The @Conditional Evaluation Pipeline -->
  <g transform="translate(40, 365)">
    <rect width="1120" height="240" rx="8" fill="url(#cardGrad3)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#headerGrad3)"/>
    <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3fb950">4. Conditional Filtering Pipeline (OnCondition Evaluation)</text>
    <text x="25" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Evaluates ClassLoader existence, bean definition presence, and environment properties</text>

    <!-- 3 Condition Cards -->
    <g transform="translate(20, 72)">
      <!-- Condition 1 -->
      <g transform="translate(0, 0)">
        <rect width="345" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">@ConditionalOnClass</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Checks JVM ClassLoader:</text>
        <text x="15" y="78" font-family="monospace" font-size="13" fill="#79c0ff">KafkaTemplate.class</text>
        <text x="15" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">If JAR not on classpath → Skip bean</text>
      </g>

      <!-- Condition 2 -->
      <g transform="translate(365, 0)">
        <rect width="350" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">@ConditionalOnMissingBean</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">User-Override Precedence:</text>
        <text x="15" y="78" font-family="monospace" font-size="13" fill="#79c0ff">SecurityFilterChain.class</text>
        <text x="15" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Backs off immediately if app defined bean</text>
      </g>

      <!-- Condition 3 -->
      <g transform="translate(735, 0)">
        <rect width="345" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">@ConditionalOnProperty</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Externalized Config Toggle:</text>
        <text x="15" y="78" font-family="monospace" font-size="13" fill="#7ee787">prefix="app.feature",</text>
        <text x="15" y="100" font-family="monospace" font-size="13" fill="#7ee787">name="enabled", havingValue="true"</text>
        <text x="15" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Evaluates Environment properties</text>
      </g>
    </g>
  </g>

  <!-- Step 5: GraalVM AOT Compilation & Native Image -->
  <g transform="translate(40, 630)">
    <rect width="1120" height="240" rx="8" fill="url(#cardGrad3)" stroke="#8957e5" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#aotGrad)"/>
    <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#a371f7">5. Spring Boot 3 GraalVM AOT Reachability Analysis</text>
    <text x="25" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Ahead-Of-Time (AOT) compilation transforms dynamic runtime reflection into static build-time code:</text>
    <text x="25" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#8b949e">• <tspan fill="#79c0ff" font-family="monospace">mvn spring-boot:process-aot</tspan> evaluates bean definitions, condition checks, and proxies at build time.</text>
    <text x="25" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#8b949e">• Generates <tspan fill="#e3b341" font-family="monospace">reflect-config.json</tspan> and <tspan fill="#e3b341" font-family="monospace">proxy-config.json</tspan> hints required by GraalVM native compiler.</text>
    <text x="25" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#8b949e">• Completely eliminates runtime ClassLoader reflection and bytecode generation in production.</text>
    <text x="25" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#7ee787">🚀 Result: Native Linux ELF binary starts in 0.03 seconds with &lt; 40MB RSS memory footprint.</text>
  </g>
</svg>