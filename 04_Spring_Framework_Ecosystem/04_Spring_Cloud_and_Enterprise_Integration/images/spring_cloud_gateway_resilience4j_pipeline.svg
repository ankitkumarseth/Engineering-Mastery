<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
    <linearGradient id="stateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <marker id="arrowBlue6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGold6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3b341" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad6)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Spring Cloud Gateway &amp; Resilience4j Circuit Breaker Pipeline</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Non-Blocking Netty Event Loop, Redis Token Bucket Rate Limiting, and Fault-Tolerant Circuit State Machine</text>

  <!-- Inbound Traffic -->
  <g transform="translate(40, 105)">
    <rect width="270" height="480" rx="8" fill="url(#cardGrad6)" stroke="#30363d" stroke-width="2"/>
    <rect width="270" height="6" rx="3" fill="#58a6ff"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">1. Netty Ingress</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Non-blocking EventLoop</text>

    <!-- Route Predicates -->
    <g transform="translate(15, 75)">
      <rect width="240" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">Route Predicates</text>
      <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Path=/api/v1/orders/**</text>
      <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Header=X-Tenant, US</text>
      <text x="15" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Weight=group1, 80</text>
    </g>

    <!-- Redis Token Bucket -->
    <g transform="translate(15, 205)">
      <rect width="240" height="120" rx="6" fill="#161b22" stroke="#d29922"/>
      <text x="15" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">Redis Token Bucket</text>
      <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">RateLimiter Filter (Atomic Lua)</text>
      <text x="15" y="72" font-family="monospace" font-size="13" fill="#79c0ff">Replenish: 5k req/sec</text>
      <text x="15" y="94" font-family="monospace" font-size="13" fill="#e3b341">Burst Capacity: 10k tokens</text>
    </g>

    <g transform="translate(15, 345)">
      <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">If limit exceeded:</text>
      <text x="5" y="52" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">HTTP 429 Too Many Requests</text>
      <text x="5" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Short-circuits before backend</text>
      <text x="5" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Zero backend resource burn</text>
    </g>
  </g>

  <!-- Arrow Ingress -> Resilience4j -->
  <path d="M 310 345 L 340 345" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue6)"/>

  <!-- Resilience4j Gateway Filter -->
  <g transform="translate(350, 105)">
    <rect width="520" height="480" rx="8" fill="url(#cardGrad6)" stroke="#d29922" stroke-width="2"/>
    <rect width="520" height="6" rx="3" fill="url(#resGrad)"/>
    <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#e3b341">2. Resilience4j Circuit Breaker Filter</text>
    <text x="25" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">CircuitBreakerGatewayFilterFactory &amp; Sliding Window State Machine</text>

    <!-- State Machine Container -->
    <g transform="translate(15, 75)">
      <rect width="490" height="175" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Circuit Breaker 3-State Machine:</text>

      <!-- 3 States -->
      <g transform="translate(10, 42)">
        <!-- CLOSED -->
        <g transform="translate(0, 0)">
          <rect width="145" height="110" rx="4" fill="#0d1117" stroke="#238636"/>
          <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">CLOSED</text>
          <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Normal operation.</text>
          <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Passes all calls.</text>
          <text x="12" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">FailureRate &lt; 50%</text>
        </g>

        <!-- Arrow to OPEN -->
        <path d="M 148 55 L 168 55" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#arrowGold6)"/>

        <!-- OPEN -->
        <g transform="translate(172, 0)">
          <rect width="145" height="110" rx="4" fill="#0d1117" stroke="#da3633"/>
          <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">OPEN</text>
          <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f85149">Tripped! Fast-fails.</text>
          <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Zero calls sent.</text>
          <text x="12" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e3b341">waitDuration=10s</text>
        </g>

        <!-- Arrow to HALF_OPEN -->
        <path d="M 320 55 L 340 55" fill="none" stroke="#e3b341" stroke-width="2" marker-end="url(#arrowGold6)"/>

        <!-- HALF_OPEN -->
        <g transform="translate(344, 0)">
          <rect width="125" height="110" rx="4" fill="#0d1117" stroke="#d29922"/>
          <text x="10" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">HALF_OPEN</text>
          <text x="10" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Trial probe.</text>
          <text x="10" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Allows 10 calls.</text>
          <text x="10" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#7ee787">Recovers if OK</text>
        </g>
      </g>
    </g>

    <!-- Circuit Config Details -->
    <g transform="translate(15, 265)">
      <rect width="490" height="195" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">Resilience4j YAML Configuration Tuning:</text>
      <text x="15" y="52" font-family="monospace" font-size="13" fill="#79c0ff">slidingWindowType: COUNT_BASED (windowSize: 100)</text>
      <text x="15" y="74" font-family="monospace" font-size="13" fill="#79c0ff">failureRateThreshold: 50.0 (Trips if &gt;= 50 failures)</text>
      <text x="15" y="96" font-family="monospace" font-size="13" fill="#79c0ff">slowCallRateThreshold: 70.0 (Duration &gt; 2000ms)</text>
      
      <!-- Fallback Box -->
      <g transform="translate(12, 110)">
        <rect width="465" height="70" rx="4" fill="#0d1117" stroke="#238636"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Fallback Routing: forward:/fallback/orders</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Routes to degraded cache / static response during outages</text>
      </g>
    </g>
  </g>

  <!-- Arrow Resilience4j -> Downstream -->
  <path d="M 870 345 L 900 345" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue6)"/>

  <!-- Downstream Routing & Load Balancing -->
  <g transform="translate(910, 105)">
    <rect width="250" height="480" rx="8" fill="url(#cardGrad6)" stroke="#30363d" stroke-width="2"/>
    <rect width="250" height="6" rx="3" fill="#238636"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3fb950">3. Downstream Hop</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Target Service Routing</text>

    <!-- Cloud-Native K8s DNS -->
    <g transform="translate(15, 75)">
      <rect width="220" height="110" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">Kubernetes DNS (CoreDNS)</text>
      <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">http://order-service</text>
      <text x="15" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">.prod.svc.cluster.local</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">✓ Modern cloud-native</text>
    </g>

    <!-- Spring Cloud Discovery (Eureka/Consul) -->
    <g transform="translate(15, 205)">
      <rect width="220" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">Spring Cloud Discovery</text>
      <text x="15" y="48" font-family="monospace" font-size="13" fill="#79c0ff">lb://order-service</text>
      <text x="15" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Eureka / Consul registry</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Client-side load balancer</text>
    </g>

    <g transform="translate(15, 345)">
      <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">Post-Filter Execution:</text>
      <text x="5" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Add security headers</text>
      <text x="5" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Record hop duration</text>
      <text x="5" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Non-blocking Netty stream</text>
    </g>
  </g>

  <!-- Bottom Comparison: Eureka vs Kubernetes Native Discovery -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="270" rx="8" fill="url(#cardGrad6)" stroke="#8957e5" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#stateGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#a371f7">Staff / Principal Architectural Trade-Off: Spring Cloud Eureka vs. Kubernetes Native Service Discovery</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Application-layer heartbeat registries vs infrastructure-layer native IP table routing</text>

    <!-- Eureka Side -->
    <g transform="translate(20, 72)">
      <rect width="525" height="180" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#e3b341">Spring Cloud Eureka / Consul (Application Layer)</text>
      <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Heavyweight: Requires dedicated Eureka Server clusters and 30s heartbeats.</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Stale Registry Lag: Up to 30s delay for crashed pod eviction (causes 503 errors!).</text>
      <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Language Locked: Java-centric; non-Java services struggle with SDK integration.</text>
      <text x="20" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• High memory footprint: each service maintains full client-side cache.</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">⚠️ Obsolete in pure Kubernetes environments.</text>
    </g>

    <!-- K8s Side -->
    <g transform="translate(565, 72)">
      <rect width="530" height="180" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#3fb950">Kubernetes CoreDNS + K8s Services (Infrastructure Layer)</text>
      <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Zero Application Overhead: Native DNS resolution baked into Linux network stack.</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Instant Endpoint Updates: Kube-proxy updates IP tables immediately on pod death.</text>
      <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Polyglot Support: Works seamlessly across Go, Node, Python, and Java services.</text>
      <text x="20" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Service Mesh Ready: Integrates transparently with Istio / Linkerd sidecars.</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Modern Enterprise Gold Standard for microservice meshes.</text>
    </g>
  </g>
</svg>