<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradApi4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="leakyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="fixedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="slidingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradApi4)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Rate Limiting Algorithms: Engineering Trade-Off Matrix</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Comparing Token Bucket, Leaky Bucket, Fixed Window Boundary Hazard, and Sliding Window Counter</text>

  <!-- Algorithm 1: Token Bucket -->
  <g transform="translate(40, 105)">
    <rect width="265" height="470" rx="8" fill="url(#cardGradApi4)" stroke="#388bfd" stroke-width="2"/>
    <rect width="265" height="6" rx="3" fill="url(#tokenGrad)"/>
    <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#58a6ff">1. Token Bucket</text>
    <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">AWS, Stripe, Spring Gateway</text>

    <!-- Visual Bucket -->
    <rect x="12" y="75" width="241" height="120" rx="6" fill="#161b22" stroke="#388bfd" stroke-dasharray="3 3"/>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#79c0ff">Refill: 10 tokens/sec</text>
    <text x="20" y="124" font-family="monospace" font-size="13" fill="#e3b341">[🪙][🪙][🪙][🪙][🪙]</text>
    <text x="20" y="146" font-family="monospace" font-size="13" fill="#e3b341">[🪙][🪙][🪙][🪙][🪙]</text>
    <text x="20" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">Max Capacity: 20 tokens</text>
    <text x="20" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e">1 Request consumes 1 token</text>

    <text x="16" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="16" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Allows temporary bursts</text>
    <text x="26" y="268" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">up to maximum bucket size</text>
    <text x="16" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">✓ Smooth average rate enforcement</text>
    <text x="16" y="324" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#79c0ff">✓ O(1) Memory in Redis</text>
    <text x="26" y="344" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Stores timestamp + token count</text>
    <text x="16" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#58a6ff">✓ Best for general REST APIs</text>
    <text x="16" y="414" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">where natural bursts occur.</text>
  </g>

  <!-- Algorithm 2: Leaky Bucket -->
  <g transform="translate(325, 105)">
    <rect width="265" height="470" rx="8" fill="url(#cardGradApi4)" stroke="#8957e5" stroke-width="2"/>
    <rect width="265" height="6" rx="3" fill="url(#leakyGrad)"/>
    <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#a371f7">2. Leaky Bucket</text>
    <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Traffic Shaping (NGINX)</text>

    <!-- Visual Leaky -->
    <rect x="12" y="75" width="241" height="120" rx="6" fill="#161b22" stroke="#8957e5" stroke-dasharray="3 3"/>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#d2a8ff">FIFO Buffer Queue (Cap = 20)</text>
    <text x="20" y="124" font-family="monospace" font-size="13" fill="#a371f7">[Req][Req][Req][Req]</text>
    <text x="20" y="148" font-family="monospace" font-size="13" fill="#f85149">Drops requests if queue full</text>
    <text x="20" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">Drips at constant: 5 req/s</text>
    <text x="20" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e">Smooth continuous outflow</text>

    <text x="16" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="16" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#a371f7">✓ Enforces STRICT constant rate</text>
    <text x="26" y="268" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Zero spikes passed downstream</text>
    <text x="16" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">✓ Smooths irregular client traffic</text>
    <text x="16" y="324" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">⚠️ Bursts queued: adds latency</text>
    <text x="26" y="344" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">to legitimate fast callers</text>
    <text x="16" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#a371f7">✓ Best for fragile backends</text>
    <text x="16" y="414" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">e.g. legacy mainframes &amp; DBs.</text>
  </g>

  <!-- Algorithm 3: Fixed Window Counter -->
  <g transform="translate(610, 105)">
    <rect width="265" height="470" rx="8" fill="url(#cardGradApi4)" stroke="#da3633" stroke-width="2"/>
    <rect width="265" height="6" rx="3" fill="url(#fixedGrad)"/>
    <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">3. Fixed Window</text>
    <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">The 2x Boundary Hazard</text>

    <!-- Visual Fixed Window -->
    <rect x="12" y="75" width="241" height="120" rx="6" fill="#161b22" stroke="#da3633" stroke-dasharray="3 3"/>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">Limit: 100 req/minute</text>
    <text x="20" y="124" font-family="monospace" font-size="13" fill="#e3b341">10:00:59 -&gt; 100 requests</text>
    <text x="20" y="146" font-family="monospace" font-size="13" fill="#e3b341">10:01:01 -&gt; 100 requests</text>
    <text x="20" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">200 Requests in 2 seconds!</text>
    <text x="20" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e">2x Limit across window edge!</text>

    <text x="16" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="16" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Trivial implementation: INCR</text>
    <text x="26" y="268" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Simple counter with TTL in Redis</text>
    <text x="16" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#79c0ff">✓ Lowest memory usage</text>
    <text x="16" y="324" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">❌ The Boundary Flaw:</text>
    <text x="26" y="344" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Allows 2x burst across reset</text>
    <text x="16" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f85149">⚠️ Avoid for strict APIs</text>
    <text x="16" y="414" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Allows periodic traffic overload.</text>
  </g>

  <!-- Algorithm 4: Sliding Window Counter -->
  <g transform="translate(895, 105)">
    <rect width="265" height="470" rx="8" fill="url(#cardGradApi4)" stroke="#238636" stroke-width="2"/>
    <rect width="265" height="6" rx="3" fill="url(#slidingGrad)"/>
    <text x="16" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">4. Sliding Window</text>
    <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Cloudflare Approximation</text>

    <!-- Visual Formula Box -->
    <rect x="12" y="75" width="241" height="120" rx="6" fill="#161b22" stroke="#238636" stroke-dasharray="3 3"/>
    <text x="20" y="100" font-family="monospace" font-size="13" fill="#7ee787">Approximation Formula:</text>
    <text x="20" y="124" font-family="monospace" font-size="13" fill="#f0f6fc">Rate = Cur_Count +</text>
    <text x="20" y="146" font-family="monospace" font-size="13" fill="#f0f6fc">       Prev_Count * (1 - %)</text>
    <text x="20" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">Where % is elapsed window %</text>
    <text x="20" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e">Smooths boundary spike to &lt;0.05%</text>

    <text x="16" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="16" y="248" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#3fb950">✓ Solves the boundary burst flaw</text>
    <text x="26" y="268" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">without expensive timestamp logs</text>
    <text x="16" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Extreme memory efficiency</text>
    <text x="26" y="316" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Stores only TWO integers in Redis</text>
    <text x="16" y="344" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">✓ Fast arithmetic in Redis Lua script</text>
    <text x="16" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#3fb950">✓ Best for massive scale APIs</text>
    <text x="16" y="414" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">where log storage is cost-prohibitive.</text>
  </g>

  <!-- Bottom Panel: Redis Atomic Lua Script Execution -->
  <g transform="translate(40, 595)">
    <rect width="1120" height="280" rx="8" fill="url(#cardGradApi4)" stroke="#e3b341" stroke-width="2"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#e3b341">Why Distributed Rate Limiting REQUIRES Atomic Redis Lua Scripts</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Eliminating race conditions and indefinite user lockout bugs across distributed clusters</text>

    <!-- Flaw vs Lua -->
    <g transform="translate(20, 72)">
      <!-- Left: The INCR + EXPIRE Race Condition -->
      <g transform="translate(0, 0)">
        <rect width="525" height="185" rx="6" fill="#161b22" stroke="#da3633"/>
        <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f85149">The Multi-Step Race Condition Trap:</text>
        <text x="20" y="56" font-family="monospace" font-size="13" fill="#f85149">1. redis.incr(key); // Increments counter to 1</text>
        <text x="20" y="80" font-family="monospace" font-size="13" fill="#f85149">2. // 💥 APP CRASHES OR NETWORK TIMEOUT BEFORE STEP 3!</text>
        <text x="20" y="104" font-family="monospace" font-size="13" fill="#8b949e">3. redis.expire(key, 60); // NEVER RUNS!</text>
        <text x="20" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Catastrophic Result: Key has NO TTL; counter persists permanently!</text>
        <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">User is permanently blocked forever after reaching rate limit once!</text>
      </g>

      <!-- Right: Atomic Lua Solution -->
      <g transform="translate(550, 0)">
        <rect width="530" height="185" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#3fb950">The Production Solution: Redis Lua Script</text>
        <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Redis executes Lua scripts as a <tspan fill="#7ee787" font-weight="700">single atomic transaction</tspan>.</text>
        <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Zero intermediate race conditions across distributed gateway nodes.</text>
        <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Evaluates token math, updates counter, and sets TTL in 1 round-trip (&lt;0.5ms).</text>
        <text x="20" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Key is guaranteed to expire even during total gateway node crashes.</text>
        <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Standard in Spring Cloud Gateway RedisRateLimiter &amp; Envoy.</text>
      </g>
    </g>
  </g>
</svg>