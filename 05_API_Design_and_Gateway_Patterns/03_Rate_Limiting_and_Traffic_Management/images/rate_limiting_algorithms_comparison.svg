<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradApi4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="leakyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="fixedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="slidingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="url(#bgGradApi4)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Rate Limiting Algorithms: Engineering Trade-Off Matrix</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">Comparing Token Bucket, Leaky Bucket, Fixed Window Boundary Hazard, and Sliding Window Counter</text>

  <!-- Algorithm 1: Token Bucket -->
  <g transform="translate(40, 105)">
    <rect width="240" height="380" rx="8" fill="url(#cardGradApi4)" stroke="#388bfd" stroke-width="1.5"/>
    <rect width="240" height="6" rx="3" fill="url(#tokenGrad)"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#58a6ff">1. Token Bucket</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">AWS, Stripe, Spring Gateway Standard</text>

    <!-- Visual Bucket -->
    <rect x="25" y="70" width="190" height="110" rx="6" fill="#161b22" stroke="#388bfd" stroke-dasharray="2 2"/>
    <text x="35" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#79c0ff">Refill: 10 tokens/sec</text>
    <text x="35" y="112" font-family="monospace" font-size="10" fill="#e3b341">[🪙][🪙][🪙][🪙][🪙]</text>
    <text x="35" y="132" font-family="monospace" font-size="10" fill="#e3b341">[🪙][🪙][🪙][🪙][🪙]</text>
    <text x="35" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#7ee787">Max Capacity: 20 tokens</text>
    <text x="35" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8b949e">1 Request consumes 1 token</text>

    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="20" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">✓ Allows temporary traffic bursts</text>
    <text x="30" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">up to maximum bucket capacity.</text>
    <text x="20" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">✓ Smooth average rate enforcement.</text>
    <text x="20" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#79c0ff">✓ Memory: O(1) in Redis (stores</text>
    <text x="30" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">last_timestamp and token_count).</text>
    <text x="20" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#58a6ff">✅ Best for general REST APIs</text>
    <text x="20" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#8b949e">where user bursts are legitimate.</text>
  </g>

  <!-- Algorithm 2: Leaky Bucket -->
  <g transform="translate(300, 105)">
    <rect width="240" height="380" rx="8" fill="url(#cardGradApi4)" stroke="#8957e5" stroke-width="1.5"/>
    <rect width="240" height="6" rx="3" fill="url(#leakyGrad)"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#a371f7">2. Leaky Bucket</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Smooth Constant Rate Shaper</text>

    <!-- Visual Bucket -->
    <rect x="25" y="70" width="190" height="110" rx="6" fill="#161b22" stroke="#8957e5" stroke-dasharray="2 2"/>
    <text x="35" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#c9d1d9">FIFO Inbound Buffer Queue</text>
    <rect x="35" y="102" width="170" height="20" rx="3" fill="#21262d"/>
    <text x="45" y="116" font-family="monospace" font-size="9" fill="#a371f7">[Req 1][Req 2][Req 3]...</text>
    <text x="35" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#3fb950">Constant Outflow: 5 req/sec</text>
    <text x="35" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#f85149">Drops excess if queue full</text>

    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="20" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#a371f7">✓ Enforces STRICT constant rate;</text>
    <text x="30" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">zero traffic spikes reach backend.</text>
    <text x="20" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#f85149">❌ Adds latency: Requests queue up</text>
    <text x="30" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">even if backend has idle capacity.</text>
    <text x="20" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">✓ Memory: O(queue_size).</text>
    <text x="20" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#a371f7">✅ Best for egress write rate</text>
    <text x="20" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#8b949e">shaping to legacy third-party APIs.</text>
  </g>

  <!-- Algorithm 3: Fixed Window Boundary Hazard -->
  <g transform="translate(560, 105)">
    <rect width="240" height="380" rx="8" fill="url(#cardGradApi4)" stroke="#da3633" stroke-width="1.5"/>
    <rect width="240" height="6" rx="3" fill="url(#fixedGrad)"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f85149">3. Fixed Window</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">The 2x Boundary Burst Hazard</text>

    <!-- Visual Spike -->
    <rect x="25" y="70" width="190" height="110" rx="6" fill="#161b22" stroke="#da3633" stroke-dasharray="2 2"/>
    <text x="35" y="90" font-family="monospace" font-size="9" fill="#8b949e">Window 1 (00:00-01:00): Limit 100</text>
    <text x="35" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#f85149">At 00:59: 100 requests arrive!</text>
    <text x="35" y="128" font-family="monospace" font-size="9" fill="#8b949e">Window 2 (01:00-02:00): Resets to 0</text>
    <text x="35" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#f85149">At 01:01: 100 requests arrive!</text>
    <text x="35" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f85149">💥 200 REQS IN 2 SECONDS!</text>

    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="20" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">✓ Trivial implementation: Redis INCR</text>
    <text x="30" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">with an expiration TTL.</text>
    <text x="20" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#f85149">❌ Boundary Flaw: Allows 2x configured</text>
    <text x="30" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">limit during window transitions.</text>
    <text x="20" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">✓ Memory: O(1).</text>
    <text x="20" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f85149">⚠️ Avoid for sensitive Tier-0</text>
    <text x="20" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#8b949e">services vulnerable to 2x spikes.</text>
  </g>

  <!-- Algorithm 4: Sliding Window Counter -->
  <g transform="translate(820, 105)">
    <rect width="240" height="380" rx="8" fill="url(#cardGradApi4)" stroke="#238636" stroke-width="1.5"/>
    <rect width="240" height="6" rx="3" fill="url(#slidingGrad)"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3fb950">4. Sliding Counter</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Cloudflare Hybrid Approximation</text>

    <!-- Visual Formula Box -->
    <rect x="25" y="70" width="190" height="110" rx="6" fill="#161b22" stroke="#238636" stroke-dasharray="2 2"/>
    <text x="35" y="92" font-family="monospace" font-size="9.5" fill="#7ee787">Approximation Formula:</text>
    <text x="35" y="112" font-family="monospace" font-size="9" fill="#f0f6fc">Rate = Current_Count +</text>
    <text x="35" y="128" font-family="monospace" font-size="9" fill="#f0f6fc">       Prev_Count * (1 - %)</text>
    <text x="35" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8b949e">Where % is elapsed window %</text>
    <text x="35" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#7ee787">Smooths boundary spike to &lt; 0.05%</text>

    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">Core Characteristics:</text>
    <text x="20" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#3fb950">✓ Solves the boundary burst flaw</text>
    <text x="30" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">without expensive timestamp logs.</text>
    <text x="20" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">✓ Extreme memory efficiency: Stores</text>
    <text x="30" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">only TWO integers per user in Redis.</text>
    <text x="20" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">✓ Fast arithmetic in Redis Lua script.</text>
    <text x="20" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#3fb950">✅ Best for massive scale APIs</text>
    <text x="20" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#8b949e">where log storage is cost-prohibitive.</text>
  </g>

  <!-- Bottom Panel: Redis Atomic Lua Script Execution -->
  <g transform="translate(40, 505)">
    <rect width="1020" height="175" rx="8" fill="url(#cardGradApi4)" stroke="#e3b341" stroke-width="1.5"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e3b341">Why Distributed Rate Limiting REQUIRES Atomic Redis Lua Scripts</text>

    <!-- Flaw vs Lua -->
    <g transform="translate(25, 45)">
      <!-- Left: The INCR + EXPIRE Race Condition -->
      <rect width="470" height="115" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f85149">The Multi-Step Race Condition Trap:</text>
      <text x="20" y="46" font-family="monospace" font-size="10" fill="#f85149">1. redis.incr(key); // Increments counter</text>
      <text x="20" y="62" font-family="monospace" font-size="10" fill="#f85149">2. // 💥 APP CRASHES / NETWORK PARTITION BEFORE NEXT LINE!</text>
      <text x="20" y="78" font-family="monospace" font-size="10" fill="#8b949e">3. redis.expire(key, 60); // NEVER RUNS!</text>
      <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">Result: Key has NO TTL; user is PERMANENTLY BLOCKED forever!</text>
    </g>

    <g transform="translate(525, 45)">
      <!-- Right: Atomic Lua Solution -->
      <rect width="470" height="115" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#3fb950">The Production Solution: Redis Lua Script</text>
      <text x="20" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• Redis executes Lua scripts as a <tspan fill="#7ee787" font-weight="700">single atomic operation</tspan>.</text>
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• Zero intermediate race conditions across distributed microservice fleets.</text>
      <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• Evaluates token math, updates counter, and sets TTL in a single round-trip (&lt; 0.5ms).</text>
      <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">✓ Supported natively by Spring Cloud Gateway RedisRateLimiter.</text>
    </g>
  </g>
</svg>
