<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradApi5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <marker id="arrowBlueBff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreenBff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowPurpleBff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradApi5)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">API Gateway &amp; Backend-For-Frontend (BFF) Architecture</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Decoupling Channel-Specific Needs: Mobile Latency Aggregation, Web Richness, and Partner B2B Governance</text>

  <!-- Left Column: Heterogeneous Client Channels -->
  <g transform="translate(40, 105)">
    <!-- Mobile Client -->
    <g transform="translate(0, 0)">
      <rect width="250" height="145" rx="6" fill="url(#cardGradApi5)" stroke="#388bfd" stroke-width="1.5"/>
      <rect width="6" height="145" rx="3" fill="#388bfd"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#58a6ff">Mobile Apps (iOS / Android)</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• High latency radio penalties</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Constrained battery &amp; bandwidth</text>
      <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Slow client rollout cycles</text>
      <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Needs 1 compact aggregated call</text>
    </g>

    <!-- Web Client -->
    <g transform="translate(0, 165)">
      <rect width="250" height="145" rx="6" fill="url(#cardGradApi5)" stroke="#2ea043" stroke-width="1.5"/>
      <rect width="6" height="145" rx="3" fill="#2ea043"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">Desktop Web SPA</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• High-bandwidth broadband fiber</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Large desktop screen real estate</text>
      <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Instant continuous web deployments</text>
      <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Rich multi-tab tabular views</text>
    </g>

    <!-- Third-Party Partners -->
    <g transform="translate(0, 330)">
      <rect width="250" height="145" rx="6" fill="url(#cardGradApi5)" stroke="#a371f7" stroke-width="1.5"/>
      <rect width="6" height="145" rx="3" fill="#a371f7"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#a371f7">B2B Partners / Developers</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Server-to-server batch callers</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Strict mutual TLS authentication</text>
      <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Multi-year backward compatibility</text>
      <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Strict quota rate limiting</text>
    </g>
  </g>

  <!-- Connection Arrows: Clients -> BFF -->
  <path d="M 290 177 L 350 177" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlueBff)"/>
  <path d="M 290 342 L 350 342" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreenBff)"/>
  <path d="M 290 507 L 350 507" fill="none" stroke="#a371f7" stroke-width="2.5" marker-end="url(#arrowPurpleBff)"/>

  <!-- Middle Column: BFF Layer -->
  <g transform="translate(360, 105)">
    <!-- Mobile BFF -->
    <g transform="translate(0, 0)">
      <rect width="440" height="145" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
      <text x="20" y="28" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Mobile BFF (Spring Cloud Gateway / Node)</text>
      <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Single endpoint: <tspan fill="#79c0ff" font-family="monospace">GET /mobile/dashboard</tspan></text>
      <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Parallel in-cluster async joins (CompletableFuture / WebClient)</text>
      <text x="20" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Trims unused fields (80% bandwidth compression)</text>
      <text x="20" y="126" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">Owned &amp; deployed by Mobile Team</text>
    </g>

    <!-- Web BFF -->
    <g transform="translate(0, 165)">
      <rect width="440" height="145" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
      <text x="20" y="28" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Web BFF (GraphQL Gateway / Java)</text>
      <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Serves complex GraphQL query federation</text>
      <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Server-Side Rendering (SSR) cache integration</text>
      <text x="20" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Real-time WebSocket subscriptions</text>
      <text x="20" y="126" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">Owned &amp; deployed by Web Frontend Team</text>
    </g>

    <!-- Partner Gateway -->
    <g transform="translate(0, 330)">
      <rect width="440" height="145" rx="6" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
      <text x="20" y="28" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Enterprise Partner B2B Gateway (Apigee / Envoy)</text>
      <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Enforces API Key, OAuth2 client_credentials &amp; mTLS</text>
      <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Strict monetization billing &amp; quota rate limiting</text>
      <text x="20" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Canonical stable OpenAPI specification governance</text>
      <text x="20" y="126" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">Owned &amp; managed by API Platform Team</text>
    </g>
  </g>

  <!-- Connection Arrows: BFF -> Services -->
  <path d="M 800 177 L 850 177" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlueBff)"/>
  <path d="M 800 342 L 850 342" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreenBff)"/>
  <path d="M 800 507 L 850 507" fill="none" stroke="#a371f7" stroke-width="2.5" marker-end="url(#arrowPurpleBff)"/>

  <!-- Right Column: Internal Microservices Fleet -->
  <g transform="translate(860, 105)">
    <!-- User Service -->
    <rect x="0" y="0" width="300" height="105" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="30" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">User &amp; Profile Service</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Internal high-speed gRPC / REST</text>
    <text x="20" y="78" font-family="monospace" font-size="13" fill="#7ee787">gRPC: UserService.GetProfile()</text>

    <!-- Orders Service -->
    <rect x="0" y="125" width="300" height="105" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="30" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">Order Management Service</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Transactional Order Ledger</text>
    <text x="20" y="78" font-family="monospace" font-size="13" fill="#7ee787">gRPC: OrderService.GetOrder()</text>

    <!-- Inventory Service -->
    <rect x="0" y="250" width="300" height="105" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="30" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">Inventory &amp; Stock Service</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Real-time reservation checks</text>
    <text x="20" y="78" font-family="monospace" font-size="13" fill="#7ee787">gRPC: Inventory.CheckStock()</text>

    <!-- Payments Service -->
    <rect x="0" y="375" width="300" height="100" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="30" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">Payment Switch &amp; Settlement</text>
    <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Tier-0 Core Financial Switch</text>
    <text x="20" y="78" font-family="monospace" font-size="13" fill="#f85149">Sub-millisecond auth routing</text>
  </g>

  <!-- Bottom Banner: Generic vs BFF Trade-Off -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="270" rx="8" fill="url(#cardGradApi5)" stroke="#30363d" stroke-width="2"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f0f6fc">Staff / Principal Architectural Trade-Off: Generic API Gateway vs. Dedicated BFFs</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Comparing organizational coupling, blast radius, and delivery velocity</text>

    <!-- Flaw -->
    <g transform="translate(20, 72)">
      <rect width="525" height="180" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f85149">The "One Generic Gateway" Anti-Pattern:</text>
      <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• One centralized team owns the gateway, becoming a delivery bottleneck.</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Mobile is forced to make 10 round-trips or accept massive 500KB JSON payloads.</text>
      <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Changing an endpoint for Web risks breaking Mobile apps in production.</text>
      <text x="20" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Blast radius: outage takes down all clients simultaneously.</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">❌ High coupling across frontend teams and fragile releases.</text>
    </g>

    <!-- BFF Advantage -->
    <g transform="translate(565, 72)">
      <rect width="530" height="180" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#3fb950">The Backend-For-Frontend (BFF) Pattern:</text>
      <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Frontend teams own their own BFF (Mobile team owns Mobile BFF).</text>
      <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• BFF aggregates downstream services in-cluster over high-speed gRPC.</text>
      <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Client receives tailored, bandwidth-optimized payloads.</text>
      <text x="20" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Isolated blast radius: mobile bug never touches web or partner traffic.</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Independent deployment cycles and zero cross-channel regressions.</text>
    </g>
  </g>
</svg>