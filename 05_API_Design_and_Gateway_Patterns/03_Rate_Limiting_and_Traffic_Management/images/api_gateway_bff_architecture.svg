<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradApi5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="mobileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="partnerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <marker id="arrowBlueBff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreenBff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowPurpleBff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="url(#bgGradApi5)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">API Gateway &amp; Backend-For-Frontend (BFF) Architecture</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">Decoupling Channel-Specific Needs: Optimizing Mobile Latency, Web Richness, and Partner B2B Governance</text>

  <!-- Left Column: Heterogeneous Client Channels -->
  <g transform="translate(40, 105)">
    <!-- Mobile Client -->
    <g transform="translate(0, 0)">
      <rect width="210" height="110" rx="6" fill="url(#cardGradApi5)" stroke="#388bfd" stroke-width="1.5"/>
      <rect width="6" height="110" rx="3" fill="#388bfd"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#58a6ff">Mobile Apps (iOS/Android)</text>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">• Constrained radio network</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">• High latency penalties</text>
      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">• Needs 1 compact aggregated call</text>
    </g>

    <!-- Web Client -->
    <g transform="translate(0, 130)">
      <rect width="210" height="110" rx="6" fill="url(#cardGradApi5)" stroke="#2ea043" stroke-width="1.5"/>
      <rect width="6" height="110" rx="3" fill="#2ea043"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#3fb950">Desktop Web SPA</text>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">• High-bandwidth broadband</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">• Large screen real estate</text>
      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">• Rich tabular sorting &amp; analytics</text>
    </g>

    <!-- Third-Party Partners -->
    <g transform="translate(0, 260)">
      <rect width="210" height="110" rx="6" fill="url(#cardGradApi5)" stroke="#a371f7" stroke-width="1.5"/>
      <rect width="6" height="110" rx="3" fill="#a371f7"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#a371f7">B2B Partners / Developers</text>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">• External enterprise servers</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">• Strict SLA rate limits</text>
      <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">• mTLS &amp; strict contract schemas</text>
    </g>
  </g>

  <!-- Connectors Client -> BFF -->
  <line x1="250" y1="160" x2="330" y2="160" stroke="#388bfd" stroke-width="2" marker-end="url(#arrowBlueBff)"/>
  <line x1="250" y1="290" x2="330" y2="290" stroke="#2ea043" stroke-width="2" marker-end="url(#arrowGreenBff)"/>
  <line x1="250" y1="420" x2="330" y2="420" stroke="#a371f7" stroke-width="2" marker-end="url(#arrowPurpleBff)"/>

  <!-- Middle Column: Dedicated Backend-For-Frontend (BFF) Gateways -->
  <g transform="translate(330, 105)">
    <!-- Mobile BFF -->
    <g transform="translate(0, 0)">
      <rect width="360" height="110" rx="6" fill="url(#cardGradApi5)" stroke="#388bfd" stroke-width="2"/>
      <rect width="360" height="6" rx="3" fill="url(#mobileGrad)"/>
      <text x="20" y="30" font-family="monospace" font-size="12" font-weight="700" fill="#58a6ff">Mobile BFF Service</text>
      <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">Aggregates 4 calls into 1; strips 80% unused fields.</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Compresses images to WebP; pushes FCM notifications.</text>
      <text x="20" y="90" font-family="monospace" font-size="10" fill="#7ee787">GET /mobile/checkout-screen → 3.5 KB Payload</text>
    </g>

    <!-- Web BFF -->
    <g transform="translate(0, 130)">
      <rect width="360" height="110" rx="6" fill="url(#cardGradApi5)" stroke="#2ea043" stroke-width="2"/>
      <rect width="360" height="6" rx="3" fill="url(#webGrad)"/>
      <text x="20" y="30" font-family="monospace" font-size="12" font-weight="700" fill="#3fb950">Web SPA BFF Service</text>
      <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">Supports full data grids, export to CSV/PDF, SSR.</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Manages HttpOnly session cookie authentication.</text>
      <text x="20" y="90" font-family="monospace" font-size="10" fill="#7ee787">GET /web/orders/analytics → Detailed Breakdown</text>
    </g>

    <!-- Partner B2B Gateway -->
    <g transform="translate(0, 260)">
      <rect width="360" height="110" rx="6" fill="url(#cardGradApi5)" stroke="#a371f7" stroke-width="2"/>
      <rect width="360" height="6" rx="3" fill="url(#partnerGrad)"/>
      <text x="20" y="30" font-family="monospace" font-size="12" font-weight="700" fill="#a371f7">Partner B2B Public Gateway</text>
      <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">Enforces strict API quotas via Redis Token Bucket.</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">mTLS handshake verification &amp; OAuth2 Client Creds.</text>
      <text x="20" y="90" font-family="monospace" font-size="10" fill="#e3b341">POST /v1/partner/settle → Audited &amp; Throttled</text>
    </g>
  </g>

  <!-- Connectors BFF -> Microservices -->
  <line x1="690" y1="160" x2="770" y2="230" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="690" y1="160" x2="770" y2="330" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="690" y1="290" x2="770" y2="150" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="690" y1="290" x2="770" y2="230" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="690" y1="420" x2="770" y2="230" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="690" y1="420" x2="770" y2="420" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Right Column: Internal Core Domain Microservices -->
  <g transform="translate(770, 105)">
    <!-- User Service -->
    <rect x="0" y="0" width="290" height="75" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#79c0ff">User &amp; Profile Service</text>
    <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Internal gRPC / REST Service</text>
    <text x="20" y="64" font-family="monospace" font-size="9" fill="#7ee787">gRPC: UserService.GetProfile()</text>

    <!-- Orders Service -->
    <rect x="0" y="95" width="290" height="75" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="123" font-family="monospace" font-size="11" font-weight="700" fill="#79c0ff">Order Management Service</text>
    <text x="20" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Transactional Order Ledger</text>
    <text x="20" y="159" font-family="monospace" font-size="9" fill="#7ee787">gRPC: OrderService.GetOrder()</text>

    <!-- Inventory Service -->
    <rect x="0" y="190" width="290" height="75" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="218" font-family="monospace" font-size="11" font-weight="700" fill="#79c0ff">Inventory &amp; Stock Service</text>
    <text x="20" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Real-time reservation checks</text>
    <text x="20" y="254" font-family="monospace" font-size="9" fill="#7ee787">gRPC: InventoryService.CheckStock()</text>

    <!-- Payments Service -->
    <rect x="0" y="285" width="290" height="85" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="313" font-family="monospace" font-size="11" font-weight="700" fill="#e3b341">Payment Switch &amp; Settlement</text>
    <text x="20" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Tier-0 Financial Core</text>
    <text x="20" y="352" font-family="monospace" font-size="9" fill="#f85149">Sub-millisecond auth switch</text>
  </g>

  <!-- Bottom Banner: The Anti-Pattern of the "One Generic Gateway" -->
  <g transform="translate(40, 505)">
    <rect width="1020" height="175" rx="8" fill="url(#cardGradApi5)" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Staff / Principal Architectural Trade-Off: Generic API Gateway vs. Dedicated BFFs</text>

    <!-- Flaw -->
    <g transform="translate(25, 45)">
      <rect width="470" height="115" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f85149">The "One Generic Gateway" Anti-Pattern:</text>
      <text x="20" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• One bloated team owns the gateway, becoming a delivery bottleneck.</text>
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• Mobile is forced to make 10 round-trips or accept massive 500KB JSON payloads.</text>
      <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• Changing an endpoint for Web risks breaking Mobile apps in the wild.</text>
      <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#f85149">❌ High coupling across frontend teams.</text>
    </g>

    <!-- BFF Advantage -->
    <g transform="translate(525, 45)">
      <rect width="470" height="115" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#3fb950">The Backend-For-Frontend (BFF) Pattern:</text>
      <text x="20" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• Frontend teams own their own BFF gateway (Mobile team owns Mobile BFF).</text>
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• BFF aggregates downstream services in-cluster over high-speed gRPC.</text>
      <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">• Client receives tailored, bandwidth-optimized payloads.</text>
      <text x="20" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">✅ Independent deployment cycles, zero cross-channel regressions.</text>
    </g>
  </g>
</svg>
