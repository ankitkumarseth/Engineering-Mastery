<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradApi3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="clientGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="redisGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="dbGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowBlueApi3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradApi3)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Distributed Idempotency Architecture: The Stripe Pattern</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Guaranteeing Exactly-Once Execution Across Unreliable Networks via Distributed Locks and SHA-256 Fingerprints</text>

  <!-- Step 1: Ingress with Idempotency-Key Header -->
  <g transform="translate(40, 105)">
    <rect width="320" height="480" rx="8" fill="url(#cardGradApi3)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="320" height="6" rx="3" fill="url(#clientGradApi)"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">1. Client Request Ingress</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Payment / Mutation API Call</text>

    <rect x="15" y="75" width="290" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">POST /v1/charges</text>
    <text x="15" y="50" font-family="monospace" font-size="13" fill="#e3b341">Idempotency-Key:</text>
    <text x="15" y="72" font-family="monospace" font-size="13" fill="#79c0ff">"idem_key_984a-7bc"</text>
    <text x="15" y="98" font-family="monospace" font-size="13" fill="#8b949e">{"amount": 1000, "cc": 4242}</text>

    <!-- Fingerprint Box -->
    <g transform="translate(15, 205)">
      <rect width="290" height="95" rx="6" fill="#161b22" stroke="#388bfd"/>
      <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#79c0ff">Payload Fingerprint Hash</text>
      <text x="15" y="52" font-family="monospace" font-size="13" fill="#c9d1d9">H = SHA-256(request_body)</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Guards against body mutations</text>
    </g>

    <g transform="translate(15, 315)">
      <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">Idempotency Interceptor:</text>
      <text x="5" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Intercepts request before controller</text>
      <text x="5" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Redis Distributed Key:</text>
      <text x="5" y="98" font-family="monospace" font-size="13" fill="#7ee787">idem:{tenant}:{idem_key}</text>
      <text x="5" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#3fb950">✓ Atomic state check in Redis</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 370 345 L 395 345" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlueApi3)"/>

  <!-- Step 2: Redis State Machine -->
  <g transform="translate(410, 105)">
    <rect width="430" height="480" rx="8" fill="url(#cardGradApi3)" stroke="#d29922" stroke-width="2"/>
    <rect width="430" height="6" rx="3" fill="url(#redisGradApi)"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f85149">2. Redis Distributed Lock &amp; State</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">SETNX atomic reservation &amp; branch triage</text>

    <!-- Redis Command -->
    <g transform="translate(15, 75)">
      <rect width="400" height="95" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">SET idem:{key} '{"state":"PENDING", ...}'</text>
      <text x="12" y="48" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">    NX EX 120</text>
      <text x="12" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Acquires 120s distributed lease lock atomically</text>
    </g>

    <!-- Branch Outcomes -->
    <g transform="translate(15, 185)">
      <!-- Branch A: Lock Acquired -->
      <g transform="translate(0, 0)">
        <rect width="400" height="75" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Branch A: Key Did NOT Exist (Returns OK)</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">→ First-time request. Proceed to DB processing.</text>
      </g>

      <!-- Branch B: Key Exists & PENDING -->
      <g transform="translate(0, 85)">
        <rect width="400" height="95" rx="6" fill="#161b22" stroke="#d29922"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">Branch B: Key Exists &amp; State == PENDING</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">Concurrent in-flight execution in progress!</text>
        <text x="12" y="74" font-family="monospace" font-size="13" fill="#f85149">→ Return HTTP 409 Conflict (or poll lock)</text>
      </g>

      <!-- Branch C: Key Exists & COMPLETED -->
      <g transform="translate(0, 190)">
        <rect width="400" height="90" rx="6" fill="#161b22" stroke="#388bfd"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">Branch C: Key Exists &amp; State == COMPLETED</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Return cached HTTP status &amp; response body!</text>
        <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Zero DB query; zero double-billing risk.</text>
      </g>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 850 345 L 875 345" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlueApi3)"/>

  <!-- Step 3: Transaction Execution & Cache -->
  <g transform="translate(890, 105)">
    <rect width="270" height="480" rx="8" fill="url(#cardGradApi3)" stroke="#238636" stroke-width="2"/>
    <rect width="270" height="6" rx="3" fill="url(#dbGradApi)"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3fb950">3. Execution &amp; Cache</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Database &amp; Storage</text>

    <!-- DB Transaction -->
    <g transform="translate(15, 75)">
      <rect width="240" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">@Transactional</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Charge customer card</text>
      <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Insert payment row</text>
      <text x="12" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">3. Commit transaction</text>
    </g>

    <!-- Update Redis -->
    <g transform="translate(15, 210)">
      <rect width="240" height="140" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Update Redis State</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Transition state to:</text>
      <text x="12" y="72" font-family="monospace" font-size="13" fill="#7ee787">SET idem:{key} {</text>
      <text x="12" y="92" font-family="monospace" font-size="13" fill="#7ee787"> state: COMPLETED,</text>
      <text x="12" y="112" font-family="monospace" font-size="13" fill="#7ee787"> code: 201, ...} EX 86400</text>
    </g>

    <g transform="translate(15, 365)">
      <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">Return Response:</text>
      <text x="5" y="50" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">HTTP 201 Created</text>
      <text x="5" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Cached for 24-hour instant replay</text>
    </g>
  </g>

  <!-- Bottom Panel: Fingerprint Mismatch Security Guard -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="270" rx="8" fill="url(#cardGradApi3)" stroke="#e3b341" stroke-width="2"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#e3b341">The Critical Security Guard: Idempotency Key Reused with Different Payload</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Preventing rogue callers from silently hijacking cached outcomes with altered inputs</text>

    <g transform="translate(20, 72)">
      <rect width="1075" height="175" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f85149">⚠️ The Attack / Bug Scenario:</text>
      <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#c9d1d9">A client sends <tspan fill="#e3b341" font-family="monospace">Idempotency-Key: "order-123"</tspan> with payload <tspan fill="#79c0ff" font-family="monospace">{"amount": 100}</tspan>.</text>
      <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#c9d1d9">Later, the client sends identical key <tspan fill="#e3b341" font-family="monospace">Idempotency-Key: "order-123"</tspan>, but changes payload to <tspan fill="#f85149" font-family="monospace">{"amount": 5000}</tspan>!</text>

      <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#3fb950">🛡️ The Antidote: Payload SHA-256 Fingerprint Comparison</text>
      <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#8b949e">Interceptor hashes new body and compares against stored hash in Redis. If mismatch:</text>
      <text x="20" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#f85149">→ REJECT immediately with HTTP 400 Bad Request (<tspan fill="#e3b341" font-family="monospace">idempotency_key_reused_with_different_payload</tspan>).</text>
    </g>
  </g>
</svg>