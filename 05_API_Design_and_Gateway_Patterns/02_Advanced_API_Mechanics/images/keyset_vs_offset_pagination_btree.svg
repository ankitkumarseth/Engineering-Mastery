<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradApi2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="badGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="goodGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>

    <marker id="arrowRedApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowGreenApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="url(#bgGradApi2)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Pagination Architecture: Offset vs. Keyset (Cursor-Based)</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">B-Tree Index Scan Physics: Why OFFSET 1,000,000 causes O(N) database collapse, and how Keyset enables O(log N) seeks</text>

  <!-- Left Card: Offset-Based Pagination -->
  <g transform="translate(40, 105)">
    <rect width="490" height="380" rx="8" fill="url(#cardGradApi2)" stroke="#da3633" stroke-width="2"/>
    <rect width="490" height="6" rx="3" fill="url(#badGradApi)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f85149">Offset-Based Pagination: LIMIT 10 OFFSET 1000000</text>
    <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Query: <tspan fill="#79c0ff" font-family="monospace">SELECT * FROM orders ORDER BY id LIMIT 10 OFFSET 1000000;</tspan></text>

    <!-- B-Tree Discard Illustration -->
    <g transform="translate(25, 75)">
      <rect width="440" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f85149">The O(N) Table Scan Hazard:</text>

      <!-- Step 1: Scan 1 Million Rows -->
      <rect x="15" y="38" width="280" height="42" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="3 3"/>
      <text x="25" y="56" font-family="monospace" font-size="10" fill="#f85149">Reads 1,000,000 Index Nodes</text>
      <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8b949e">Pulls rows into buffer pool, then DISCARDS THEM!</text>

      <!-- Arrow -->
      <line x1="295" y1="59" x2="330" y2="59" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRedApi)"/>

      <!-- Step 2: Keep 10 -->
      <rect x="330" y="38" width="95" height="42" rx="4" fill="#0d1117" stroke="#2ea043"/>
      <text x="340" y="56" font-family="monospace" font-size="10" fill="#3fb950">Keeps 10</text>
      <text x="340" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8b949e">Returns rows</text>

      <!-- Performance Metrics Box -->
      <rect x="15" y="90" width="410" height="48" rx="4" fill="#21262d"/>
      <text x="25" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#f85149">⏱️ Execution Time: 1,450 ms (1.45 seconds!)</text>
      <text x="25" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Buffer Pool Contention: Evicts active cache lines to read discarded rows.</text>
    </g>

    <!-- Flaws List -->
    <text x="25" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f0f6fc">Production Pitfalls of Offset Pagination:</text>
    <text x="25" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">1. <tspan fill="#f85149" font-weight="700">Degrades with Depth</tspan>: Query latency grows linearly with offset depth ($O(N)$).</text>
    <text x="25" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">2. <tspan fill="#f85149" font-weight="700">Page Drift &amp; Missing Items</tspan>: If an item is deleted while user reads page 2,</text>
    <text x="40" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">all records shift up by 1, causing the user to miss items on page 3.</text>
    <text x="25" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">3. <tspan fill="#f85149" font-weight="700">Duplicate Displays</tspan>: New writes shift rows down, displaying duplicates.</text>
    <text x="25" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#e3b341">⚠️ Only acceptable for small admin panels with &lt; 500 rows.</text>
  </g>

  <!-- Right Card: Keyset / Cursor Pagination -->
  <g transform="translate(570, 105)">
    <rect width="490" height="380" rx="8" fill="url(#cardGradApi2)" stroke="#238636" stroke-width="2"/>
    <rect width="490" height="6" rx="3" fill="url(#goodGradApi)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3fb950">Keyset / Cursor Pagination: WHERE id > :cursor LIMIT 10</text>
    <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Query: <tspan fill="#7ee787" font-family="monospace">SELECT * FROM orders WHERE id > 1000000 ORDER BY id LIMIT 10;</tspan></text>

    <!-- B-Tree Direct Seek Illustration -->
    <g transform="translate(25, 75)">
      <rect width="440" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#3fb950">The O(log N) B-Tree Binary Index Seek:</text>

      <!-- Step 1: Binary Jump -->
      <rect x="15" y="38" width="220" height="42" rx="4" fill="#0d1117" stroke="#388bfd"/>
      <text x="25" y="56" font-family="monospace" font-size="10" fill="#79c0ff">B-Tree Binary Seek</text>
      <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8b949e">Direct jump to leaf key=1,000,000</text>

      <!-- Arrow -->
      <line x1="235" y1="59" x2="270" y2="59" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreenApi)"/>

      <!-- Step 2: Read Exactly 10 -->
      <rect x="270" y="38" width="155" height="42" rx="4" fill="#0d1117" stroke="#2ea043"/>
      <text x="280" y="56" font-family="monospace" font-size="10" fill="#3fb950">Reads Exactly 10 Rows</text>
      <text x="280" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#8b949e">Zero discarded row reads!</text>

      <!-- Performance Metrics Box -->
      <rect x="15" y="90" width="410" height="48" rx="4" fill="#21262d"/>
      <text x="25" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#3fb950">🚀 Execution Time: 0.18 ms (8,000x Faster!)</text>
      <text x="25" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Consistent latency whether fetching Page 1 or Page 1,000,000.</text>
    </g>

    <!-- Advantages List -->
    <text x="25" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f0f6fc">Production Superpowers of Keyset Pagination:</text>
    <text x="25" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">1. <tspan fill="#3fb950" font-weight="700">Constant O(log N) Time</tspan>: Binary seek directly to the key; zero row scanning.</text>
    <text x="25" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">2. <tspan fill="#3fb950" font-weight="700">Immune to Data Drift</tspan>: Real-time writes or deletes never shift records;</text>
    <text x="40" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">the cursor strictly anchors the boundary.</text>
    <text x="25" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">3. <tspan fill="#3fb950" font-weight="700">Mobile Infinite Scroll Standard</tspan>: Used universally by Slack, Stripe, Twitter.</text>
    <text x="25" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">✅ The Staff standard for high-throughput and big data APIs.</text>
  </g>

  <!-- Bottom Panel: Production Keyset Implementation Anatomy -->
  <g transform="translate(40, 505)">
    <rect width="1020" height="175" rx="8" fill="url(#cardGradApi2)" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#58a6ff">Production Implementation: Tie-Breakers, Composite Cursors &amp; Base64 Encoding</text>

    <!-- Rule 1: Tie Breakers -->
    <g transform="translate(25, 45)">
      <rect width="310" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#e3b341">1. The Tie-Breaker Rule</text>
      <text x="15" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Sorting on non-unique columns</text>
      <text x="15" y="58" font-family="monospace" font-size="10" fill="#f85149">(created_at)</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">causes non-deterministic skips!</text>
      <text x="15" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#7ee787">MUST append unique column: (id)</text>
      <text x="15" y="106" font-family="monospace" font-size="9" fill="#79c0ff">ORDER BY created_at DESC, id DESC</text>
    </g>

    <!-- Rule 2: SQL Tuple Comparison -->
    <g transform="translate(355, 45)">
      <rect width="310" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#58a6ff">2. Row-Value Tuple Seek</text>
      <text x="15" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Postgres/MySQL 8+ support tuple logic:</text>
      <text x="15" y="62" font-family="monospace" font-size="9.5" fill="#7ee787">WHERE (created_at, id) &lt;</text>
      <text x="15" y="76" font-family="monospace" font-size="9.5" fill="#7ee787">      (:cursor_created, :cursor_id)</text>
      <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Indexed via composite B-Tree:</text>
      <text x="15" y="106" font-family="monospace" font-size="9" fill="#79c0ff">CREATE INDEX ON (created_at, id);</text>
    </g>

    <!-- Rule 3: Opaque Base64 Cursor -->
    <g transform="translate(685, 45)">
      <rect width="310" height="115" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#a371f7">3. Opaque Base64 Cursor Token</text>
      <text x="15" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Never expose raw DB columns in URL:</text>
      <text x="15" y="60" font-family="monospace" font-size="9.5" fill="#8b949e">GET /orders?cursor=ZXlK... (Base64)</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#c9d1d9">Decodes server-side to JSON:</text>
      <text x="15" y="94" font-family="monospace" font-size="9" fill="#e3b341">{"ts": "2026-11-10T14:00", "id": 105}</text>
      <text x="15" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Allows internal schema refactoring</text>
    </g>
  </g>
</svg>
