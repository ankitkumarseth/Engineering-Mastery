<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradApi2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradApi2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="badGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="goodGradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowRedApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowGreenApi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradApi2)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Pagination Architecture: Offset vs. Keyset (Cursor-Based)</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">B-Tree Index Scan Physics: Why OFFSET 1,000,000 causes O(N) database collapse, and how Keyset enables O(log N) seeks</text>

  <!-- Left Card: Offset-Based Pagination -->
  <g transform="translate(40, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradApi2)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#badGradApi)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f85149">Offset-Based: LIMIT 10 OFFSET 1,000,000</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Query: <tspan fill="#79c0ff" font-family="monospace">SELECT * FROM orders ORDER BY id LIMIT 10 OFFSET 1000000;</tspan></text>

    <!-- B-Tree Discard Illustration -->
    <g transform="translate(20, 75)">
      <rect width="505" height="175" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f85149">The O(N) Table Scan Hazard:</text>

      <!-- Step 1: Scan 1 Million Rows -->
      <g transform="translate(15, 42)">
        <rect width="320" height="50" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="4 4"/>
        <text x="12" y="22" font-family="monospace" font-size="13" fill="#f85149">Reads 1,000,000 Index Nodes</text>
        <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Pulls rows into buffer pool, then DISCARDS THEM!</text>

        <!-- Arrow -->
        <path d="M 330 25 L 365 25" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrowRedApi)"/>

        <!-- Step 2: Keep 10 -->
        <rect x="375" width="100" height="50" rx="4" fill="#0d1117" stroke="#2ea043"/>
        <text x="385" y="22" font-family="monospace" font-size="13" fill="#3fb950">Keeps 10</text>
        <text x="385" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Returns rows</text>
      </g>

      <!-- Performance Metrics Box -->
      <g transform="translate(15, 105)">
        <rect width="475" height="55" rx="4" fill="#21262d"/>
        <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">⏱️ Execution Time: 1,450 ms (1.45 seconds!)</text>
        <text x="15" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Buffer Pool Thrashing: Evicts active working sets to discard 1M rows.</text>
      </g>
    </g>

    <!-- Flaws List -->
    <g transform="translate(20, 265)">
      <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Production Pitfalls of Offset Pagination:</text>
      <text x="5" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. <tspan fill="#f85149" font-weight="700">Degrades with Depth</tspan>: Latency scales linearly O(N); page 10,000 timeouts.</text>
      <text x="5" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. <tspan fill="#f85149" font-weight="700">Phantom Skips &amp; Duplicates</tspan>: If an item is inserted on page 1,</text>
      <text x="25" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">all following rows shift down by 1 position (user sees duplicates!).</text>
      <text x="5" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">3. <tspan fill="#f85149" font-weight="700">DDoS Vulnerability</tspan>: Attackers request ?page=999999 to exhaust DB CPU.</text>
      <text x="5" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#da3633">❌ Anti-pattern for any dataset &gt;10,000 records.</text>
    </g>
  </g>

  <!-- Right Card: Keyset Pagination -->
  <g transform="translate(615, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradApi2)" stroke="#238636" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#goodGradApi)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">Keyset (Cursor-Based): WHERE id &gt; 1000000</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Query: <tspan fill="#7ee787" font-family="monospace">SELECT * FROM orders WHERE id &gt; 1000000 ORDER BY id LIMIT 10;</tspan></text>

    <!-- B-Tree Direct Seek Illustration -->
    <g transform="translate(20, 75)">
      <rect width="505" height="175" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#3fb950">The O(log N) Direct Index Seek:</text>

      <!-- Step 1: B-Tree Traversing -->
      <g transform="translate(15, 42)">
        <rect width="320" height="50" rx="4" fill="#0d1117" stroke="#238636"/>
        <text x="12" y="22" font-family="monospace" font-size="13" fill="#3fb950">Direct B-Tree Seek: id &gt; 1,000,000</text>
        <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Walks 3–4 B-Tree root-to-leaf pages only!</text>

        <!-- Arrow -->
        <path d="M 330 25 L 365 25" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreenApi)"/>

        <!-- Step 2: Read Exactly 10 -->
        <rect x="375" width="100" height="50" rx="4" fill="#0d1117" stroke="#2ea043"/>
        <text x="385" y="22" font-family="monospace" font-size="13" fill="#3fb950">Reads 10</text>
        <text x="385" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Immediate exit</text>
      </g>

      <!-- Performance Metrics Box -->
      <g transform="translate(15, 105)">
        <rect width="475" height="55" rx="4" fill="#21262d"/>
        <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">⏱️ Execution Time: 0.8 ms (&gt;1,800x FASTER!)</text>
        <text x="15" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Zero buffer pool eviction; constant predictable latency at any depth.</text>
      </g>
    </g>

    <!-- Superpowers List -->
    <g transform="translate(20, 265)">
      <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Production Superpowers of Keyset Pagination:</text>
      <text x="5" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. <tspan fill="#3fb950" font-weight="700">Constant O(log N) Time</tspan>: Binary seek directly to the key; zero row scanning.</text>
      <text x="5" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. <tspan fill="#3fb950" font-weight="700">Immune to Data Drift</tspan>: Concurrent writes or deletes never shift records;</text>
      <text x="25" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">the cursor strictly anchors the boundary.</text>
      <text x="5" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">3. <tspan fill="#3fb950" font-weight="700">Mobile Infinite Scroll Standard</tspan>: Used universally by Slack, Stripe, Twitter.</text>
      <text x="5" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ The Staff standard for high-throughput and big data APIs.</text>
    </g>
  </g>

  <!-- Bottom Panel: Production Keyset Implementation Anatomy -->
  <g transform="translate(40, 620)">
    <rect width="1120" height="255" rx="8" fill="url(#cardGradApi2)" stroke="#1f6feb" stroke-width="2"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">Production Implementation: Tie-Breakers, Composite Cursors &amp; Base64 Encoding</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Essential patterns for production-grade cursor engineering</text>

    <g transform="translate(20, 72)">
      <!-- Rule 1: Tie Breakers -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">1. The Tie-Breaker Rule</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Sorting on non-unique columns</text>
        <text x="15" y="74" font-family="monospace" font-size="13" fill="#f85149">(created_at)</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">causes non-deterministic skips!</text>
        <text x="15" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">MUST append unique PK: (id)</text>
        <text x="15" y="146" font-family="monospace" font-size="13" fill="#79c0ff">ORDER BY created_at DESC, id DESC</text>
      </g>

      <!-- Rule 2: SQL Tuple Comparison -->
      <g transform="translate(365, 0)">
        <rect width="350" height="165" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">2. Row-Value Tuple Seek</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Postgres/MySQL 8+ support tuple logic:</text>
        <text x="15" y="76" font-family="monospace" font-size="13" fill="#7ee787">WHERE (created_at, id) &lt;</text>
        <text x="15" y="98" font-family="monospace" font-size="13" fill="#7ee787">      (:cursor_created, :cursor_id)</text>
        <text x="15" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Indexed via composite B-Tree:</text>
        <text x="15" y="146" font-family="monospace" font-size="13" fill="#79c0ff">CREATE INDEX ON (created_at, id);</text>
      </g>

      <!-- Rule 3: Opaque Base64 Cursor -->
      <g transform="translate(735, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">3. Opaque Base64 Token</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Never expose raw DB columns in URL:</text>
        <text x="15" y="74" font-family="monospace" font-size="13" fill="#8b949e">GET /orders?cursor=ZXlK... (Base64)</text>
        <text x="15" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Decodes server-side to JSON:</text>
        <text x="15" y="122" font-family="monospace" font-size="13" fill="#e3b341">{"ts": "2026-11-10T14:00", "id": 105}</text>
        <text x="15" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Internal schema encapsulation</text>
      </g>
    </g>
  </g>
</svg>