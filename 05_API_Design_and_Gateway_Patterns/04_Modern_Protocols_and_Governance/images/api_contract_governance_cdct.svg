<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradGov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradGov" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="contractGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="pactGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowGov" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradGov)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">API Contract Governance &amp; Consumer-Driven Contract Testing</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Contract-First CI/CD Pipeline, SemVer Breaking-Change Guardrails, and Pact CDCT Workflow</text>

  <!-- Section 1: Contract-First Design Pipeline -->
  <g transform="translate(40, 105)">
    <rect width="1120" height="375" rx="8" fill="url(#cardGradGov)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#contractGrad)"/>
    <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">1. Enterprise Contract-First API Lifecycle (Single Source of Truth)</text>
    <text x="25" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">OpenAPI 3.0 / Protobuf IDL defined and reviewed before application code is written</text>

    <!-- 5 Pipeline Steps -->
    <g transform="translate(20, 75)">
      <!-- Step 1: Spec -->
      <g transform="translate(0, 0)">
        <rect width="195" height="265" rx="6" fill="#161b22" stroke="#30363d"/>
        <rect width="195" height="28" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
        <text x="12" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">1. API Specification</text>
        <text x="12" y="52" font-family="monospace" font-size="13" fill="#79c0ff">openapi.yaml</text>
        <text x="12" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Paths &amp; Schemas</text>
        <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• RFC 9457 errors</text>
        <text x="12" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Status Codes</text>
        <text x="12" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Git Versioned</text>
        <text x="12" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">Peer-reviewed by API Guild</text>
      </g>

      <!-- Arrow 1 to 2 -->
      <path d="M 200 135 L 220 135" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowGov)"/>

      <!-- Step 2: Linters -->
      <g transform="translate(225, 0)">
        <rect width="195" height="265" rx="6" fill="#161b22" stroke="#30363d"/>
        <rect width="195" height="28" rx="4" fill="#d29922" fill-opacity="0.2"/>
        <text x="12" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">2. CI Lint &amp; Guard</text>
        <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e3b341">Spectral Linter</text>
        <text x="12" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• kebab-case URLs</text>
        <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Mandatory docs</text>
        <text x="12" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• No 200 with error</text>
        <text x="12" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">Optic Breaking Check</text>
        <text x="12" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">Blocks PR on breaking change</text>
      </g>

      <!-- Arrow 2 to 3 -->
      <path d="M 425 135 L 445 135" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowGov)"/>

      <!-- Step 3: Code Gen -->
      <g transform="translate(450, 0)">
        <rect width="195" height="265" rx="6" fill="#161b22" stroke="#30363d"/>
        <rect width="195" height="28" rx="4" fill="#238636" fill-opacity="0.2"/>
        <text x="12" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">3. Code Generation</text>
        <text x="12" y="52" font-family="monospace" font-size="13" fill="#7ee787">openapi-generator</text>
        <text x="12" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Java Interfaces</text>
        <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• DTO Records</text>
        <text x="12" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• TypeScript SDKs</text>
        <text x="12" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Zero manual typing</text>
        <text x="12" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">Compile-time contract safety</text>
      </g>

      <!-- Arrow 3 to 4 -->
      <path d="M 650 135 L 670 135" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowGov)"/>

      <!-- Step 4: Mock Servers -->
      <g transform="translate(675, 0)">
        <rect width="195" height="265" rx="6" fill="#161b22" stroke="#30363d"/>
        <rect width="195" height="28" rx="4" fill="#8957e5" fill-opacity="0.2"/>
        <text x="12" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#a371f7">4. Mock Servers</text>
        <text x="12" y="52" font-family="monospace" font-size="13" fill="#d2a8ff">Prism Mock Server</text>
        <text x="12" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Serves dynamic mock</text>
        <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Validates contracts</text>
        <text x="12" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Instant dev testing</text>
        <text x="12" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Parallel development:</text>
        <text x="12" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">Frontend starts Day 1!</text>
      </g>

      <!-- Arrow 4 to 5 -->
      <path d="M 875 135 L 895 135" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowGov)"/>

      <!-- Step 5: Gateway Sync -->
      <g transform="translate(900, 0)">
        <rect width="180" height="265" rx="6" fill="#161b22" stroke="#30363d"/>
        <rect width="180" height="28" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
        <text x="12" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">5. Gateway Sync</text>
        <text x="12" y="52" font-family="monospace" font-size="13" fill="#79c0ff">Kong / Apigee</text>
        <text x="12" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Routes configured</text>
        <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Rate limits applied</text>
        <text x="12" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• OAuth scopes locked</text>
        <text x="12" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Published directly to:</text>
        <text x="12" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">Developer Portal</text>
      </g>
    </g>
  </g>

  <!-- Section 2: CDCT Workflow with Pact -->
  <g transform="translate(40, 505)">
    <rect width="1120" height="370" rx="8" fill="url(#cardGradGov)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#pactGrad)"/>
    <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#3fb950">2. Consumer-Driven Contract Testing (CDCT) with Pact</text>
    <text x="25" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Preventing integration failures across microservices without brittle, slow end-to-end environments</text>

    <!-- 3 CDCT Columns -->
    <g transform="translate(20, 75)">
      <!-- Consumer Column -->
      <g transform="translate(0, 0)">
        <rect width="340" height="265" rx="6" fill="#161b22" stroke="#388bfd"/>
        <rect width="340" height="28" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
        <text x="15" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">A. Consumer (Checkout CI)</text>
        <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">1. Executes Unit Test with Pact Mock:</text>
        <text x="15" y="74" font-family="monospace" font-size="13" fill="#7ee787">mockProvider.given("Order 12 exists")</text>
        <text x="15" y="96" font-family="monospace" font-size="13" fill="#7ee787">  .uponReceiving("GET /orders/12")</text>
        <text x="15" y="118" font-family="monospace" font-size="13" fill="#7ee787">  .willRespondWith(200, status="PAID")</text>
        
        <text x="15" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">2. Generates Contract JSON:</text>
        <text x="15" y="176" font-family="monospace" font-size="13" fill="#3fb950">checkout-orderservice-pact.json</text>
        <text x="15" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Only asserts fields Checkout actually uses!</text>
        <text x="15" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">• Ignores unused fields (Tolerant Reader pattern)</text>
      </g>

      <!-- Pact Broker Column -->
      <g transform="translate(370, 0)">
        <rect width="340" height="265" rx="6" fill="#161b22" stroke="#d29922"/>
        <rect width="340" height="28" rx="4" fill="#d29922" fill-opacity="0.2"/>
        <text x="15" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">B. Central Pact Broker</text>
        <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Contract Repository &amp; Compatibility Matrix</text>

        <!-- Sub box: Contract Matrix -->
        <g transform="translate(15, 62)">
          <rect width="310" height="110" rx="4" fill="#0d1117" stroke="#30363d"/>
          <text x="15" y="26" font-family="monospace" font-size="13" fill="#8b949e">Consumer: Checkout (v2.4.1)</text>
          <text x="15" y="50" font-family="monospace" font-size="13" fill="#8b949e">Provider: OrderService (v3.1.0)</text>
          <text x="15" y="74" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Status: VERIFIED_SUCCESSFUL</text>
          <text x="15" y="98" font-family="monospace" font-size="13" fill="#79c0ff">Pact: [id, status, amount]</text>
        </g>

        <text x="15" y="200" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">can-i-deploy CLI Tool</text>
        <text x="15" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Queries broker matrix before production release</text>
      </g>

      <!-- Provider Column -->
      <g transform="translate(740, 0)">
        <rect width="340" height="265" rx="6" fill="#161b22" stroke="#238636"/>
        <rect width="340" height="28" rx="4" fill="#238636" fill-opacity="0.2"/>
        <text x="15" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">C. Provider (OrderService CI)</text>
        <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">1. Pulls Latest Verified Pacts:</text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Fetches all consumer pacts from broker</text>

        <text x="15" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">2. Replays Against Real Controllers:</text>
        <text x="15" y="130" font-family="monospace" font-size="13" fill="#7ee787">@PactValidationAgainstControllers</text>
        <text x="15" y="154" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Replays requests against Spring MockMVC</text>

        <text x="15" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c9d1d9">3. Publishes Verification:</text>
        <text x="15" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">✓ Green: Safe to deploy to prod</text>
        <text x="15" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">❌ Red: Breaks Checkout! Build fails.</text>
      </g>
    </g>
  </g>
</svg>