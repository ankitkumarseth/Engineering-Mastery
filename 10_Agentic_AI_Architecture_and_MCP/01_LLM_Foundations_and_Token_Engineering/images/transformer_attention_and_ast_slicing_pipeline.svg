<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Transformer Attention Dynamics &amp; AST Code Slicing Architecture</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Self-Attention Complexity, KV Prompt Caching, and Tree-Sitter Hierarchical Token Reduction</text>

  <!-- LEFT PANEL: Transformer Attention & Context Dynamics -->
  <g transform="translate(50, 110)">
    <rect width="525" height="750" rx="10" fill="url(#cardGrad)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="525" height="6" rx="3" fill="#1f6feb"/>
    
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">Transformer Attention &amp; Context Dynamics</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Self-Attention mechanics, O(N²) quadratic scaling, and KV cache</text>

    <!-- Scaled Dot-Product Attention Box -->
    <rect x="25" y="85" width="475" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#79c0ff">1. Scaled Dot-Product Attention Equation</text>

    <rect x="40" y="125" width="445" height="42" rx="6" fill="#0d1117" stroke="#1f6feb"/>
    <text x="262" y="152" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#58a6ff">Attention(Q, K, V) = softmax(Q · Kᵀ / √dₖ) · V</text>

    <text x="40" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      • <tspan font-weight="700" fill="#79c0ff">Q (Query)</tspan>: What the current token seeks from prior context.
    </text>
    <text x="40" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
      • <tspan font-weight="700" fill="#7ee787">K (Key)</tspan> &amp; <tspan font-weight="700" fill="#e3b341">V (Value)</tspan>: Context representations stored in GPU HBM (KV Cache).
    </text>

    <!-- O(N^2) Bottleneck & FlashAttention -->
    <rect x="25" y="250" width="475" height="160" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <text x="40" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#f85149">2. O(N²) Quadratic Complexity &amp; FlashAttention</text>

    <text x="40" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      Standard Attention requires materializing an <tspan font-family="monospace" font-weight="700" fill="#f85149">N × N</tspan> attention matrix.
    </text>
    <text x="40" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#ff7b72">
      Doubling context (32k → 64k tokens) quadruples memory &amp; compute bandwidth!
    </text>
    <text x="40" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7ee787">
      ⚡ <tspan font-weight="700" fill="#3fb950">FlashAttention (Dao et al.)</tspan>: Tiling algorithm computes softmax in fast
    </text>
    <text x="40" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
      on-chip SRAM without materializing the N×N intermediate matrix in slow HBM.
    </text>
    <text x="40" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#c9d1d9">
      Reduces memory footprint from O(N²) to strictly O(N) linear in sequence length.
    </text>

    <!-- Context Window Degradation ("Lost in the Middle") -->
    <rect x="25" y="425" width="475" height="160" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="40" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#e3b341">3. "Lost in the Middle" &amp; Attention Dilution</text>

    <text x="40" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      Empirical fact: LLMs exhibit U-shaped retrieval accuracy curves.
    </text>

    <!-- U-Curve Bar Visual -->
    <g transform="translate(40, 495)">
      <rect width="445" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
      <rect x="0" y="0" width="100" height="40" rx="6" fill="#122c1d" stroke="#238636"/>
      <text x="50" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#3fb950">Head (95%)</text>

      <rect x="140" y="0" width="165" height="40" rx="6" fill="#3c1e1e" stroke="#da3633"/>
      <text x="222" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f85149">Middle Valley (42%)</text>

      <rect x="345" y="0" width="100" height="40" rx="6" fill="#122c1d" stroke="#238636"/>
      <text x="395" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#3fb950">Tail (88%)</text>
    </g>

    <text x="40" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      Information placed in the middle 50% of prompt context suffers severe attention drop.
    </text>
    <text x="40" y="576" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#7ee787">
      Staff Rule: Place critical instructions &amp; target code diffs at head or absolute tail!
    </text>

    <!-- Prompt Caching (Prefix Caching) -->
    <rect x="25" y="600" width="475" height="130" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="40" y="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#3fb950">4. Prefix Prompt Caching (Anthropic / DeepSeek / OpenAI)</text>

    <text x="40" y="654" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      Reuses pre-computed KV states for shared prefixes across requests.
    </text>
    <text x="40" y="678" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">
      • Cuts Time-To-First-Token (TTFT) from 2,800ms down to 180ms!
    </text>
    <text x="40" y="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7ee787">
      • Reduces input token costs by up to 90% when caching architecture schemas.
    </text>
  </g>

  <!-- RIGHT PANEL: AST-Guided Code Slicing -->
  <g transform="translate(625, 110)">
    <rect width="525" height="750" rx="10" fill="url(#cardGrad)" stroke="#238636" stroke-width="2"/>
    <rect width="525" height="6" rx="3" fill="#238636"/>

    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">AST-Guided Code Slicing &amp; Token Budgeting</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Taming 2,500+ line enterprise PR diffs without naive truncation</text>

    <!-- Step 1: Raw Diff Ingress -->
    <rect x="25" y="85" width="475" height="115" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <text x="40" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#f85149">Step 1: Raw Enterprise PR Diff Ingress</text>

    <text x="40" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      Enterprise PR: 42 files changed, +2,450 lines / -380 lines.
    </text>
    <text x="40" y="160" font-family="monospace" font-size="12.5" fill="#ff7b72">Total Raw Token Footprint: ~68,000 tokens!</text>
    <text x="40" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      Naive pasting causes context window overflow, extreme latency ($$$), and hallucination.
    </text>

    <line x1="262" y1="200" x2="262" y2="225" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step 2: AST Symbol Parsing & Graph -->
    <rect x="25" y="225" width="475" height="155" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="40" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#58a6ff">Step 2: Tree-Sitter AST Parse &amp; Symbol Call Graph</text>

    <text x="40" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      Tree-sitter parser builds Abstract Syntax Tree (AST) across modified files:
    </text>
    <text x="40" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">
      • Identifies modified function bodies: <tspan font-family="monospace" fill="#79c0ff">processPayment()</tspan>, <tspan font-family="monospace" fill="#79c0ff">validateCard()</tspan>
    </text>
    <text x="40" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">
      • Extracts immediate 1-hop upstream callers &amp; downstream dependencies.
    </text>
    <text x="40" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7ee787">
      • Drops irrelevant test fixture data, boilerplate getters, and untouched methods.
    </text>

    <line x1="262" y1="380" x2="262" y2="405" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step 3: Hierarchical Skeletonization -->
    <rect x="25" y="405" width="475" height="175" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="40" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#e3b341">Step 3: Hierarchical Code Skeletonization</text>

    <!-- Code Block Visual -->
    <rect x="40" y="445" width="445" height="85" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="50" y="468" font-family="monospace" font-size="11.5" fill="#8b949e">public class PaymentService {</text>
    <text x="50" y="486" font-family="monospace" font-size="11.5" fill="#3fb950">    // MODIFIED: Full implementation retained for review</text>
    <text x="50" y="504" font-family="monospace" font-size="11.5" fill="#79c0ff">    public PaymentResult executeTx(...) { /* 45 lines of diff */ }</text>
    <text x="50" y="522" font-family="monospace" font-size="11.5" fill="#8b949e">    public void auditLog(...) { /* SKELETON: omitted 200 lines */ }</text>

    <text x="40" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#c9d1d9">
      Untouched methods reduced to method signatures + JavaDoc comments.
    </text>
    <text x="40" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#7ee787">
      Preserves full type signatures, imports, and interface contracts!
    </text>

    <line x1="262" y1="580" x2="262" y2="605" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step 4: Sliced Prompt Output -->
    <rect x="25" y="605" width="475" height="125" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="40" y="632" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#3fb950">Step 4: High-Fidelity Sliced Context Output</text>

    <text x="40" y="658" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">Final Context Size: ~7,800 tokens (88.5% reduction!)</text>
    <text x="40" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      ✓ Fits cleanly into standard 8k / 16k agentic reasoning window.
    </text>
    <text x="40" y="704" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
      ✓ 100% semantic fidelity: Zero dropped function contracts or imports.
    </text>
  </g>
</svg>
