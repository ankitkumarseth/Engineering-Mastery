<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKraft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradKraft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="zkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="blueGradM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <marker id="arrowRedKraft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowGreenKraft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradKraft)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Metadata Consensus Evolution: Apache ZooKeeper vs. KRaft (KIP-500)</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Eliminating External Dependencies, Dual-Write Bottlenecks, and Scaling to Millions of Partitions</text>

  <!-- Left: Legacy ZooKeeper Architecture -->
  <g transform="translate(40, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradKraft)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#zkGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f85149">1. Legacy ZooKeeper Mode (External State)</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Two disjoint systems with asynchronous synchronization and RPC fan-out</text>

    <!-- ZK Ensemble Box -->
    <g transform="translate(20, 75)">
      <rect width="505" height="105" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">External ZooKeeper Ensemble (3–5 Nodes)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">• Stores topic configs, ACLs, and partition leader mappings in znodes</text>
      <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">• Separate JVM process, distinct TLS certificates, and independent quorum</text>
    </g>

    <!-- Flow Arrow down -->
    <path d="M 272 185 L 272 220" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrowRedKraft)"/>
    <text x="290" y="206" font-family="monospace" font-size="13" fill="#f85149">Async ZNode Watches</text>

    <!-- Active Controller Broker -->
    <g transform="translate(20, 225)">
      <rect width="505" height="105" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#f0883e">Single Active Controller Broker</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">• Reads all metadata from ZooKeeper into local memory heap</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f85149">❌ Bottleneck: Sends synchronous LeaderAndIsr RPCs to all brokers</text>
    </g>

    <!-- Flow Arrow down -->
    <path d="M 272 335 L 272 370" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrowRedKraft)"/>
    <text x="290" y="356" font-family="monospace" font-size="13" fill="#f85149">LeaderAndIsr RPC Fanout</text>

    <!-- Standard Broker Nodes -->
    <g transform="translate(20, 375)">
      <rect width="505" height="95" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#c9d1d9">Broker Nodes (Data Plane Fleet)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">• Synchronously parse O(N) LeaderAndIsr updates during failovers</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f85149">• Cold failovers take minutes if cluster has &gt;100k partitions</text>
    </g>
  </g>

  <!-- Right: Modern KRaft Architecture -->
  <g transform="translate(615, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradKraft)" stroke="#238636" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#kraftGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">2. Modern KRaft Mode (Event-Driven Raft Log)</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Native event-sourced metadata topic replicated via Raft consensus</text>

    <!-- KRaft Controller Quorum -->
    <g transform="translate(20, 75)">
      <rect width="505" height="105" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">KRaft Controller Quorum (3–5 Nodes)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">• Metadata stored directly in internal __cluster_metadata partition</text>
      <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7ee787">✓ Single binary, zero external processes, unified operational tooling</text>
    </g>

    <!-- Flow Arrow down -->
    <path d="M 272 185 L 272 220" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreenKraft)"/>
    <text x="290" y="206" font-family="monospace" font-size="13" fill="#3fb950">Raft Event Replicaton</text>

    <!-- Active KRaft Leader -->
    <g transform="translate(20, 225)">
      <rect width="505" height="105" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">Active KRaft Leader Controller</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">• Commits metadata records sequentially to Raft commit log</text>
      <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7ee787">✓ Zero external dual-writes; hot standby controllers ready instantly</text>
    </g>

    <!-- Flow Arrow down -->
    <path d="M 272 335 L 272 370" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreenKraft)"/>
    <text x="290" y="356" font-family="monospace" font-size="13" fill="#3fb950">Async Pull Stream (FetchSnapshot)</text>

    <!-- Standard Broker Nodes -->
    <g transform="translate(20, 375)">
      <rect width="505" height="95" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Brokers (Pull-Based Metadata Replicas)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">• Brokers pull delta stream asynchronously via standard Kafka fetch protocol</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7ee787">✓ Failover takes &lt;200ms regardless of partition volume</text>
    </g>
  </g>

  <!-- Bottom Comparison Metrics Banner -->
  <g transform="translate(40, 620)">
    <rect width="1120" height="255" rx="8" fill="url(#cardGradKraft)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#blueGradM)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">3. Production Architectural Impact: ZooKeeper vs. KRaft</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Quantitative scaling milestones and operational resiliency benchmarks</text>

    <g transform="translate(20, 72)">
      <!-- Metric 1: Partition Scale -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Max Partitions per Cluster</text>
        <text x="15" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">ZooKeeper: ~200,000 Partitions Max</text>
        <text x="15" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">KRaft: 1,000,000+ Partitions</text>
        <text x="15" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Eliminates ZK tree memory ceilings and</text>
        <text x="15" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">expensive full-state RPC serialization.</text>
      </g>

      <!-- Metric 2: Controller Failover Time -->
      <g transform="translate(365, 0)">
        <rect width="350" height="165" rx="6" fill="#161b22" stroke="#d29922"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">Controller Failover Latency</text>
        <text x="15" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">ZooKeeper: Multi-Minute Outages</text>
        <text x="15" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">KRaft: &lt; 200 Milliseconds</text>
        <text x="15" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Standby controllers maintain warm replicated log;</text>
        <text x="15" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">immediate promotion without cold resync.</text>
      </g>

      <!-- Metric 3: Operational Footprint -->
      <g transform="translate(735, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Operational Complexity</text>
        <text x="15" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">ZooKeeper: Dual cluster fleets to monitor</text>
        <text x="15" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">KRaft: Unified Kafka Binary Fleet</text>
        <text x="15" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Single port configuration, unified SASL/TLS,</text>
        <text x="15" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">and consolidated observability metrics.</text>
      </g>
    </g>
  </g>
</svg>