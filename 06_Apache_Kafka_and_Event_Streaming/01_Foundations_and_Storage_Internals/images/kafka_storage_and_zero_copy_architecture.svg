<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradK1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradK1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="orangeGradK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
    <linearGradient id="greenGradK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="blueGradK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <marker id="arrowBlueK1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreenK1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradK1)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Kafka Storage Internals: Commit Log Segments &amp; OS Zero-Copy I/O</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">First-Principles Architecture: Memory-Mapped Sparse Indexes, High Watermark Quorums, and sendfile(2) Mechanics</text>

  <!-- Section 1: Storage Segment Anatomy (Left Column) -->
  <g transform="translate(40, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradK1)" stroke="#d29922" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#orangeGradK)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f0883e">1. Partition Commit Log &amp; Sparse Index Internals</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">On-disk segment structure inside /var/lib/kafka/data/orders-0/</text>

    <!-- Visual Segment Representation -->
    <g transform="translate(20, 75)">
      <!-- .log file -->
      <rect width="505" height="110" rx="6" fill="#161b22" stroke="#d29922"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">00000000000000000000.log (Append-Only Log File)</text>
      
      <!-- Offsets -->
      <g transform="translate(15, 38)">
        <g transform="translate(0, 0)">
          <rect width="105" height="55" rx="4" fill="#21262d" stroke="#30363d"/>
          <text x="10" y="24" font-family="monospace" font-size="13" fill="#8b949e">Offset 0</text>
          <text x="10" y="44" font-family="monospace" font-size="13" fill="#3fb950">Pos: 0B</text>
        </g>
        <g transform="translate(115, 0)">
          <rect width="105" height="55" rx="4" fill="#21262d" stroke="#30363d"/>
          <text x="10" y="24" font-family="monospace" font-size="13" fill="#8b949e">Offset 1</text>
          <text x="10" y="44" font-family="monospace" font-size="13" fill="#3fb950">Pos: 420B</text>
        </g>
        <g transform="translate(230, 0)">
          <rect width="105" height="55" rx="4" fill="#21262d" stroke="#30363d"/>
          <text x="10" y="24" font-family="monospace" font-size="13" fill="#8b949e">Offset 2</text>
          <text x="10" y="44" font-family="monospace" font-size="13" fill="#3fb950">Pos: 860B</text>
        </g>
        <g transform="translate(345, 0)">
          <rect width="130" height="55" rx="4" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd"/>
          <text x="10" y="24" font-family="monospace" font-size="13" fill="#79c0ff">Offset 3 (LEO)</text>
          <text x="10" y="44" font-family="monospace" font-size="13" fill="#58a6ff">Pos: 1290B</text>
        </g>
      </g>
    </g>

    <!-- .index file -->
    <g transform="translate(20, 205)">
      <rect width="505" height="125" rx="6" fill="#161b22" stroke="#388bfd"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">00000000000000000000.index (Sparse Offset Index via mmap)</text>
      
      <g transform="translate(15, 38)">
        <rect width="475" height="70" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="13" fill="#79c0ff">Index Entry: [Relative Offset (4B)] -&gt; [Physical Position (4B)]</text>
        <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Records indexed every index.interval.bytes = 4096 (Sparse)</text>
      </g>
    </g>

    <!-- Lookup Flow Explanation -->
    <g transform="translate(20, 345)">
      <rect width="505" height="130" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">O(1) Memory Lookup Flow for Target Offset:</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Binary search memory-mapped .index file (direct OS page cache)</text>
      <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Find largest index offset &lt;= target offset (nearest disk position)</text>
      <text x="15" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#3fb950">3. Linear scan .log file for only ~4KB to locate exact target record</text>
    </g>
  </g>

  <!-- Section 2: Zero-Copy Mechanics (Right Column) -->
  <g transform="translate(615, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradK1)" stroke="#238636" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#greenGradK)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">2. OS Page Cache &amp; Zero-Copy I/O Mechanics</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Eliminating user-space context switches via Linux sendfile(2)</text>

    <!-- Standard I/O (Traditional) -->
    <g transform="translate(20, 75)">
      <rect width="505" height="185" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">Standard I/O: 4 Context Switches + 3 CPU Copies</text>
      
      <g transform="translate(15, 38)">
        <rect width="475" height="130" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="15" y="24" font-family="monospace" font-size="13" fill="#e3b341">Disk -&gt; [DMA] -&gt; OS Page Cache -&gt; [CPU] -&gt; App Buffer (JVM)</text>
        <text x="15" y="48" font-family="monospace" font-size="13" fill="#e3b341">App Buffer (JVM) -&gt; [CPU] -&gt; Socket Buffer -&gt; [DMA] -&gt; NIC</text>
        <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• 2 System Calls: read() + write()</text>
        <text x="15" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">• High CPU usage, massive JVM heap pressure, and GC pause risk</text>
      </g>
    </g>

    <!-- Zero-Copy (Kafka sendfile) -->
    <g transform="translate(20, 275)">
      <rect width="505" height="200" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Kafka Zero-Copy: 2 Context Switches + 0 CPU Copies</text>
      
      <g transform="translate(15, 38)">
        <rect width="475" height="145" rx="4" fill="#0d1117" stroke="#238636"/>
        <text x="15" y="26" font-family="monospace" font-size="13" fill="#7ee787">Disk -&gt; [DMA] -&gt; OS Page Cache -&gt; [DMA Scatter-Gather] -&gt; NIC</text>
        <text x="15" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Single syscall: FileChannel.transferTo() / sendfile(2)</text>
        <text x="15" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Zero JVM memory touched: data streams direct from kernel cache</text>
        <text x="15" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#3fb950">• Saturation of multi-gigabit NICs at near line-rate speed</text>
      </g>
    </g>
  </g>

  <!-- Section 3: ISR & Quorum Mechanics (Bottom Banner) -->
  <g transform="translate(40, 620)">
    <rect width="1120" height="255" rx="8" fill="url(#cardGradK1)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#blueGradK)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">3. Cluster Topology &amp; In-Sync Replicas (ISR) Quorum Mechanics</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Leader High Watermark (HW), Log End Offset (LEO), and replica.lag.time.max.ms eviction</text>

    <g transform="translate(20, 72)">
      <!-- Broker 1 (Leader) -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#388bfd"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Broker 101: Partition Leader</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Receives all Producer writes</text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Serves standard Consumer reads</text>
        <text x="15" y="100" font-family="monospace" font-size="13" fill="#79c0ff">LEO = 100 | High Watermark = 98</text>
        <text x="15" y="126" font-family="monospace" font-size="13" fill="#7ee787">replica.lag.time.max.ms = 30000</text>
        <text x="15" y="148" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Status: HEALTHY (Leader)</text>
      </g>

      <!-- Broker 2 (Follower 1) -->
      <g transform="translate(365, 0)">
        <rect width="350" height="165" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Broker 102: Follower (In-Sync)</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Continuously fetches from Leader</text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Replicates log sequentially to disk</text>
        <text x="15" y="100" font-family="monospace" font-size="13" fill="#7ee787">LEO = 98 | High Watermark = 98</text>
        <text x="15" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Last fetched 120ms ago (&lt; 30s threshold)</text>
        <text x="15" y="148" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Status: IN-SYNC (ISR Member)</text>
      </g>

      <!-- Broker 3 (Follower 2 - Lagging) -->
      <g transform="translate(735, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#da3633"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">Broker 103: Follower (Lagging)</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Network stall / Long JVM GC pause</text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Fell behind Leader LEO by &gt; 30s</text>
        <text x="15" y="100" font-family="monospace" font-size="13" fill="#f85149">LEO = 45 (Behind by 55 records!)</text>
        <text x="15" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">unclean.leader.election.enable=false</text>
        <text x="15" y="148" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">Status: OUT-OF-SYNC (Evicted)</text>
      </g>
    </g>
  </g>
</svg>