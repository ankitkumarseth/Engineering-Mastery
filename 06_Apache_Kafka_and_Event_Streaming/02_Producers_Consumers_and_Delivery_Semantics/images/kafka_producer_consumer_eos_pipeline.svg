<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradK2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradK2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="prodGradK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="consGradK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="eosGradK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
    <marker id="arrowBlueK2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreenK2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradK2)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Kafka Producer-Consumer Architecture &amp; Exactly-Once Semantics (EOS)</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Idempotent Producers, Cooperative Sticky Rebalancing, and Two-Phase Commit Transactional Pipelines</text>

  <!-- Section 1: Producer Pipeline & Idempotence (Left Column) -->
  <g transform="translate(40, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradK2)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#prodGradK)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">1. Idempotent Producer &amp; Batch Accumulator</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Zero duplicate appends across network retries via PID + Monotonic Sequences</text>

    <!-- Producer Memory Architecture -->
    <g transform="translate(20, 75)">
      <!-- RecordAccumulator -->
      <rect width="505" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">RecordAccumulator (buffer.memory = 32MB)</text>
      <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">• Micro-batches records by topic-partition</text>
      <text x="15" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">• Triggers send when batch.size (64KB) or linger.ms (10ms) met</text>
      <text x="15" y="94" font-family="monospace" font-size="13" fill="#3fb950">Compression: Snappy / LZ4 / ZSTD block compression</text>
    </g>

    <!-- TCP Socket Link -->
    <path d="M 272 195 L 272 225" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlueK2)"/>
    <text x="290" y="215" font-family="monospace" font-size="13" fill="#58a6ff">TCP Socket (max.in.flight &lt;= 5)</text>

    <!-- Broker Deduplication Box -->
    <g transform="translate(20, 235)">
      <rect width="505" height="235" rx="6" fill="#161b22" stroke="#388bfd"/>
      <rect width="505" height="28" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
      <text x="15" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">Broker Deduplication Cache (enable.idempotence = true)</text>
      
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Producer assigned unique <tspan font-family="monospace" fill="#e3b341">PID: 1042</tspan> via InitProducerId RPC.</text>
      <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Each message carries sequence number <tspan font-family="monospace" fill="#7ee787">seq=0, 1, 2...</tspan></text>
      
      <!-- Sequence Comparison Box -->
      <g transform="translate(15, 92)">
        <rect width="475" height="125" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="24" font-family="monospace" font-size="13" fill="#3fb950">Incoming: seq == last_seq + 1  -&gt; ACCEPT &amp; APPEND</text>
        <text x="12" y="48" font-family="monospace" font-size="13" fill="#f85149">Incoming: seq &lt;= last_seq      -&gt; DUPLICATE! Drop &amp; return ACK</text>
        <text x="12" y="72" font-family="monospace" font-size="13" fill="#da3633">Incoming: seq &gt;  last_seq + 1  -&gt; OUT_OF_ORDER_SEQUENCE! Crash</text>
        <text x="12" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#79c0ff">✓ Zero duplication, perfectly ordered, survives broker retries</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Consumer Group & Rebalance (Right Column) -->
  <g transform="translate(615, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradK2)" stroke="#238636" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#consGradK)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">2. Consumer Rebalance: Eager vs. Cooperative Sticky</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Eliminating the "Stop-The-World" consumer partition pause</text>

    <!-- Eager Rebalance -->
    <g transform="translate(20, 75)">
      <rect width="505" height="175" rx="6" fill="#161b22" stroke="#da3633"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">Legacy Eager Protocol (Stop-the-World Freeze)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#c9d1d9">1. Every consumer drops assigned partitions immediately.</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#f85149">2. All consumption freezes across consumer group (STW).</text>
      <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">3. Coordinator assigns partitions from scratch (latency spike).</text>
      
      <!-- Inner Box -->
      <g transform="translate(15, 112)">
        <rect width="475" height="48" rx="4" fill="#0d1117" stroke="#da3633"/>
        <text x="12" y="20" font-family="monospace" font-size="11.5" fill="#f85149">Cluster paused for seconds/minutes during routine</text>
        <text x="12" y="38" font-family="monospace" font-size="11.5" fill="#f85149">broker node rolling restarts or scaling events!</text>
      </g>
    </g>

    <!-- Cooperative Sticky Rebalance -->
    <g transform="translate(20, 265)">
      <rect width="505" height="205" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">CooperativeStickyAssignor (Incremental Rebalance)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#c9d1d9">1. Consumers keep processing unaffected partitions without pause.</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#7ee787">2. Only migrating partitions are revoked in a short 2nd phase.</text>
      <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">3. Preserves local state caches (embedded RocksDB in Streams).</text>
      
      <!-- Inner State Container -->
      <g transform="translate(15, 118)">
        <rect width="475" height="65" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="24" font-family="monospace" font-size="13" fill="#3fb950">P0, P1 stay active on C1 | P2, P3 stay active on C2</text>
        <text x="12" y="48" font-family="monospace" font-size="13" fill="#79c0ff">Only P3 gracefully shifts to newly joined C3 (Zero freeze!)</text>
      </g>
    </g>
  </g>

  <!-- Section 3: Transactions & Exactly-Once Semantics (Bottom Banner) -->
  <g transform="translate(40, 620)">
    <rect width="1120" height="255" rx="8" fill="url(#cardGradK2)" stroke="#d29922" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#eosGradK)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#e3b341">3. Transactions &amp; Exactly-Once Semantics (EOS): Atomic Read-Process-Write</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Two-Phase Commit Coordination Across Input Offsets and Output Partitions with Zombie Fencing</text>

    <g transform="translate(20, 72)">
      <!-- Step 1: Client Init & Begin -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">1. Init &amp; Fencing</text>
        <text x="15" y="52" font-family="monospace" font-size="13" fill="#c9d1d9">producer.initTransactions()</text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Transactional ID: "order-tx-1"</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Increments Producer Epoch</text>
        <text x="15" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">🛡️ Fences out zombie producers!</text>
        <text x="15" y="144" font-family="monospace" font-size="13" fill="#7ee787">Old epoch writes rejected with 403</text>
      </g>

      <!-- Step 2: Atomic 2PC Coordination -->
      <g transform="translate(365, 0)">
        <rect width="350" height="165" rx="6" fill="#161b22" stroke="#d29922"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">2. Transaction Coordinator</text>
        <text x="15" y="52" font-family="monospace" font-size="13" fill="#79c0ff">__transaction_state (50 Partitions)</text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Records PREPARE_COMMIT state in log</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Writes commit markers to partitions</text>
        <text x="15" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Commits consumed offsets atomically</text>
        <text x="15" y="144" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">✓ Zero partial pipeline execution!</text>
      </g>

      <!-- Step 3: Consumer Isolation Level -->
      <g transform="translate(735, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">3. Consumer Isolation</text>
        <text x="15" y="52" font-family="monospace" font-size="13" fill="#7ee787">isolation.level = read_committed</text>
        <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Consumers read only up to LSO</text>
        <text x="15" y="96" font-family="monospace" font-size="13" fill="#8b949e">  (Last Stable Offset)</text>
        <text x="15" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Aborted tx records filtered automatically</text>
        <text x="15" y="144" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">✓ Exactly-Once End-to-End</text>
      </g>
    </g>
  </g>
</svg>