<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradK4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradK4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cdcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="streamsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
    <linearGradient id="ddiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowBlueK4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreenK4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradK4)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Kafka Streams, Connect CDC &amp; DDIA Event Architecture</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Stream-Table Duality, Embedded RocksDB State Stores, Debezium WAL Capture, and Distributed Log Foundations</text>

  <!-- Section 1: Kafka Connect & Debezium CDC (Left Column) -->
  <g transform="translate(40, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradK4)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#cdcGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">1. Kafka Connect &amp; Debezium CDC Pipeline</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Transactional Outbox Elimination of Dual-Write Hazards</text>

    <!-- Database WAL Box -->
    <g transform="translate(20, 75)">
      <rect width="505" height="100" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">Source RDBMS (Postgres WAL / Oracle Redo Log)</text>
      <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Application commits local DB transaction + Outbox table</text>
      <text x="15" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#3fb950">✓ 100% atomic in single ACID transaction (Zero dual-writes!)</text>
    </g>

    <!-- Arrow down -->
    <path d="M 272 185 L 272 215" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlueK4)"/>
    <text x="290" y="205" font-family="monospace" font-size="13" fill="#58a6ff">Tails WAL Stream (Zero DB CPU Poll!)</text>

    <!-- Debezium Connector Task -->
    <g transform="translate(20, 225)">
      <rect width="505" height="245" rx="6" fill="#161b22" stroke="#1f6feb"/>
      <rect width="505" height="28" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
      <text x="15" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">Debezium CDC Worker (Distributed Connect)</text>
      <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Converts raw WAL byte stream into structured JSON/Avro events:</text>
      
      <!-- Inner Envelope Box -->
      <g transform="translate(15, 62)">
        <rect width="475" height="115" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="24" font-family="monospace" font-size="13" fill="#7ee787">op: "c" (Create), "u" (Update), "d" (Delete)</text>
        <text x="12" y="48" font-family="monospace" font-size="13" fill="#8b949e">before: {...} (Previous row state for diffing)</text>
        <text x="12" y="72" font-family="monospace" font-size="13" fill="#79c0ff">after:  {...} (New row snapshot payload)</text>
        <text x="12" y="96" font-family="monospace" font-size="13" fill="#e3b341">source: {lsn: 1849204, ts_ms: 1731304920}</text>
      </g>
      <text x="15" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">✓ Guaranteed at-least-once delivery; records offset per partition</text>
      <text x="15" y="228" font-family="monospace" font-size="13" fill="#79c0ff">Publishes to topic: dbserver1.inventory.customers</text>
    </g>
  </g>

  <!-- Section 2: Kafka Streams & RocksDB (Right Column) -->
  <g transform="translate(615, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradK4)" stroke="#d29922" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#streamsGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f0883e">2. Kafka Streams: Dualities &amp; RocksDB</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Stream-Table Duality (KStream vs KTable) &amp; Embedded State Stores</text>

    <!-- KStream vs KTable Box -->
    <g transform="translate(20, 75)">
      <rect width="505" height="150" rx="6" fill="#161b22" stroke="#d29922"/>
      <text x="15" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">Stream-Table Duality (Martin Kleppmann DDIA)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• <tspan font-family="monospace" font-weight="700" fill="#79c0ff">KStream</tspan>: Append-only stream of fact changes (Insert/Fact)</text>
      <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• <tspan font-family="monospace" font-weight="700" fill="#7ee787">KTable</tspan>: Current state snapshot by key (Update/Upsert)</text>
      <text x="15" y="104" font-family="monospace" font-size="13" fill="#3fb950">A stream is changelog of a table; a table is snapshot of a stream</text>
      <text x="15" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Stateful transformations: .groupByKey().aggregate().windowedBy()</text>
    </g>

    <!-- RocksDB State Store Box -->
    <g transform="translate(20, 240)">
      <rect width="505" height="230" rx="6" fill="#161b22" stroke="#238636"/>
      <rect width="505" height="28" rx="4" fill="#238636" fill-opacity="0.2"/>
      <text x="15" y="20" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Embedded RocksDB State Store (Out-of-Heap Storage)</text>
      <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Embedded C++ LSM storage engine inside JVM process:</text>
      
      <!-- Inner Features -->
      <g transform="translate(15, 62)">
        <rect width="475" height="105" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">1. Off-heap storage: immune to JVM GC pauses</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Local SSD caching for sub-millisecond table joins</text>
        <text x="12" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#79c0ff">3. Backed by remote compacted Kafka changelog topic</text>
        <text x="12" y="94" font-family="monospace" font-size="13" fill="#3fb950">Crash Recovery: Fast restore from local disk + changelog</text>
      </g>
      <text x="15" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#e3b341">num.standby.replicas = 1 (Warm standby replicas for instant failover!)</text>
    </g>
  </g>

  <!-- Section 3: DDIA Distributed Log vs. Message Broker (Bottom Banner) -->
  <g transform="translate(40, 620)">
    <rect width="1120" height="255" rx="8" fill="url(#cardGradK4)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#ddiaGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">3. DDIA Foundations: Distributed Commit Log (Kafka) vs. Message Broker (RabbitMQ)</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">First-principles architectural comparison from Martin Kleppmann's Designing Data-Intensive Applications</text>

    <g transform="translate(20, 72)">
      <!-- Metric 1: Consumption Mechanics -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Consumption Semantics</text>
        <text x="15" y="50" font-family="monospace" font-size="13" fill="#f85149">RabbitMQ: Destructive Read</text>
        <text x="15" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Ack deletes message immediately</text>
        <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Cannot replay historical stream</text>
        <text x="15" y="122" font-family="monospace" font-size="13" fill="#3fb950">Kafka: Immutable Retention</text>
        <text x="15" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">• Independent consumer offsets; replay anytime!</text>
      </g>

      <!-- Metric 2: Concurrency & Order -->
      <g transform="translate(365, 0)">
        <rect width="350" height="165" rx="6" fill="#161b22" stroke="#d29922"/>
        <text x="15" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">Ordering &amp; Concurrency</text>
        <text x="15" y="50" font-family="monospace" font-size="13" fill="#f85149">RabbitMQ: Competing Consumers</text>
        <text x="15" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Workers pull from same queue in parallel</text>
        <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f85149">• Strict chronological order is LOST!</text>
        <text x="15" y="122" font-family="monospace" font-size="13" fill="#3fb950">Kafka: Partitioned Total Order</text>
        <text x="15" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">• 1 Consumer per partition = strict total order</text>
      </g>

      <!-- Metric 3: Architecture Model -->
      <g transform="translate(735, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Kappa vs. Lambda</text>
        <text x="15" y="50" font-family="monospace" font-size="13" fill="#8b949e">Lambda: Dual Batch + Speed</text>
        <text x="15" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Batch (Hadoop/Spark) + Speed (Flink)</text>
        <text x="15" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• High maintenance duplicate business logic</text>
        <text x="15" y="122" font-family="monospace" font-size="13" fill="#3fb950">Kappa: Single Event Stream Engine</text>
        <text x="15" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#7ee787">• Everything is a stream; batch = replay log</text>
      </g>
    </g>
  </g>
</svg>