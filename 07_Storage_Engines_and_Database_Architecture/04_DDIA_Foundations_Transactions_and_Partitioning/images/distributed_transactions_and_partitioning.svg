<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDdia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradDdia" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="twoPcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradDdia)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Distributed Transactions, Isolation Anomalies &amp; Consistent Hashing</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">DDIA Foundations: Snapshot Isolation Write Skew, 2PC Synchronous Blocking &amp; Vnode Partitioning</text>

  <!-- Left Column: Snapshot Isolation & Write Skew -->
  <g transform="translate(40, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradDdia)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#isoGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f85149">1. Snapshot Isolation (SI) &amp; The Write Skew Anomaly</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Why row locks fail: concurrent updates modify disjoint records violating invariant</text>

    <!-- Scenario Box -->
    <g transform="translate(20, 75)">
      <rect width="505" height="400" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1.2"/>
      
      <!-- Invariant Banner -->
      <rect x="15" y="15" width="475" height="32" rx="4" fill="#0d1117" stroke="#da3633"/>
      <text x="25" y="36" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">Invariant: Total Active On-Call Doctors &gt;= 1</text>

      <!-- Step 1 -->
      <g transform="translate(15, 60)">
        <rect width="475" height="60" rx="4" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">Time t1: Initial DB State</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Alice: ON_CALL, Bob: ON_CALL (Count = 2). Both request leave.</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(15, 130)">
        <rect width="475" height="85" rx="4" fill="#0d1117" stroke="#d29922"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">Time t2: Concurrent Snapshot Reads (Both see Count = 2)</text>
        <text x="12" y="48" font-family="monospace" font-size="13" fill="#c9d1d9">Txn 1 (Alice): SELECT COUNT(*) -&gt; 2 (count &gt;= 2, safe to go off-call)</text>
        <text x="12" y="70" font-family="monospace" font-size="13" fill="#c9d1d9">Txn 2 (Bob):   SELECT COUNT(*) -&gt; 2 (count &gt;= 2, safe to go off-call)</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(15, 225)">
        <rect width="475" height="85" rx="4" fill="#0d1117" stroke="#da3633"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">Time t3: Concurrent Writes to DISJOINT Rows!</text>
        <text x="12" y="48" font-family="monospace" font-size="13" fill="#c9d1d9">Txn 1: UPDATE doctors SET on_call=false WHERE id='Alice'; COMMIT;</text>
        <text x="12" y="70" font-family="monospace" font-size="13" fill="#c9d1d9">Txn 2: UPDATE doctors SET on_call=false WHERE id='Bob'; COMMIT;</text>
      </g>

      <!-- Step 4 Outcome -->
      <g transform="translate(15, 320)">
        <rect width="475" height="65" rx="4" fill="#2d1517" stroke="#f85149"/>
        <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f85149">Violation: Count = 0 (No Doctors on Call!)</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#e6edf3">Defense: Serializable (SSI), SELECT ... FOR UPDATE, or explicit lock table</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Two-Phase Commit Blocking Mechanics -->
  <g transform="translate(615, 105)">
    <rect width="545" height="495" rx="8" fill="url(#cardGradDdia)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#twoPcGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">2. Two-Phase Commit (2PC) Blocking &amp; Failures</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">XA / 2PC provides atomic commit across databases at severe availability cost</text>

    <!-- 2PC Flow Box -->
    <g transform="translate(20, 75)">
      <rect width="505" height="400" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1.2"/>
      
      <!-- Phase 1 -->
      <g transform="translate(15, 15)">
        <rect width="475" height="110" rx="4" fill="#0d1117" stroke="#388bfd"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">Phase 1: Prepare (Voting Phase)</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Coordinator sends PREPARE to all participants (DB1, DB2).</text>
        <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Participants fsync redo log, acquire row locks, vote YES or NO.</text>
        <text x="12" y="92" font-family="monospace" font-size="13" fill="#7ee787">✓ If participant votes YES, it promises it CAN and WILL commit!</text>
      </g>

      <!-- Phase 2 -->
      <g transform="translate(15, 135)">
        <rect width="475" height="110" rx="4" fill="#0d1117" stroke="#238636"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Phase 2: Commit / Abort (Execution Phase)</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Coordinator writes COMMIT record to its own WAL disk.</text>
        <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Coordinator broadcasts COMMIT command to all participants.</text>
        <text x="12" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">3. Participants commit, release all locks, and send ACK back.</text>
      </g>

      <!-- The 2PC Flaw -->
      <g transform="translate(15, 255)">
        <rect width="475" height="130" rx="4" fill="#2d1517" stroke="#da3633"/>
        <text x="12" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">The Inherent Flaw: Synchronous Blocking</text>
        <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#e6edf3">• If Coordinator crashes after Phase 1, participants are IN DOUBT!</text>
        <text x="12" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#e6edf3">• Participants cannot commit or abort unilaterally; hold locks indefinitely.</text>
        <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">• Cascading failure: locks cause whole fleet thread exhaustion.</text>
        <text x="12" y="118" font-family="monospace" font-size="13" fill="#79c0ff">Modern solution: Sagas with compensating transactions replace 2PC.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Banner: Consistent Hashing, Virtual Nodes & Quorum Math -->
  <g transform="translate(40, 620)">
    <rect width="1120" height="255" rx="8" fill="url(#cardGradDdia)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#ringGrad)"/>
    <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">3. Consistent Hashing, Virtual Nodes (Vnodes) &amp; Quorum Math (CAP / PACELC)</text>
    <text x="25" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Minimal key reshuffling (K/N), hot spot avoidance with vnodes, and overlap consistency</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: Modulo vs Consistent Hashing -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="25" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Consistent Hashing Ring</text>
        <text x="15" y="50" font-family="monospace" font-size="13" fill="#f85149">Naive Hash Mod: hash(key) % N</text>
        <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Adding 1 node reshuffles ~N/(N+1) (~80-90%) of keys!</text>
        <text x="15" y="100" font-family="monospace" font-size="13" fill="#3fb950">Consistent Hash Ring [0..2^32-1]</text>
        <text x="15" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Keys map to first node clockwise.</text>
        <text x="15" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Adding node rebalances only K / N keys</text>
      </g>

      <!-- Panel 2: Virtual Nodes -->
      <g transform="translate(365, 0)">
        <rect width="350" height="165" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="25" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Virtual Nodes (Vnodes) Defense</text>
        <text x="15" y="50" font-family="monospace" font-size="13" fill="#e3b341">Problem: Non-Uniform Ring Spread</text>
        <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">Physical nodes cluster unevenly, creating hot spots.</text>
        <text x="15" y="100" font-family="monospace" font-size="13" fill="#3fb950">Solution: 128 - 256 Vnodes / Node</text>
        <text x="15" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">Hashed across ring tokens for uniform load.</text>
        <text x="15" y="146" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7ee787">✓ Fast parallel rebalance when node fails</text>
      </g>

      <!-- Panel 3: Quorum Math -->
      <g transform="translate(735, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#d29922"/>
        <text x="15" y="25" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">Quorum Math (Dynamo / Cassandra)</text>
        <text x="15" y="50" font-family="monospace" font-size="13" fill="#79c0ff">N = 3 Replicas | R = Read | W = Write</text>
        <text x="15" y="75" font-family="monospace" font-size="13" fill="#3fb950">Strong Consistency: R + W &gt; N</text>
        <text x="15" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">W=2, R=2 (2+2=4 &gt; 3) -&gt; Read overlap!</text>
        <text x="15" y="126" font-family="monospace" font-size="13" fill="#f85149">Eventual Consistency: R + W &lt;= N</text>
        <text x="15" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8b949e">W=1, R=1 -&gt; Ultra low latency, stale read risk</text>
      </g>
    </g>
  </g>
</svg>
