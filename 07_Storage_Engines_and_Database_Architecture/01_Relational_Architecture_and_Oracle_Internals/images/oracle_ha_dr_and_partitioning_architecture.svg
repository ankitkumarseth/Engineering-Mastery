<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradOra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradOra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="blueGradOra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="greenGradOra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="goldGradOra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
    <marker id="arrowBlueOra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGradOra)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Relational Architecture, B-Trees &amp; Oracle Enterprise HA/DR</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">First-Principles Storage Engine Mechanics, Partition Pruning &amp; Physical Redo vs Cache Fusion</text>
  </g>

  <!-- SECTION 1: B-Tree Index & Clustering Factor (Left Column) -->
  <g transform="translate(40, 105)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradOra)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#blueGradOra)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">1. B-Tree Index Hierarchy &amp; Clustering Factor</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Branch Navigation, Doubly-Linked Leaves &amp; Table Block I/O Cost</text>

    <!-- B-Tree Hierarchy Diagram -->
    <g transform="translate(20, 75)">
      <!-- Root Node -->
      <g transform="translate(175, 0)">
        <rect width="155" height="42" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
        <text x="12" y="18" font-family="monospace" font-size="12.5" font-weight="700" fill="#79c0ff">Root: [100 | 500]</text>
        <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Single Root Block in RAM</text>
      </g>

      <!-- Down Arrows -->
      <path d="M 215 42 L 120 72" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>
      <path d="M 290 42 L 385 72" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>

      <!-- Intermediate Branch Blocks -->
      <g transform="translate(40, 72)">
        <rect width="155" height="38" rx="4" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="16" font-family="monospace" font-size="12.5" fill="#c9d1d9">Branch: [10 | 50]</text>
        <text x="12" y="30" font-family="monospace" font-size="12" fill="#8b949e">Range: 1 to 99</text>
      </g>
      <g transform="translate(310, 72)">
        <rect width="155" height="38" rx="4" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="16" font-family="monospace" font-size="12.5" fill="#c9d1d9">Branch: [600 | 850]</text>
        <text x="12" y="30" font-family="monospace" font-size="12" fill="#8b949e">Range: 500 to 999</text>
      </g>

      <!-- Arrows to Leaves -->
      <path d="M 115 110 L 80 135" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>
      <path d="M 385 110 L 420 135" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>

      <!-- Doubly-Linked Leaves -->
      <g transform="translate(10, 135)">
        <g transform="translate(0, 0)">
          <rect width="150" height="52" rx="4" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
          <text x="10" y="18" font-family="monospace" font-size="12.5" font-weight="700" fill="#3fb950">Leaf 1 [K:10..49]</text>
          <text x="10" y="32" font-family="monospace" font-size="12" fill="#8b949e">Entries: (Key, ROWID)</text>
          <text x="10" y="46" font-family="monospace" font-size="12" fill="#7ee787">ROWID: File:Blk:Row</text>
        </g>
        <g transform="translate(175, 0)">
          <rect width="150" height="52" rx="4" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
          <text x="10" y="18" font-family="monospace" font-size="12.5" font-weight="700" fill="#3fb950">Leaf 2 [K:50..99]</text>
          <text x="10" y="32" font-family="monospace" font-size="12" fill="#8b949e">Entries: (Key, ROWID)</text>
          <text x="10" y="46" font-family="monospace" font-size="12" fill="#7ee787">Fast Range Scans!</text>
        </g>
        <g transform="translate(350, 0)">
          <rect width="145" height="52" rx="4" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
          <text x="10" y="18" font-family="monospace" font-size="12.5" font-weight="700" fill="#3fb950">Leaf 3 [K:100..499]</text>
          <text x="10" y="32" font-family="monospace" font-size="12" fill="#8b949e">Entries: (Key, ROWID)</text>
          <text x="10" y="46" font-family="monospace" font-size="12" fill="#7ee787">Index Skip Scan</text>
        </g>
      </g>
    </g>

    <!-- Clustering Factor Box -->
    <g transform="translate(20, 310)">
      <rect width="505" height="145" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">Clustering Factor: The CBO Cost Crossover Point</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Measures how ordered table rows are relative to index leaf keys.</text>
      <text x="16" y="72" font-family="monospace" font-size="11.5" fill="#3fb950">Good CF ≈ Total Blocks (Clustered: 1 I/O hits many rows)</text>
      <text x="16" y="96" font-family="monospace" font-size="11.5" fill="#f85149">Bad CF  ≈ Total Rows   (Dispersed: Every lookup needs 1 I/O)</text>
      <text x="16" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">High CF forces CBO to abandon Index Range Scan in favor of Full Table Scan.</text>
    </g>
  </g>

  <!-- SECTION 2: Partitioning & Pruning (Right Column) -->
  <g transform="translate(615, 105)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradOra)" stroke="#238636" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#greenGradOra)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">2. Partitioning Strategies &amp; Partition Pruning</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Range/Hash/Composite + Local vs Global Index Maintenance</text>

    <!-- Partition Pruning Visual -->
    <g transform="translate(20, 75)">
      <rect width="505" height="145" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">Partition Pruning (WHERE txn_date &gt;= '2026-11-01')</text>
      
      <!-- 4 Partitions visual -->
      <g transform="translate(14, 42)">
        <g transform="translate(0, 0)">
          <rect width="110" height="62" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="3,3"/>
          <text x="10" y="20" font-family="monospace" font-size="12" fill="#f85149">P_2026_09</text>
          <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Sep 2026</text>
          <text x="10" y="52" font-family="monospace" font-size="11" fill="#f85149">⛔ PRUNED (0 I/O)</text>
        </g>
        <g transform="translate(122, 0)">
          <rect width="110" height="62" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="3,3"/>
          <text x="10" y="20" font-family="monospace" font-size="12" fill="#f85149">P_2026_10</text>
          <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Oct 2026</text>
          <text x="10" y="52" font-family="monospace" font-size="11" fill="#f85149">⛔ PRUNED (0 I/O)</text>
        </g>
        <g transform="translate(244, 0)">
          <rect width="110" height="62" rx="4" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1.5"/>
          <text x="10" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#79c0ff">P_2026_11</text>
          <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Nov 2026 (Active)</text>
          <text x="10" y="52" font-family="monospace" font-size="11" fill="#3fb950">✓ SCANNED (I/O)</text>
        </g>
        <g transform="translate(366, 0)">
          <rect width="110" height="62" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="3,3"/>
          <text x="10" y="20" font-family="monospace" font-size="12" fill="#f85149">P_2026_12</text>
          <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Dec 2026</text>
          <text x="10" y="52" font-family="monospace" font-size="11" fill="#f85149">⛔ PRUNED (0 I/O)</text>
        </g>
      </g>
      <text x="16" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#3fb950">Static Pruning (Compile-Time) vs Dynamic PKEY Pruning (Run-Time Join Filter)</text>
    </g>

    <!-- Local vs Global Indexes -->
    <g transform="translate(20, 240)">
      <rect width="505" height="215" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Local vs. Global Partitioned Indexes: Staff Trade-Off</text>

      <g transform="translate(14, 40)">
        <!-- Local Index -->
        <g transform="translate(0, 0)">
          <rect width="230" height="150" rx="4" fill="#0d1117" stroke="#30363d"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">Local Partitioned Index</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#c9d1d9">• 1:1 mapped to partition</text>
          <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#3fb950">✓ Fast DROP / TRUNCATE</text>
          <text x="12" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#3fb950">  (Zero index rebuild needed!)</text>
          <text x="12" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e">• Must include partition key</text>
          <text x="12" y="136" font-family="monospace" font-size="12" fill="#7ee787">Best for: High-volume archival</text>
        </g>

        <!-- Global Index -->
        <g transform="translate(247, 0)">
          <rect width="230" height="150" rx="4" fill="#0d1117" stroke="#30363d"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">Global Non-Partitioned Index</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#c9d1d9">• Spans all table partitions</text>
          <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#3fb950">✓ Enforces global uniqueness (UUID)</text>
          <text x="12" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#f85149">❌ DROP partition marks UNUSABLE</text>
          <text x="12" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#8b949e">• Requires UPDATE GLOBAL INDEXES</text>
          <text x="12" y="136" font-family="monospace" font-size="12" fill="#e3b341">Best for: Business key lookups</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 3: Oracle HA/DR Architecture (Bottom Row) -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradOra)" stroke="#d29922" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#goldGradOra)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#e3b341">3. Oracle Enterprise HA/DR: Active Data Guard vs Oracle Real Application Clusters (RAC)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Physical Block Redo Apply vs Shared-Disk Cache Fusion &amp; Fast Application Notification (FAN) Failover</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: Data Guard -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Oracle Active Data Guard</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#3fb950">Physical Redo Streaming:</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• LGWR -> LNS -> Standby RFS -> MRP</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Synchronous (SYNC): Zero data loss (RPO=0)</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Read-only reporting on standby while redo applies.</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Fast-Start Failover (FSFO) automated cutover</text>
      </g>

      <!-- Panel 2: Oracle RAC -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Oracle RAC (Cache Fusion)</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#7ee787">Active-Active Shared-Disk Clustering</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Global Cache Service (GCS) coordinates blocks</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Private 100GbE interconnect transfers RAM blocks</text>
        <text x="16" y="118" font-family="monospace" font-size="12" fill="#e3b341">gc buffer busy: interconnect contention</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Zero downtime node failure; FAN reroutes conns</text>
      </g>

      <!-- Panel 3: GoldenGate -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Oracle GoldenGate (CDC)</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#d2a8ff">Logical Heterogeneous Replication:</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Extract parses Redo -> Trail files</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Replicat executes SQL on target DB</text>
        <text x="16" y="116" font-family="monospace" font-size="13" fill="#58a6ff">Heterogeneous: Oracle -> Kafka / PG</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Active-Active bi-directional synchronization</text>
      </g>
    </g>
  </g>
</svg>