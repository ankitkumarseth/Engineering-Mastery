<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradOra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradOra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="redGradOra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="blueGradOra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="goldGradOra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
    <linearGradient id="greenGradOra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowBlueOra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGoldOra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3b341" />
    </marker>
    <marker id="arrowGreenOra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="740" fill="url(#bgGradOra)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Relational Architecture, B-Trees &amp; Oracle Enterprise HA/DR</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">First-Principles Storage Engine Mechanics, Partition Pruning, and Physical Redo vs. Logical Replication</text>

  <!-- Section 1: B-Tree Index & Clustering Factor (Left Column) -->
  <g transform="translate(40, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradOra)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#blueGradOra)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#58a6ff">1. B-Tree Index Hierarchy &amp; Clustering Factor</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Branch Navigation, Doubly-Linked Leaves &amp; Table Block I/O Cost</text>

    <!-- B-Tree Hierarchy Diagram -->
    <g transform="translate(20, 72)">
      <!-- Root Node -->
      <g transform="translate(160, 0)">
        <rect width="140" height="38" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
        <text x="12" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#79c0ff">Root: [100 | 500]</text>
        <text x="12" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#8b949e">Single Root Block (RAM)</text>
      </g>

      <!-- Branch Down Arrows -->
      <path d="M 190 38 L 100 68" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>
      <path d="M 270 38 L 360 68" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>

      <!-- Intermediate Branch Blocks -->
      <g transform="translate(30, 68)">
        <rect width="140" height="34" rx="4" fill="#161b22" stroke="#30363d"/>
        <text x="10" y="15" font-family="monospace" font-size="8.5" fill="#c9d1d9">Branch: [10 | 50]</text>
        <text x="10" y="27" font-family="monospace" font-size="8" fill="#8b949e">Range: 1 to 99</text>
      </g>
      <g transform="translate(290, 68)">
        <rect width="140" height="34" rx="4" fill="#161b22" stroke="#30363d"/>
        <text x="10" y="15" font-family="monospace" font-size="8.5" fill="#c9d1d9">Branch: [600 | 850]</text>
        <text x="10" y="27" font-family="monospace" font-size="8" fill="#8b949e">Range: 500 to 999</text>
      </g>

      <!-- Leaf Level Header -->
      <path d="M 100 102 L 70 125" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>
      <path d="M 360 102 L 390 125" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlueOra)"/>

      <!-- Doubly Linked Leaf Nodes -->
      <g transform="translate(10, 125)">
        <!-- Leaf 1 -->
        <g transform="translate(0, 0)">
          <rect width="135" height="48" rx="4" fill="#161b22" stroke="#238636"/>
          <text x="8" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#3fb950">Leaf 1 [K:10..49]</text>
          <text x="8" y="28" font-family="monospace" font-size="7.5" fill="#8b949e">Entries: (Key, ROWID)</text>
          <text x="8" y="40" font-family="monospace" font-size="7.5" fill="#7ee787">ROWID: File:Blk:Row</text>
        </g>

        <!-- Leaf Link 1 <-> 2 -->
        <line x1="135" y1="20" x2="160" y2="20" stroke="#3fb950" stroke-width="1.5"/>
        <line x1="160" y1="28" x2="135" y2="28" stroke="#3fb950" stroke-width="1.5"/>

        <!-- Leaf 2 -->
        <g transform="translate(160, 0)">
          <rect width="135" height="48" rx="4" fill="#161b22" stroke="#238636"/>
          <text x="8" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#3fb950">Leaf 2 [K:50..99]</text>
          <text x="8" y="28" font-family="monospace" font-size="7.5" fill="#8b949e">Entries: (Key, ROWID)</text>
          <text x="8" y="40" font-family="monospace" font-size="7.5" fill="#7ee787">Fast Range Scans!</text>
        </g>

        <!-- Leaf Link 2 <-> 3 -->
        <line x1="295" y1="20" x2="320" y2="20" stroke="#3fb950" stroke-width="1.5"/>
        <line x1="320" y1="28" x2="295" y2="28" stroke="#3fb950" stroke-width="1.5"/>

        <!-- Leaf 3 -->
        <g transform="translate(320, 0)">
          <rect width="135" height="48" rx="4" fill="#161b22" stroke="#238636"/>
          <text x="8" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#3fb950">Leaf 3 [K:100..499]</text>
          <text x="8" y="28" font-family="monospace" font-size="7.5" fill="#8b949e">Entries: (Key, ROWID)</text>
          <text x="8" y="40" font-family="monospace" font-size="7.5" fill="#7ee787">Index Skip Scan</text>
        </g>
      </g>
    </g>

    <!-- Clustering Factor Explained Box -->
    <g transform="translate(20, 260)">
      <rect width="460" height="95" rx="6" fill="#161b22" stroke="#d29922"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#e3b341">Clustering Factor: The CBO Cost Crossover Point</text>
      <text x="15" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#c9d1d9">• Measures how ordered table data is relative to index leaf keys.</text>
      <text x="15" y="54" font-family="monospace" font-size="9" fill="#3fb950">Good CF ≈ Total Table Blocks (Clustered: 1 disk read hits multiple rows)</text>
      <text x="15" y="70" font-family="monospace" font-size="9" fill="#f85149">Bad CF  ≈ Total Table Rows   (Dispersed: Every index lookup forces 1 new I/O!)</text>
      <text x="15" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#8b949e">High CF forces CBO to abandon Index Range Scan in favor of Full Table Scan.</text>
    </g>
  </g>

  <!-- Section 2: Partitioning & Pruning (Right Column) -->
  <g transform="translate(560, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradOra)" stroke="#238636" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#greenGradOra)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">2. Partitioning Strategies &amp; Partition Pruning</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Range/Hash/Composite + Local vs. Global Index Maintenance Overhead</text>

    <!-- Partition Pruning Visual -->
    <g transform="translate(20, 72)">
      <rect width="460" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#79c0ff">Partition Pruning (WHERE txn_date &gt;= '2026-11-01')</text>
      
      <!-- 4 Partitions visual -->
      <g transform="translate(15, 34)">
        <!-- P1: Pruned -->
        <g transform="translate(0, 0)">
          <rect width="98" height="52" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="3,3"/>
          <text x="8" y="18" font-family="monospace" font-size="9" fill="#f85149">P_2026_09</text>
          <text x="8" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Sep 2026</text>
          <text x="8" y="46" font-family="monospace" font-size="7.5" fill="#f85149">⛔ PRUNED (0 I/O)</text>
        </g>

        <!-- P2: Pruned -->
        <g transform="translate(110, 0)">
          <rect width="98" height="52" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="3,3"/>
          <text x="8" y="18" font-family="monospace" font-size="9" fill="#f85149">P_2026_10</text>
          <text x="8" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Oct 2026</text>
          <text x="8" y="46" font-family="monospace" font-size="7.5" fill="#f85149">⛔ PRUNED (0 I/O)</text>
        </g>

        <!-- P3: Active Target -->
        <g transform="translate(220, 0)">
          <rect width="98" height="52" rx="4" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-width="1.5"/>
          <text x="8" y="18" font-family="monospace" font-size="9" font-weight="700" fill="#79c0ff">P_2026_11</text>
          <text x="8" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">Nov 2026 (Active)</text>
          <text x="8" y="46" font-family="monospace" font-size="7.5" fill="#3fb950">✓ SCANNED (I/O)</text>
        </g>

        <!-- P4: Future -->
        <g transform="translate(330, 0)">
          <rect width="98" height="52" rx="4" fill="#0d1117" stroke="#da3633" stroke-dasharray="3,3"/>
          <text x="8" y="18" font-family="monospace" font-size="9" fill="#f85149">P_2026_12</text>
          <text x="8" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Dec 2026</text>
          <text x="8" y="46" font-family="monospace" font-size="7.5" fill="#f85149">⛔ PRUNED (0 I/O)</text>
        </g>
      </g>
      <text x="15" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#3fb950">Static Pruning (Compile-Time) vs. Dynamic PKEY Pruning (Run-Time Join Filter)</text>
    </g>

    <!-- Local vs Global Indexes -->
    <g transform="translate(20, 205)">
      <rect width="460" height="150" rx="6" fill="#161b22" stroke="#238636"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#3fb950">Local vs. Global Partitioned Indexes: Staff Trade-Off</text>

      <g transform="translate(15, 34)">
        <!-- Local Index Panel -->
        <g transform="translate(0, 0)">
          <rect width="205" height="100" rx="4" fill="#0d1117" stroke="#30363d"/>
          <text x="10" y="18" font-family="monospace" font-size="9.5" font-weight="700" fill="#79c0ff">Local Partitioned Index</text>
          <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• 1:1 mapped to table partition</text>
          <text x="10" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#3fb950">✓ Fast partition DROP/TRUNCATE</text>
          <text x="10" y="62" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#3fb950">  (Zero index rebuild required!)</text>
          <text x="10" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#8b949e">• Must include partition key in PK</text>
          <text x="10" y="92" font-family="monospace" font-size="8" fill="#7ee787">Best for: High-throughput DLM</text>
        </g>

        <!-- Global Index Panel -->
        <g transform="translate(220, 0)">
          <rect width="205" height="100" rx="4" fill="#0d1117" stroke="#30363d"/>
          <text x="10" y="18" font-family="monospace" font-size="9.5" font-weight="700" fill="#e3b341">Global Non-Partitioned Index</text>
          <text x="10" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Spans all table partitions</text>
          <text x="10" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#3fb950">✓ Enforces global uniqueness (UUID)</text>
          <text x="10" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#f85149">❌ DROP partition marks UNUSABLE!</text>
          <text x="10" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#f85149">  (Requires UPDATE GLOBAL INDEXES)</text>
          <text x="10" y="92" font-family="monospace" font-size="8" fill="#e3b341">Best for: Natural Unique Keys</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 3: Enterprise HA/DR Matrix (Bottom Banner) -->
  <g transform="translate(40, 495)">
    <rect width="1020" height="215" rx="8" fill="url(#cardGradOra)" stroke="#d29922" stroke-width="2"/>
    <rect width="1020" height="6" rx="3" fill="url(#goldGradOra)"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#e3b341">3. Enterprise HA &amp; DR: Oracle RAC vs. Data Guard vs. GoldenGate (The Mastercard Decision)</text>
    <text x="25" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Why Tier-0 3-AZ Active Architectures Abandon GoldenGate Logical Sync for Physical Redo Streaming</text>

    <g transform="translate(25, 68)">
      <!-- System 1: Oracle RAC -->
      <g transform="translate(0, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#388bfd"/>
        <text x="15" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#58a6ff">Oracle RAC (Local HA)</text>
        <text x="15" y="38" font-family="monospace" font-size="9" fill="#79c0ff">Shared-Everything (Cache Fusion)</text>
        <text x="15" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Multi-instance shared SAN/ASM disk</text>
        <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Blocks shipped via private InfiniBand</text>
        <text x="15" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#3fb950">✓ Survives node crash with 0 sec RTO</text>
        <text x="15" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#f85149">❌ Shared storage = Single Point of Failure!</text>
        <text x="15" y="116" font-family="monospace" font-size="8" fill="#8b949e">Scope: Intra-Datacenter High Availability</text>
      </g>

      <!-- System 2: Data Guard -->
      <g transform="translate(345, 0)">
        <rect width="320" height="125" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="15" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#3fb950">Data Guard (Physical DR) 🏆</text>
        <text x="15" y="38" font-family="monospace" font-size="9" fill="#7ee787">Block-Level Redo Log Streaming</text>
        <text x="15" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• LGWR/LNS streams raw REDO to RFS</text>
        <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#3fb950">✓ 100% Bit-for-bit physical replica</text>
        <text x="15" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#3fb950">✓ Zero SQL parsing/execution overhead</text>
        <text x="15" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#3fb950">✓ Sub-second cross-AZ RPO/RTO failover</text>
        <text x="15" y="116" font-family="monospace" font-size="8" fill="#3fb950">Mastercard 3-AZ Resiliency Foundation</text>
      </g>

      <!-- System 3: GoldenGate -->
      <g transform="translate(685, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#da3633"/>
        <text x="15" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#f85149">GoldenGate (Logical CDC) ⚠️</text>
        <text x="15" y="38" font-family="monospace" font-size="9" fill="#f85149">Row-Level SQL Re-Execution</text>
        <text x="15" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Mines redo log → Trail files → SQL insert</text>
        <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#f85149">❌ Conflict Detection (CDR) nightmare</text>
        <text x="15" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#f85149">❌ Severe lag during peak burst writes</text>
        <text x="15" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#f85149">❌ Silent data drift &amp; DDL fragility</text>
        <text x="15" y="116" font-family="monospace" font-size="8" fill="#f85149">Why Abandoned in 3-AZ Active-Active-Active</text>
      </g>
    </g>
  </g>
</svg>
