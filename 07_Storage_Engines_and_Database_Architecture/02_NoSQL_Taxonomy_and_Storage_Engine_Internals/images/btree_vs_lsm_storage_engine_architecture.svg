<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLsm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradLsm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="btreeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="lsmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="wideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>
    <marker id="arrowBlueLsm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreenLsm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradLsm)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Storage Engine Architecture: B-Trees vs. LSM-Trees (DDIA)</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">In-Place Page Mutation vs. Append-Only Log-Structured Merge Trees &amp; Wide-Column Storage Physics</text>
  </g>

  <!-- SECTION 1: B-Tree Storage Engine (Left Column) -->
  <g transform="translate(40, 105)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradLsm)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#btreeGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">1. B-Tree Storage Engine (In-Place Random I/O)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">RDBMS (InnoDB, Oracle, WiredTiger) — Read Optimized</text>

    <g transform="translate(20, 75)">
      <!-- Write Path -->
      <g transform="translate(0, 0)">
        <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">Write Path: WAL + In-Memory Dirty Page</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Write change record to sequential Write-Ahead Log (WAL / Redo).</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Mutate fixed-size 8KB/16KB page in buffer cache (marked dirty).</text>
        <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ Commits immediately once WAL is fsync'd to disk</text>
      </g>

      <!-- Arrow down -->
      <line x1="252" y1="120" x2="252" y2="148" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlueLsm)"/>
      <text x="264" y="138" font-family="monospace" font-size="12" font-weight="700" fill="#58a6ff">Asynchronous Flush</text>

      <!-- Flush & Doublewrite -->
      <g transform="translate(0, 155)">
        <rect width="505" height="225" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Disk Flush &amp; Write Amplification Physics</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Must overwrite fixed 8KB/16KB page on disk in place.</text>
        <text x="16" y="70" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">⚠️ Partial Page Write Risk: Torn page if OS crashes mid-flush!</text>

        <!-- Doublewrite Box -->
        <g transform="translate(14, 82)">
          <rect width="477" height="125" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">Doublewrite Buffer (InnoDB) / Fracturing Defense</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Pages written to contiguous disk array FIRST, then fsync'd.</text>
          <text x="12" y="70" font-family="monospace" font-size="11.5" fill="#f85149">High Write Amplification: 50B change writes ~32KB to disk!</text>
          <text x="12" y="96" font-family="monospace" font-size="11.5" fill="#3fb950">✓ Ultra-Fast Point Reads: Single page read fetches row</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 2: LSM-Tree Storage Engine (Right Column) -->
  <g transform="translate(615, 105)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradLsm)" stroke="#238636" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#lsmGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">2. LSM-Tree Storage Engine (Append-Only Write I/O)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">NoSQL (Cassandra, RocksDB, DynamoDB) — Write Optimized</text>

    <g transform="translate(20, 75)">
      <!-- Memtable Box -->
      <g transform="translate(0, 0)">
        <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#7ee787">In-Memory Memtable (SkipList) &amp; Commit Log</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Sequential append to disk Commit Log (Crash recovery only).</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Insert into in-memory sorted Memtable (Zero disk seek! &lt; 1ms write).</text>
        <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ Zero disk seek latency on high-throughput ingest paths</text>
      </g>

      <!-- Arrow down -->
      <line x1="252" y1="120" x2="252" y2="148" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreenLsm)"/>
      <text x="264" y="138" font-family="monospace" font-size="12" font-weight="700" fill="#3fb950">Flush Threshold (64MB)</text>

      <!-- SSTables & Compaction -->
      <g transform="translate(0, 155)">
        <rect width="505" height="225" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Immutable SSTables &amp; Leveled Compaction</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Memtable flushes as sorted, immutable SSTable on disk.</text>
        <text x="16" y="70" font-family="monospace" font-size="13" fill="#7ee787">✓ Zero in-place overwrites: writes are 100% sequential!</text>

        <!-- Read Path & Bloom Filter -->
        <g transform="translate(14, 82)">
          <rect width="477" height="125" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#79c0ff">Read Path: Bloom Filters + Sparse Index</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Bloom filters check every SSTable in RAM to eliminate wasted seeks.</text>
          <text x="12" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Leveled Compaction merges sorted runs in background, purging keys.</text>
          <text x="12" y="96" font-family="monospace" font-size="12" fill="#e3b341">Trade-off: Higher Read Amplification (checks Memtable + SSTables)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 3: Wide-Column & Cassandra Internals (Bottom Row) -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradLsm)" stroke="#d29922" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#wideGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#e3b341">3. Wide-Column Modeling &amp; The Tombstone Garbage Collection Trap</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Partition Keys (Hash Ring Placement), Clustering Keys (On-Disk Sort Order) &amp; Tombstone Scanning Latency</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: Primary Key -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Compound Primary Key</text>
        <text x="16" y="46" font-family="monospace" font-size="12" fill="#79c0ff">PRIMARY KEY ((card_id), txn_time)</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• <tspan fill="#3fb950" font-weight="700">(card_id)</tspan>: Partition Key</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">  Murmur3 token dictates node placement.</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• <tspan fill="#e3b341" font-weight="700">txn_time</tspan>: Clustering Key</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#3fb950">✓ Query-First: Design tables per query!</text>
      </g>

      <!-- Panel 2: Tombstone Hazard -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">The Tombstone Hazard (DELETEs)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. DELETE does NOT remove data immediately!</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Appends a <tspan fill="#f85149" font-weight="700">Tombstone Marker</tspan> with timestamp.</text>
        <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#e3b341">• Held for <tspan font-family="monospace">gc_grace_seconds (10 days)</tspan></text>
        <text x="16" y="118" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">❌ Scanning &gt; 100k tombstones = Timeout!</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#f85149">Symptom: High P99 latency &amp; Cassandra OOM</text>
      </g>

      <!-- Panel 3: Hot Partition Mitigation -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Mitigating Hot Partitions</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#e3b341">Problem: Celebrity / Spike Key</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• All traffic for 1 key overwhelms 1 node.</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#3fb950">Solution: Synthetic Salting (Bucketing)</text>
        <text x="16" y="118" font-family="monospace" font-size="12" fill="#7ee787">  part_key = card_id + "_" + (hash % 10)</text>
        <text x="16" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Keep bounded partition size &lt; 100MB.</text>
      </g>
    </g>
  </g>
</svg>