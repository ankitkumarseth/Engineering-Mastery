<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">JVM Memory Architecture &amp; 64-bit Object Layout (JOL)</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Runtime Data Areas, Stack Frames, Compressed OOPs &amp; 8-Byte Alignment Padding</text>

  <!-- LEFT PANEL: JVM Runtime Data Areas -->
  <g transform="translate(50, 110)">
    <rect width="525" height="750" rx="10" fill="url(#cardGrad)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="525" height="6" rx="3" fill="#1f6feb"/>
    
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">JVM Runtime Data Areas</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Memory spaces partitioned between thread-private and heap-shared</text>

    <!-- Thread-Private Areas -->
    <rect x="25" y="85" width="475" height="235" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#79c0ff">Thread-Private Areas (Per Active Thread)</text>

    <!-- Stack Frame -->
    <rect x="40" y="128" width="445" height="135" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="55" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">JVM Thread Stack (Call Frames)</text>

    <rect x="55" y="165" width="125" height="85" rx="4" fill="#12243d" stroke="#1f6feb"/>
    <text x="117" y="192" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#79c0ff">Local Vars (LVT)</text>
    <text x="117" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Primitives</text>
    <text x="117" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">&amp; Object OOPs</text>

    <rect x="190" y="165" width="135" height="85" rx="4" fill="#122c1d" stroke="#238636"/>
    <text x="257" y="192" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#3fb950">Operand Stack</text>
    <text x="257" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">LIFO Evaluation</text>
    <text x="257" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Bytecode Ops</text>

    <rect x="335" y="165" width="135" height="85" rx="4" fill="#2d2206" stroke="#d29922"/>
    <text x="402" y="192" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#e3b341">Frame Data</text>
    <text x="402" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Constant Pool</text>
    <text x="402" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Dynamic Linking</text>

    <text x="40" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      • Program Counter (PC) Register: Tracks current bytecode offset.
    </text>
    <text x="40" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      • Native Method Stack: Supports JNI C/C++ method invocations.
    </text>

    <!-- Shared Heap Space -->
    <rect x="25" y="335" width="475" height="230" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="40" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">Shared: Java Heap (-Xms, -Xmx)</text>

    <!-- Young Gen -->
    <rect x="40" y="380" width="225" height="95" rx="6" fill="#122c1d" stroke="#238636"/>
    <text x="152" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#3fb950">Young Generation</text>
    <text x="152" y="432" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">Eden Space (~80%)</text>
    <text x="152" y="454" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ee787">Survivor S0 (10%) | S1 (10%)</text>

    <!-- Old Gen -->
    <rect x="275" y="380" width="210" height="95" rx="6" fill="#12243d" stroke="#1f6feb"/>
    <text x="380" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#58a6ff">Old / Tenured Generation</text>
    <text x="380" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">Long-lived objects</text>
    <text x="380" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Promoted past GC threshold</text>

    <text x="40" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#f0f6fc">
      Generational Hypothesis: 95%+ of newly allocated objects die in Eden.
    </text>
    <text x="40" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      Survivor spaces alternate (from-space / to-space) during minor GC copying.
    </text>
    <text x="40" y="544" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      Tenuring threshold default: 15 (max bits in Mark Word age field = 4).
    </text>

    <!-- Metaspace (Native) -->
    <rect x="25" y="580" width="475" height="145" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
    <text x="40" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#d2a8ff">Shared: Metaspace (Native C++ Heap Memory)</text>
    <text x="40" y="636" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      Replaced PermGen in Java 8. Located in native OS process memory, not JVM heap.
    </text>
    <text x="40" y="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
      • Holds Class metadata, bytecode definitions, method tables, Constant Pool.
    </text>
    <text x="40" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
      • Governed by <tspan font-family="monospace" fill="#79c0ff">-XX:MetaspaceSize</tspan> and <tspan font-family="monospace" fill="#79c0ff">-XX:MaxMetaspaceSize</tspan>.
    </text>
    <text x="40" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ff7b72">
      ⚠️ ClassLoader leaks can exhaust OS virtual memory without triggering Java heap OOM!
    </text>
  </g>

  <!-- RIGHT PANEL: 64-bit Object Header Layout (JOL) -->
  <g transform="translate(625, 110)">
    <rect width="525" height="750" rx="10" fill="url(#cardGrad)" stroke="#d29922" stroke-width="2"/>
    <rect width="525" height="6" rx="3" fill="#d29922"/>

    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#e3b341">64-Bit Object Memory Layout (JOL)</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Standard HotSpot 64-bit JVM Object Structure (Java Object Layout)</text>

    <!-- Component 1: Mark Word -->
    <rect x="25" y="85" width="475" height="170" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <text x="40" y="114" font-family="monospace" font-size="15" font-weight="700" fill="#f85149">1. Mark Word (8 Bytes = 64 Bits)</text>
    
    <text x="40" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      • <tspan font-weight="700" fill="#79c0ff">Identity HashCode</tspan> (31 bits): Computed lazily on first call.
    </text>
    <text x="40" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      • <tspan font-weight="700" fill="#3fb950">GC Age</tspan> (4 bits): Tracks survival count (0..15) before tenuring.
    </text>
    <text x="40" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      • <tspan font-weight="700" fill="#e3b341">Biased Lock</tspan> (1 bit) + <tspan font-weight="700" fill="#e3b341">Lock State</tspan> (2 bits):
    </text>
    <text x="55" y="218" font-family="monospace" font-size="12.5" fill="#8b949e">01 = Unlocked | 00 = Lightweight | 10 = Heavyweight</text>
    <text x="55" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ff7b72">Heavyweight lock replaces Mark Word with OS ObjectMonitor pointer!</text>

    <!-- Component 2: Klass Pointer -->
    <rect x="25" y="270" width="475" height="140" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="40" y="298" font-family="monospace" font-size="14.5" font-weight="700" fill="#58a6ff">2. Klass Word (4B with +UseCompressedClassPointers)</text>

    <text x="40" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      Direct pointer referencing native <tspan font-family="monospace" fill="#79c0ff">InstanceKlass</tspan> in Metaspace.
    </text>
    <text x="40" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      • 4 Bytes with Compressed Class Pointers (default on heaps &lt; 32GB).
    </text>
    <text x="40" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      • 8 Bytes if uncompressed (heaps ≥ 32GB without zero-base shifting).
    </text>
    <text x="40" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#7ee787">
      Total Object Header = 8B (Mark Word) + 4B (Klass Word) = 12 Bytes!
    </text>

    <!-- Component 3: Instance Fields -->
    <rect x="25" y="425" width="475" height="150" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="40" y="454" font-family="monospace" font-size="15" font-weight="700" fill="#3fb950">3. Instance Data (Field Values)</text>

    <text x="40" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      Stores primitive fields and object reference pointers (OOPs).
    </text>
    <text x="40" y="508" font-family="monospace" font-size="12.5" fill="#7ee787">
      boolean/byte: 1B • short/char: 2B • int/float: 4B • long/double: 8B
    </text>
    <text x="40" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      • References (OOPs): 4B (+UseCompressedOops) vs 8B uncompressed.
    </text>
    <text x="40" y="554" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9">
      JVM reorders fields by size to minimize alignment padding gaps.
    </text>

    <!-- Component 4: Alignment Padding -->
    <rect x="25" y="590" width="475" height="135" rx="8" fill="#161b22" stroke="#8b949e" stroke-dasharray="3,3"/>
    <text x="40" y="618" font-family="monospace" font-size="15" font-weight="700" fill="#c9d1d9">4. Alignment Padding (0 to 7 Bytes)</text>

    <text x="40" y="646" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
      HotSpot requires objects to align to 8-byte boundaries.
    </text>
    <text x="40" y="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      • If (Header + Instance Data) % 8 != 0, 1 to 7 dummy bytes are padded.
    </text>
    <text x="40" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#79c0ff">
      Min Object Size: new Object() = 12B header + 4B padding = 16B!
    </text>
  </g>
</svg>
