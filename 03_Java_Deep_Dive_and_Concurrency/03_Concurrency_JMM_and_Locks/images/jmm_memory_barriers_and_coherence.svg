<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Java Memory Model (JMM): Hardware Caches, Volatile &amp; Fences</text>
  <text x="480" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">MESI Cache Coherence Protocol, Store Buffers &amp; Memory Barrier Semantics (Happens-Before)</text>

  <!-- Core 1 Container -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="380" height="230" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="190" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#60a5fa">CPU Core 0 (Thread A - Writer)</text>

    <!-- Execution Engine -->
    <rect x="25" y="45" width="330" height="45" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="190" y="73" text-anchor="middle" font-family="monospace" font-size="12" fill="#f8fafc">Execution Unit: write volatile x = 1</text>

    <!-- Store Buffer -->
    <rect x="25" y="105" width="330" height="45" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
    <text x="190" y="125" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5">Store Buffer (Asynchronous Write Hold)</text>
    <text x="190" y="140" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#fca5a5">Without fence: CPU stalls delayed in buffer!</text>

    <!-- L1/L2 Cache -->
    <rect x="25" y="165" width="330" height="45" rx="4" fill="#0f172a" stroke="#3b82f6"/>
    <text x="190" y="193" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">L1 / L2 Cache (Cache Line: 64 Bytes)</text>
  </g>

  <!-- Core 2 Container -->
  <g transform="translate(520, 90)">
    <rect x="0" y="0" width="380" height="230" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="190" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34d399">CPU Core 1 (Thread B - Reader)</text>

    <!-- Execution Engine -->
    <rect x="25" y="45" width="330" height="45" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="190" y="73" text-anchor="middle" font-family="monospace" font-size="12" fill="#f8fafc">Execution Unit: read volatile x</text>

    <!-- Invalidate Queue -->
    <rect x="25" y="105" width="330" height="45" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="190" y="125" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0">Invalidate Queue (Cache Invalidation)</text>
    <text x="190" y="140" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#a7f3d0">Processes MESI invalidate signals</text>

    <!-- L1/L2 Cache -->
    <rect x="25" y="165" width="330" height="45" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="190" y="193" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">L1 / L2 Cache (Cache Line: 64 Bytes)</text>
  </g>

  <!-- Interconnect / Memory Bus -->
  <g transform="translate(60, 345)">
    <rect x="0" y="0" width="840" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="420" y="27" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Interconnect Bus (MESI Protocol Snooping &amp; Invalidation Broadcast)</text>

    <line x1="190" y1="-25" x2="190" y2="0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="-25" x2="650" y2="0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Main Memory (RAM) -->
  <g transform="translate(60, 415)">
    <rect x="0" y="0" width="840" height="105" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="420" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Main Memory (RAM) &amp; Volatile Memory Barrier Guarantees</text>

    <!-- Fences Definition -->
    <rect x="20" y="40" width="380" height="50" rx="4" fill="#1e293b" stroke="#3b82f6"/>
    <text x="35" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#60a5fa">Volatile Write Barriers: StoreStore + StoreLoad</text>
    <text x="35" y="77" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Flushes Store Buffer to L1/RAM; prevents write reordering.</text>

    <rect x="440" y="40" width="380" height="50" rx="4" fill="#1e293b" stroke="#10b981"/>
    <text x="455" y="60" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">Volatile Read Barriers: LoadLoad + LoadStore</text>
    <text x="455" y="77" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Invalidates stale cache; forces refresh from memory bus.</text>
  </g>
</svg>