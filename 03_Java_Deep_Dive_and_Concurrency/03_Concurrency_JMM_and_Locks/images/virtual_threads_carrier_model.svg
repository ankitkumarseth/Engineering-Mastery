<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Java 21 Virtual Threads (Project Loom): Carrier Thread Model &amp; Pinning</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">M:N User-Mode Scheduling • Continuation Unmounting on I/O • The Synchronized Pinning Trap</text>

  <!-- LEFT PANEL: Traditional Platform Threads (1:1 Model) -->
  <g transform="translate(50, 110)">
    <rect width="410" height="750" rx="10" fill="url(#cardGrad)" stroke="#da3633" stroke-width="2"/>
    <rect width="410" height="6" rx="3" fill="#da3633"/>
    
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f85149">Platform Threads (1:1 Model)</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">1 Java Thread = 1 OS Kernel pthread (Heavyweight)</text>

    <!-- Stack 1 -->
    <rect x="25" y="85" width="360" height="110" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <text x="40" y="115" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">Thread-1 [BLOCKED ON SOCKET I/O]</text>
    <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">Holds 1MB fixed native stack in OS RAM.</text>
    <text x="40" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">OS kernel parks thread; CPU core sits completely idle.</text>
    <text x="40" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ff7b72">Kernel context switch cost: ~1-2 µs</text>

    <!-- Stack 2 -->
    <rect x="25" y="210" width="360" height="110" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <text x="40" y="240" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">Thread-2 [BLOCKED ON DB QUERY]</text>
    <text x="40" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">Holds 1MB fixed native stack in OS RAM.</text>
    <text x="40" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">Waiting for database network reply across wire.</text>
    <text x="40" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ff7b72">Cannot release OS thread during blocking call.</text>

    <!-- Stack N -->
    <rect x="25" y="335" width="360" height="90" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="365" font-family="monospace" font-size="14" font-weight="700" fill="#8b949e">Thread-N ... (Up to ~4,000)</text>
    <text x="40" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#ff7b72">OutOfMemoryError: unable to create native thread</text>
    <text x="40" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">OS limits virtual memory and thread table.</text>

    <!-- Bottlenecks Callout Card -->
    <rect x="25" y="450" width="360" height="275" rx="8" fill="#161b22" stroke="#da3633"/>
    <text x="40" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">⚠️ Architectural Scalability Limits</text>
    
    <text x="40" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">• 1MB Fixed Stack Per Thread:</text>
    <text x="55" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">5,000 threads consume 5GB RAM solely for thread call stacks!</text>

    <text x="40" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">• Expensive Context Switching:</text>
    <text x="55" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Requires OS ring-0 privilege transitions and CPU L1/L2 cache flushes.</text>

    <text x="40" y="624" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">• Complex Thread Pool Sizing:</text>
    <text x="55" y="646" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Requires Little's Law, queue bounds, and reject policies.</text>

    <text x="40" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">• Thread-per-Request Fails:</text>
    <text x="55" y="702" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#ff7b72">Cannot sustain 50,000+ concurrent connections.</text>
  </g>

  <!-- RIGHT PANEL: Virtual Threads (M:N Loom Architecture) -->
  <g transform="translate(490, 110)">
    <rect width="660" height="750" rx="10" fill="url(#cardGrad)" stroke="#238636" stroke-width="2"/>
    <rect width="660" height="6" rx="3" fill="#238636"/>

    <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">Virtual Threads: M:N Loom Architecture</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">1,000,000+ Lightweight Virtual Threads on a small pool of Carrier Threads</text>

    <!-- Top: Virtual Threads (Heap Allocated) -->
    <g transform="translate(30, 85)">
      <rect width="600" height="150" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#58a6ff">Virtual Threads (~few KB stack stored as continuation in JVM Heap)</text>

      <!-- VT 1: Running -->
      <rect x="20" y="45" width="175" height="85" rx="6" fill="#122c1d" stroke="#238636" stroke-width="1.5"/>
      <text x="35" y="72" font-family="monospace" font-size="13.5" font-weight="700" fill="#3fb950">VT #1 (Mounted)</text>
      <text x="35" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#7ee787">Active on Carrier-0</text>
      <text x="35" y="114" font-family="monospace" font-size="12" fill="#3fb950">State: RUNNING</text>

      <!-- VT 2: Unmounted on I/O -->
      <rect x="210" y="45" width="180" height="85" rx="6" fill="#12243d" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="225" y="72" font-family="monospace" font-size="13.5" font-weight="700" fill="#58a6ff">VT #2 (Unmounted)</text>
      <text x="225" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#79c0ff">Waiting on Socket/DB</text>
      <text x="225" y="114" font-family="monospace" font-size="12" fill="#58a6ff">Continuation.yield()</text>

      <!-- VT 3: Pinned Warning -->
      <rect x="405" y="45" width="175" height="85" rx="6" fill="#3c1e1e" stroke="#da3633" stroke-width="1.5"/>
      <text x="420" y="72" font-family="monospace" font-size="13.5" font-weight="700" fill="#f85149">VT #3 (PINNED ⚠️)</text>
      <text x="420" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ff7b72">Inside synchronized!</text>
      <text x="420" y="114" font-family="monospace" font-size="12" fill="#ffa198">Cannot unmount!</text>
    </g>

    <!-- Mount / Unmount Arrows -->
    <path d="M 140 240 L 140 270" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="155" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#3fb950">Mount</text>

    <path d="M 330 270 L 330 240" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="345" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#58a6ff">Unmount on I/O</text>

    <!-- Middle: Carrier Pool (ForkJoinPool) -->
    <g transform="translate(30, 275)">
      <rect width="600" height="150" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
      <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#3fb950">Carrier Thread Pool: ForkJoinPool (Size = Number of CPU Cores)</text>

      <!-- Carrier 0 -->
      <rect x="20" y="45" width="175" height="85" rx="6" fill="#122c1d" stroke="#238636"/>
      <text x="35" y="72" font-family="monospace" font-size="13.5" font-weight="700" fill="#3fb950">Carrier Thread 0</text>
      <text x="35" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#7ee787">Running VT #1</text>
      <text x="35" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">100% CPU Utilization</text>

      <!-- Carrier 1 -->
      <rect x="210" y="45" width="180" height="85" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="225" y="72" font-family="monospace" font-size="13.5" font-weight="700" fill="#f0f6fc">Carrier Thread 1</text>
      <text x="225" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#58a6ff">Running Next VT...</text>
      <text x="225" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Work-stealing queue</text>

      <!-- Carrier 2 (Stalled) -->
      <rect x="405" y="45" width="175" height="85" rx="6" fill="#3c1e1e" stroke="#da3633" stroke-width="1.5"/>
      <text x="420" y="72" font-family="monospace" font-size="13.5" font-weight="700" fill="#f85149">Carrier-2 (STALLED)</text>
      <text x="420" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#ff7b72">Blocked by VT #3!</text>
      <text x="420" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ffa198">OS Thread frozen!</text>
    </g>

    <!-- Bottom: Pinning Trap & Best Practices -->
    <g transform="translate(30, 450)">
      <rect width="600" height="275" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
      <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#e3b341">🚨 The Staff Architect Trap: Thread Pinning &amp; Production Invariants</text>

      <text x="25" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f85149">
        • The Pinning Cause (synchronized / JNI):
      </text>
      <text x="40" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
        When a virtual thread executes blocking I/O inside a <tspan font-family="monospace" fill="#ff7b72">synchronized</tspan> block or native frame,
      </text>
      <text x="40" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
        the JVM cannot unmount it from the OS carrier thread, freezing the underlying CPU core!
      </text>

      <text x="25" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#3fb950">
        • The Antidote (ReentrantLock):
      </text>
      <text x="40" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
        Replace synchronized with <tspan font-family="monospace" fill="#7ee787">java.util.concurrent.locks.ReentrantLock</tspan>.
      </text>
      <text x="40" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
        AQS uses LockSupport.park() which unmounts cleanly without pinning the carrier thread.
      </text>

      <text x="25" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#58a6ff">
        • Never Pool Virtual Threads (Anti-Pattern):
      </text>
      <text x="40" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
        Do NOT wrap virtual threads in ThreadPoolExecutor. They are ephemeral and cheap.
      </text>
      <text x="40" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#79c0ff">
        Spawn on-demand via: <tspan font-family="monospace">Executors.newVirtualThreadPerTaskExecutor()</tspan>
      </text>
    </g>
  </g>
</svg>
