<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">AbstractQueuedSynchronizer (AQS) Internals &amp; ReentrantLock</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Volatile State Variable, Exclusive Owner Thread &amp; FIFO CLH Doubly-Linked Wait Queue</text>

  <!-- TOP SECTION: AQS Core State Controls -->
  <g transform="translate(50, 105)">
    <rect width="1100" height="175" rx="10" fill="url(#cardGrad)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="1100" height="6" rx="3" fill="#1f6feb"/>
    <text x="30" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">AQS Core Synchronization State &amp; Exclusive Ownership</text>

    <!-- State Variable Box -->
    <rect x="30" y="55" width="505" height="100" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="50" y="85" font-family="monospace" font-size="16" font-weight="700" fill="#3fb950">volatile int state = 1;</text>
    <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">0 = Unlocked • 1 = Locked • &gt;1 = Reentrant Hold Count</text>
    <text x="50" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Mutated exclusively via hardware CAS: compareAndSetState(0, 1)</text>

    <!-- Owner Thread Box -->
    <rect x="565" y="55" width="505" height="100" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <text x="585" y="85" font-family="monospace" font-size="16" font-weight="700" fill="#f85149">exclusiveOwnerThread = Thread-0;</text>
    <text x="585" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">Currently holding lock; other threads are blocked and queued</text>
    <text x="585" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Tracked via setExclusiveOwnerThread(Thread.currentThread())</text>
  </g>

  <!-- MIDDLE SECTION: FIFO CLH Wait Queue -->
  <g transform="translate(50, 305)">
    <rect width="1100" height="360" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="2"/>
    <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">FIFO CLH Wait Queue: Doubly-Linked Node&lt;Thread&gt; Chain</text>
    <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Blocked threads parked via LockSupport.park() waiting for head node release signal</text>

    <!-- Head Pointer -->
    <text x="120" y="100" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#58a6ff">head</text>
    <line x1="120" y1="108" x2="120" y2="135" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Dummy Head Node -->
    <rect x="40" y="145" width="160" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="120" y="180" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#8b949e">Dummy Head</text>
    <text x="120" y="210" text-anchor="middle" font-family="monospace" font-size="13" fill="#6e7681">thread = null</text>
    <text x="120" y="235" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#79c0ff">waitStatus: -1</text>
    <text x="120" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b949e">(SIGNAL)</text>

    <!-- Links: Head <-> Node 1 -->
    <line x1="200" y1="190" x2="280" y2="190" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">next</text>
    <line x1="280" y1="225" x2="200" y2="225" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="242" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">prev</text>

    <!-- Node 1 (Thread 1) -->
    <rect x="290" y="145" width="220" height="130" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="400" y="180" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#58a6ff">Node: Thread-1</text>
    <text x="400" y="210" text-anchor="middle" font-family="monospace" font-size="13" fill="#f0f6fc">waitStatus: -1 (SIGNAL)</text>
    <text x="400" y="235" text-anchor="middle" font-family="monospace" font-size="13" fill="#7ee787">LockSupport.park()</text>
    <text x="400" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Next in line to acquire</text>

    <!-- Links: Node 1 <-> Node 2 -->
    <line x1="510" y1="190" x2="590" y2="190" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="550" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">next</text>
    <line x1="590" y1="225" x2="510" y2="225" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="550" y="242" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">prev</text>

    <!-- Node 2 (Thread 2) -->
    <rect x="600" y="145" width="220" height="130" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="710" y="180" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#58a6ff">Node: Thread-2</text>
    <text x="710" y="210" text-anchor="middle" font-family="monospace" font-size="13" fill="#f0f6fc">waitStatus: -1 (SIGNAL)</text>
    <text x="710" y="235" text-anchor="middle" font-family="monospace" font-size="13" fill="#7ee787">LockSupport.park()</text>
    <text x="710" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Queued behind Thread-1</text>

    <!-- Links: Node 2 <-> Node 3 (Tail) -->
    <line x1="820" y1="190" x2="900" y2="190" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="860" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">next</text>
    <line x1="900" y1="225" x2="820" y2="225" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="860" y="242" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">prev</text>

    <!-- Node 3 (Tail - Thread 3) -->
    <rect x="910" y="145" width="160" height="130" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="990" y="180" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">Thread-3 (Tail)</text>
    <text x="990" y="210" text-anchor="middle" font-family="monospace" font-size="13" fill="#f0f6fc">waitStatus: 0</text>
    <text x="990" y="235" text-anchor="middle" font-family="monospace" font-size="13" fill="#7ee787">park()</text>
    <text x="990" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b949e">Latest arrival</text>

    <!-- Tail Pointer -->
    <text x="990" y="100" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#e3b341">tail</text>
    <line x1="990" y1="108" x2="990" y2="135" stroke="#d29922" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- Bottom Explanatory Strip -->
    <rect x="30" y="295" width="1040" height="48" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="50" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">
      ⚡ <tspan font-weight="700" fill="#58a6ff">CLH Queue Invariant</tspan>: Each node signals its successor upon release. A node’s waitStatus is updated to SIGNAL (-1) by its waiting downstream neighbor.
    </text>
  </g>

  <!-- BOTTOM SECTION: Lock Acquisition vs. Release Mechanics -->
  <g transform="translate(50, 685)">
    <rect width="1100" height="180" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Left Column: Acquisition -->
    <g transform="translate(30, 20)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">🔒 Lock Acquisition Mechanics (Non-Fair vs Fair)</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
        1. <tspan font-weight="600" fill="#7ee787">Non-Fair Sync (Default)</tspan>: Arriving thread immediately attempts CAS on state (barging).
      </text>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
        If successful, bypasses queue entirely, avoiding thread park/unpark context switch latency.
      </text>
      <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
        2. <tspan font-weight="600" fill="#79c0ff">Enqueuing on Failure</tspan>: Thread encapsulates in Node, enqueues at tail via CAS loop,
      </text>
      <text x="18" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
        sets predecessor's waitStatus to SIGNAL, and calls LockSupport.park(this) to sleep.
      </text>
    </g>

    <!-- Right Column: Release -->
    <g transform="translate(570, 20)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">🔓 Lock Release &amp; Unpark Flow</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
        1. <tspan font-weight="600" fill="#ff7b72">unlock() Invocations</tspan>: Holding thread decrements volatile state variable.
      </text>
      <text x="18" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
        When state reaches 0, exclusiveOwnerThread is set to null (lock officially free).
      </text>
      <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">
        2. <tspan font-weight="600" fill="#58a6ff">Successor Notification</tspan>: AQS checks head.waitStatus == SIGNAL.
      </text>
      <text x="18" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
        Finds head.next (Thread-1) and executes LockSupport.unpark(Thread-1.thread) to awaken it.
      </text>
    </g>
  </g>
</svg>
