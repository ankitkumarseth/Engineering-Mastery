<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">ConcurrentHashMap Evolution: Java 7 Segments vs. Java 8+ Per-Bin Locking</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">Lock-Free CAS Reads &amp; Inserts • Fine-Grained Synchronized Bin Heads • Striped CounterCell Sizing</text>

  <!-- LEFT PANEL: Java 7 Architecture (Coarse Striping) -->
  <g transform="translate(50, 110)">
    <rect width="410" height="750" rx="10" fill="url(#cardGrad)" stroke="#da3633" stroke-width="2"/>
    <rect width="410" height="6" rx="3" fill="#da3633"/>
    
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f85149">Java 7: Segment Striping</text>
    <text x="25" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Segment&lt;K,V&gt;[] extends ReentrantLock</text>

    <!-- Segment 0 -->
    <rect x="25" y="85" width="360" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="115" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">Segment[0] (ReentrantLock)</text>
    <rect x="40" y="130" width="330" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="55" y="160" font-family="monospace" font-size="13" fill="#8b949e">HashEntry&lt;K,V&gt;[] (Table 0..n)</text>

    <!-- Segment 1 (Locked) -->
    <rect x="25" y="215" width="360" height="120" rx="6" fill="#161b22" stroke="#da3633" stroke-width="2"/>
    <text x="40" y="245" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">Segment[1] (LOCKED 🔒)</text>
    <rect x="40" y="260" width="330" height="58" rx="4" fill="#3c1e1e" stroke="#da3633"/>
    <text x="55" y="285" font-family="monospace" font-size="13" font-weight="700" fill="#ff7b72">All keys in Segment 1 BLOCKED</text>
    <text x="55" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ffa198">Threads waiting for Segment 1 lock stall</text>

    <!-- Segment 15 -->
    <rect x="25" y="355" width="360" height="110" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="385" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">Segment[15] (ReentrantLock)</text>
    <rect x="40" y="400" width="330" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="55" y="430" font-family="monospace" font-size="13" fill="#8b949e">HashEntry&lt;K,V&gt;[] (Table 0..n)</text>

    <!-- Bottlenecks Callout -->
    <rect x="25" y="485" width="360" height="240" rx="8" fill="#161b22" stroke="#da3633"/>
    <text x="40" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">⚠️ Architectural Inefficiencies</text>
    
    <text x="40" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e6edf3">• Fixed Concurrency Level:</text>
    <text x="55" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Default 16 segments. Max 16 concurrent</text>
    <text x="55" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">writers regardless of available CPU cores.</text>

    <text x="40" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e6edf3">• Heavy Memory Footprint:</text>
    <text x="55" y="625" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">16 Segment instances + sync objects</text>
    <text x="55" y="643" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">created even for tiny maps.</text>

    <text x="40" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e6edf3">• Global Lock Contention:</text>
    <text x="55" y="688" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">size() and isEmpty() acquire locks across</text>
    <text x="55" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">ALL segments consecutively.</text>
  </g>

  <!-- RIGHT PANEL: Java 8+ Architecture (CAS + Fine-Grained Locking) -->
  <g transform="translate(490, 110)">
    <rect width="660" height="750" rx="10" fill="url(#cardGrad)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="660" height="6" rx="3" fill="#1f6feb"/>

    <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">Java 8+: CAS + Per-Bin synchronized Lock + CounterCell</text>
    <text x="30" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b949e">Zero lock overhead for reads; writes lock only the single target bucket head</text>

    <!-- Table Array -->
    <g transform="translate(30, 85)">
      <rect width="210" height="390" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="105" y="32" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">Node&lt;K,V&gt;[] table</text>

      <!-- Bin 0: Empty CAS -->
      <rect x="15" y="50" width="180" height="65" rx="6" fill="#122c1d" stroke="#238636" stroke-width="1.5"/>
      <text x="25" y="78" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">[0] Empty (null)</text>
      <text x="25" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#7ee787">Lock-Free CAS Insert</text>

      <!-- Bin 1: Populated, locked -->
      <rect x="15" y="130" width="180" height="75" rx="6" fill="#3c1e1e" stroke="#da3633" stroke-width="1.5"/>
      <text x="25" y="158" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">[1] Head Node 🔒</text>
      <text x="25" y="178" font-family="monospace" font-size="12" fill="#ff7b72">synchronized(head)</text>
      <text x="25" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#ffa198">Only Bin 1 is locked!</text>

      <!-- Bin 2: Populated, unlocked -->
      <rect x="15" y="220" width="180" height="65" rx="6" fill="#161b22" stroke="#58a6ff"/>
      <text x="25" y="248" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">[2] Head Node 🔓</text>
      <text x="25" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#79c0ff">100% Unlocked for Read/Write</text>

      <!-- Bin 3: ForwardingNode -->
      <rect x="15" y="300" width="180" height="70" rx="6" fill="#2d2206" stroke="#d29922"/>
      <text x="25" y="328" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">[3] ForwardingNode</text>
      <text x="25" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#d29922">Concurrent resize (helpTransfer)</text>
    </g>

    <!-- Scenarios Right Sub-Panel -->
    <g transform="translate(260, 85)">
      <!-- Case 1: Empty Bin Insert -->
      <rect width="370" height="115" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3fb950">1. Empty Bucket: Lock-Free CAS</text>
      <text x="18" y="55" font-family="monospace" font-size="13" fill="#7ee787">casTabAt(tab, i, null, node)</text>
      <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Inserts head node via atomic hardware CAS.</text>
      <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Zero lock acquisition or thread descheduling.</text>
      <line x1="-20" y1="58" x2="0" y2="58" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>

      <!-- Case 2: Populated Bin Collision -->
      <g transform="translate(0, 130)">
        <rect width="370" height="125" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
        <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f85149">2. Collision: synchronized(firstNode)</text>
        <text x="18" y="55" font-family="monospace" font-size="13" fill="#ff7b72">synchronized(node) { ... }</text>
        <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Synchronizes strictly on the bucket head node.</text>
        <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Bins 0, 2, 3..n remain 100% concurrently accessible!</text>
        <line x1="-20" y1="62" x2="0" y2="62" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed)"/>
      </g>

      <!-- Case 3: Concurrent Reads -->
      <g transform="translate(0, 270)">
        <rect width="370" height="115" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#58a6ff">3. Concurrent Reads: 100% Lock-Free</text>
        <text x="18" y="55" font-family="monospace" font-size="13" fill="#79c0ff">volatile V val; volatile Node next;</text>
        <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Memory visibility guaranteed by volatile reads.</text>
        <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Never blocked by concurrent writes or tree traversals.</text>
        <line x1="-20" y1="58" x2="0" y2="58" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
      </g>
    </g>

    <!-- Bottom Striped CounterCell Box -->
    <g transform="translate(30, 495)">
      <rect width="600" height="230" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
      <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#d2a8ff">📊 High-Throughput Concurrent Sizing: CounterCell[] (LongAdder Principle)</text>
      
      <text x="25" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#e6edf3">Instead of bottlenecking all threads on a single shared AtomicLong variable,</text>
      <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">ConcurrentHashMap maintains a base count and a dynamic striped CounterCell array.</text>

      <rect x="25" y="100" width="550" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="40" y="125" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">size() = baseCount + ∑ CounterCell[i].value</text>

      <text x="25" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#c9d1d9">• Thread hash indexes into thread-specific CounterCell via CAS to increment.</text>
      <text x="25" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#c9d1d9">• @jdk.internal.vm.annotation.Contended prevents CPU cache line bouncing.</text>
      <text x="25" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#7ee787">✓ Millions of concurrent increments/sec with zero thread contention!</text>
    </g>
  </g>
</svg>
