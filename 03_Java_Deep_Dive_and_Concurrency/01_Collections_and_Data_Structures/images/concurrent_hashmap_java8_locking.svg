<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="url(#bgGrad)" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">ConcurrentHashMap Evolution: Java 7 Segments vs Java 8+ Per-Bin Locking</text>
  <text x="500" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Lock-Free CAS Reads &amp; Inserts + Fine-Grained Synchronized Bin Heads + Striped CounterCell Size</text>

  <!-- Left: Java 7 Architecture (Coarse Striping) -->
  <g transform="translate(35, 85)">
    <rect x="0" y="0" width="270" height="450" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="135" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">Java 7: Segment Striping</text>
    <text x="135" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Segment[] extends ReentrantLock</text>

    <!-- Segment 0 -->
    <rect x="20" y="70" width="230" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="93" font-family="monospace" font-size="12" font-weight="700" fill="#cbd5e1">Segment[0] (Lock)</text>
    <rect x="35" y="105" width="200" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="45" y="123" font-family="monospace" font-size="10" fill="#94a3b8">HashEntry[] (Table 0..n)</text>

    <!-- Segment 1 -->
    <rect x="20" y="160" width="230" height="75" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="183" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">Segment[1] (LOCKED 🔒)</text>
    <rect x="35" y="195" width="200" height="28" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
    <text x="45" y="213" font-family="monospace" font-size="10" fill="#fca5a5">All keys in this segment blocked</text>

    <!-- Segment 15 -->
    <rect x="20" y="250" width="230" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="273" font-family="monospace" font-size="12" font-weight="700" fill="#cbd5e1">Segment[15] (Lock)</text>
    <rect x="35" y="285" width="200" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="45" y="303" font-family="monospace" font-size="10" fill="#94a3b8">HashEntry[] (Table 0..n)</text>

    <text x="25" y="360" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171">⚠️ Inefficiencies:</text>
    <text x="25" y="380" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Concurrency limited to 16 by default</text>
    <text x="25" y="400" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Heavy memory footprint per Segment</text>
    <text x="25" y="420" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• ReentrantLock instance overhead</text>
  </g>

  <!-- Right: Java 8+ Architecture (Lock-Free + Bin Locking) -->
  <g transform="translate(330, 85)">
    <rect x="0" y="0" width="635" height="450" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="317" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#60a5fa">Java 8+: CAS + Per-Bin synchronized Lock + CounterCell</text>
    <text x="317" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#93c5fd">Zero Lock overhead for reads; Writes lock only the single target bucket head</text>

    <!-- Table Array -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="165" height="240" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="82" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">Node&lt;K,V&gt;[] table</text>

      <!-- Bin 0: Empty CAS -->
      <rect x="15" y="40" width="135" height="32" rx="4" fill="#064e3b" stroke="#34d399"/>
      <text x="25" y="60" font-family="monospace" font-size="11" fill="#a7f3d0">[0] Empty (null)</text>

      <!-- Bin 1: Populated, locked -->
      <rect x="15" y="85" width="135" height="32" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="25" y="105" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5">[1] Head Node 🔒</text>

      <!-- Bin 2: Populated, unlocked -->
      <rect x="15" y="130" width="135" height="32" rx="4" fill="#1e293b" stroke="#60a5fa"/>
      <text x="25" y="150" font-family="monospace" font-size="11" fill="#93c5fd">[2] Head Node 🔓</text>

      <!-- Bin 3: ForwardingNode -->
      <rect x="15" y="175" width="135" height="32" rx="4" fill="#451a03" stroke="#f59e0b"/>
      <text x="25" y="195" font-family="monospace" font-size="10" fill="#fcd34d">[3] ForwardingNode</text>
    </g>

    <!-- Scenario Callouts (Widened to 380px) -->
    <!-- Case 1: Empty Bin Insert -->
    <g transform="translate(225, 100)">
      <rect x="0" y="0" width="385" height="50" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="15" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">1. Empty Bucket Insertion: Lock-Free CAS</text>
      <text x="15" y="38" font-family="monospace" font-size="9.5" fill="#cbd5e1">casTabAt(tab, i, null, new Node(hash, key, val))</text>
      <path d="M -25 15 L 0 15" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    </g>

    <!-- Case 2: Populated Bin Write -->
    <g transform="translate(225, 160)">
      <rect x="0" y="0" width="385" height="55" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171">2. Collision / Existing Bin: synchronized(firstNode)</text>
      <text x="15" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">Locks ONLY Bin [1]. Bin [0], [2], [3]... remain 100% unlocked!</text>
      <path d="M -25 15 L 0 15" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    </g>

    <!-- Case 3: Concurrent Reads -->
    <g transform="translate(225, 225)">
      <rect x="0" y="0" width="385" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">3. Concurrent Reads (get()): 100% Lock-Free</text>
      <text x="15" y="38" font-family="monospace" font-size="9.5" fill="#cbd5e1">volatile V val; volatile Node&lt;K,V&gt; next;</text>
      <path d="M -25 15 L 0 15" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    </g>

    <!-- Striped CounterCell Box (Wrapped lines) -->
    <g transform="translate(25, 325)">
      <rect x="0" y="0" width="585" height="100" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#c084fc">📊 Striped High-Throughput Sizing: CounterCell[] (LongAdder Principle)</text>
      <text x="20" y="42" font-family="-apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">
        Instead of a single bottleneck AtomicLong for map.size(),
      </text>
      <text x="20" y="58" font-family="-apple-system, sans-serif" font-size="10.5" fill="#cbd5e1">
        concurrent threads update separate striped CounterCells via CAS.
      </text>
      <text x="20" y="82" font-family="monospace" font-size="9.5" fill="#38bdf8">
        sum() = baseCount + sum(CounterCell[i].value)  (Zero cache-line bouncing!)
      </text>
    </g>
  </g>
</svg>