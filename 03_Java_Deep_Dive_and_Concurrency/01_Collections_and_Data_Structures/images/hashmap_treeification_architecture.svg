<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">HashMap Internal Bucket Architecture &amp; Treeification</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">JDK 8+ Transition from Singly-Linked List (O(N)) to Red-Black Tree (O(log N))</text>

  <!-- TOP BAR: Bitwise Hash Spreading & Modulo -->
  <g transform="translate(50, 105)">
    <rect width="1100" height="95" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Left: Spreading Function -->
    <text x="25" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#58a6ff">1. Hash Code Spreading Function</text>
    <text x="25" y="48" font-family="monospace" font-size="12" font-weight="700" fill="#79c0ff">static final int hash(Object key) { int h;</text>
    <text x="25" y="66" font-family="monospace" font-size="12" font-weight="700" fill="#79c0ff">  return (key == null) ? 0 : (h = key.hashCode()) ^ (h &gt;&gt;&gt; 16); }</text>
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b949e">Mixes top 16 bits with bottom 16 bits via XOR to distribute entropy across small table masks.</text>

    <!-- Right: Fast Modulo -->
    <text x="640" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3fb950">2. Power-of-Two Bitwise Modulo</text>
    <text x="640" y="50" font-family="monospace" font-size="12.5" font-weight="700" fill="#7ee787">int index = (n - 1) &amp; hash;</text>
    <text x="640" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b949e">Replaces CPU integer division with 1-cycle bitwise AND mask.</text>
    <text x="640" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b949e">Requires table capacity n to strictly remain a power of 2.</text>
  </g>

  <!-- LEFT: Bucket Array (Node<K,V>[] table) -->
  <g transform="translate(50, 220)">
    <rect width="250" height="630" rx="10" fill="url(#cardGrad)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="250" height="6" rx="3" fill="#1f6feb"/>
    <text x="125" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#58a6ff">Node&lt;K,V&gt;[] table</text>
    <text x="125" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Capacity = 16 (Default)</text>

    <!-- Bucket 0 -->
    <rect x="20" y="80" width="210" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="35" y="113" font-family="monospace" font-size="14" fill="#8b949e">[0] null</text>

    <!-- Bucket 1 -->
    <rect x="20" y="150" width="210" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="35" y="183" font-family="monospace" font-size="14" fill="#8b949e">[1] null</text>

    <!-- Bucket 2: Linked List -->
    <rect x="20" y="220" width="210" height="85" rx="6" fill="#12243d" stroke="#1f6feb" stroke-width="2"/>
    <text x="35" y="250" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">[2] Head Node 🔗</text>
    <text x="35" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#79c0ff">&lt; 8 elements</text>
    <text x="35" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Singly-Linked List</text>

    <!-- Bucket 3 -->
    <rect x="20" y="320" width="210" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="35" y="353" font-family="monospace" font-size="14" fill="#8b949e">[3] ...</text>

    <!-- Bucket 4: Treeified -->
    <rect x="20" y="390" width="210" height="95" rx="6" fill="#3c1e1e" stroke="#da3633" stroke-width="2"/>
    <text x="35" y="420" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">[4] TreeNode Root 🌳</text>
    <text x="35" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ff7b72">≥ 8 items &amp;&amp; Cap ≥ 64</text>
    <text x="35" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ffa198">Red-Black Tree</text>

    <!-- Bucket 15 -->
    <rect x="20" y="500" width="210" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="35" y="533" font-family="monospace" font-size="14" fill="#8b949e">[15] null</text>

    <text x="125" y="595" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Load Factor: 0.75 (Threshold = 12)</text>
  </g>

  <!-- RIGHT: Main Structure & Details -->
  <!-- Top Right: Treeification Rules Card -->
  <g transform="translate(330, 220)">
    <rect width="820" height="155" rx="10" fill="url(#cardGrad)" stroke="#d29922" stroke-width="2"/>
    <rect width="820" height="6" rx="3" fill="#d29922"/>
    <text x="30" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#e3b341">⚡ Treeification &amp; Untreeification Invariants (JDK 8+)</text>
    
    <text x="30" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      • <tspan font-family="monospace" font-weight="700" fill="#f85149">TREEIFY_THRESHOLD = 8</tspan>: When a single bin reaches 8 collision nodes, it triggers tree conversion.
    </text>
    <text x="30" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      • <tspan font-family="monospace" font-weight="700" fill="#58a6ff">MIN_TREEIFY_CAPACITY = 64</tspan>: If table capacity &lt; 64 when chain hits 8, it <tspan font-weight="700" fill="#79c0ff">RESIZES</tspan> instead of treeifying!
    </text>
    <text x="30" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#f0f6fc">
      • <tspan font-family="monospace" font-weight="700" fill="#3fb950">UNTREEIFY_THRESHOLD = 6</tspan>: During resize or removal, if node count falls to ≤ 6, converts back to linked list.
    </text>
    <text x="30" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b949e">
      Hysteresis gap (6 vs 8) prevents costly oscillation (thrashing) between list and tree structures under continuous mutations.
    </text>
  </g>

  <!-- Middle Right: Singly Linked List (Bucket 2) -->
  <g transform="translate(330, 395)">
    <rect width="820" height="195" rx="10" fill="url(#cardGrad)" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#58a6ff">Bucket [2] Representation: Singly-Linked List (Chain &lt; 8)</text>
    <text x="30" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Linear Search: O(N) lookup / insertion • Node size: 32 bytes (64-bit JVM with compressed oops)</text>

    <!-- Node 1 -->
    <rect x="30" y="75" width="180" height="90" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="45" y="105" font-family="monospace" font-size="14" font-weight="700" fill="#f0f6fc">Node 1</text>
    <text x="45" y="128" font-family="monospace" font-size="13" fill="#79c0ff">Key: K1, Val: V1</text>
    <text x="45" y="150" font-family="monospace" font-size="12.5" fill="#8b949e">next: Node 2</text>

    <line x1="210" y1="120" x2="260" y2="120" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Node 2 -->
    <rect x="260" y="75" width="180" height="90" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="275" y="105" font-family="monospace" font-size="14" font-weight="700" fill="#f0f6fc">Node 2</text>
    <text x="275" y="128" font-family="monospace" font-size="13" fill="#79c0ff">Key: K2, Val: V2</text>
    <text x="275" y="150" font-family="monospace" font-size="12.5" fill="#8b949e">next: Node 3</text>

    <line x1="440" y1="120" x2="490" y2="120" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Node 3 -->
    <rect x="490" y="75" width="180" height="90" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="505" y="105" font-family="monospace" font-size="14" font-weight="700" fill="#f0f6fc">Node 3</text>
    <text x="505" y="128" font-family="monospace" font-size="13" fill="#79c0ff">Key: K3, Val: V3</text>
    <text x="505" y="150" font-family="monospace" font-size="12.5" fill="#8b949e">next: null</text>

    <!-- Pointer connection from Bucket 2 -->
    <path d="M -80 65 C -20 65, 0 120, 30 120" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Bottom Right: Red-Black Tree (Bucket 4) -->
  <g transform="translate(330, 610)">
    <rect width="820" height="240" rx="10" fill="url(#cardGrad)" stroke="#da3633" stroke-width="2"/>
    <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">Bucket [4] Representation: Red-Black Tree (TreeNode&lt;K,V&gt;) (Chain ≥ 8 &amp;&amp; Cap ≥ 64)</text>
    <text x="30" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Guaranteed O(log N) lookup under hash collisions • Prevents Hash-DoS Denial of Service attacks</text>

    <!-- Tree Visual -->
    <!-- Root Node (Black) -->
    <circle cx="200" cy="115" r="28" fill="#161b22" stroke="#f0f6fc" stroke-width="2.5"/>
    <text x="200" y="120" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#f0f6fc">Root (B)</text>

    <!-- Left Child (Red) -->
    <circle cx="110" cy="180" r="25" fill="#3c1e1e" stroke="#da3633" stroke-width="2.5"/>
    <text x="110" y="185" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ff7b72">Left (R)</text>

    <!-- Right Child (Black) -->
    <circle cx="290" cy="180" r="25" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
    <text x="290" y="185" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#f0f6fc">Right (B)</text>

    <!-- Tree Edges -->
    <line x1="180" y1="135" x2="130" y2="162" stroke="#8b949e" stroke-width="2"/>
    <line x1="220" y1="135" x2="270" y2="162" stroke="#8b949e" stroke-width="2"/>

    <!-- Pointer connection from Bucket 4 -->
    <path d="M -80 -130 C 20 -130, 80 115, 170 115" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Architectural Insights on Right side of Tree -->
    <rect x="360" y="80" width="430" height="135" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="375" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f85149">Why not Red-Black Tree everywhere from start?</text>
    <text x="375" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">• TreeNode is ~2x memory of Node (parent, left, right, red/black).</text>
    <text x="375" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">• Under Poisson distribution, P(bin length &gt; 8) is &lt; 0.0000001.</text>
    <text x="375" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#7ee787">✓ Balances lean memory footprint with Hash-DoS immunity!</text>
  </g>
</svg>
