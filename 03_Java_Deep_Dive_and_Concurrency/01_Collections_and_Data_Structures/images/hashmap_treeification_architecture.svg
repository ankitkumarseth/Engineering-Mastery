<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">HashMap Internal Bucket Architecture &amp; Treeification</text>
  <text x="480" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">JDK 8+ Transition from Singly-Linked List (O(N)) to Red-Black Tree (O(log N))</text>

  <!-- Bitwise Hash Spreading Box (Top Bar) -->
  <rect x="40" y="80" width="880" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Left Spreading -->
  <text x="60" y="105" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">1. Hash Code Spread:  int h = key.hashCode() ^ (h &gt;&gt;&gt; 16)</text>
  <text x="60" y="124" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Mixes upper 16 bits with lower bits to prevent hash clustering.</text>
  
  <!-- Right Modulo -->
  <text x="510" y="105" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">2. Bucket Index:  index = (n - 1) &amp; hash</text>
  <text x="510" y="124" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Fast bitwise modulo for power-of-two table capacity n.</text>

  <!-- Main Container -->
  <g transform="translate(40, 155)">
    <!-- Bucket Array Card -->
    <rect x="0" y="0" width="180" height="350" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#60a5fa">Node&lt;K,V&gt;[] table</text>
    <text x="90" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Capacity = 16 (Default)</text>

    <!-- Bucket Slots -->
    <rect x="15" y="65" width="150" height="35" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="88" font-family="monospace" font-size="12" fill="#94a3b8">[0] null</text>

    <rect x="15" y="110" width="150" height="35" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="133" font-family="monospace" font-size="12" fill="#94a3b8">[1] null</text>

    <!-- Bucket 2: Normal List -->
    <rect x="15" y="155" width="150" height="40" rx="4" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="30" y="177" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">[2] Head Node</text>
    <text x="30" y="190" font-family="-apple-system, sans-serif" font-size="9.5" fill="#93c5fd">&lt; 8 items (List)</text>

    <rect x="15" y="205" width="150" height="35" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="228" font-family="monospace" font-size="12" fill="#94a3b8">[3] ...</text>

    <!-- Bucket 4: Treeified -->
    <rect x="15" y="250" width="150" height="42" rx="4" fill="#991b1b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="30" y="270" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">[4] TreeNode Root</text>
    <text x="30" y="285" font-family="-apple-system, sans-serif" font-size="9" fill="#fca5a5">&gt;= 8 items &amp;&amp; Cap &gt;= 64</text>

    <rect x="15" y="302" width="150" height="35" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="325" font-family="monospace" font-size="12" fill="#94a3b8">[15] null</text>
  </g>

  <!-- Bucket 2 Flow: Singly Linked List -->
  <g transform="translate(250, 155)">
    <rect x="0" y="155" width="310" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="3,3"/>
    <text x="15" y="175" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">Singly-Linked List (Linear Search)</text>
    <text x="15" y="193" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Time Complexity: O(N) lookup/insert</text>

    <!-- Node 1 -->
    <rect x="10" y="215" width="85" height="40" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="52" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#f8fafc">K1, V1</text>
    <text x="52" y="247" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">next</text>

    <!-- Node 2 -->
    <rect x="115" y="215" width="85" height="40" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="157" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#f8fafc">K2, V2</text>
    <text x="157" y="247" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">next</text>

    <!-- Node 3 -->
    <rect x="220" y="215" width="85" height="40" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="262" y="233" text-anchor="middle" font-family="monospace" font-size="11" fill="#f8fafc">K3, V3</text>
    <text x="262" y="247" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">null</text>

    <!-- Arrows -->
    <path d="M -30 175 L 10 235" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 95 235 L 115 235" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 200 235 L 220 235" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Treeification Threshold Box (Expanded width 335px) -->
  <g transform="translate(585, 155)">
    <rect x="0" y="0" width="335" height="115" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="167" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">⚡ Treeification &amp; Untreeification Rules</text>
    <text x="15" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#f8fafc">• <tspan font-weight="700" fill="#ef4444">TREEIFY_THRESHOLD = 8</tspan>: Bucket items &gt;= 8</text>
    <text x="15" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#f8fafc">• <tspan font-weight="700" fill="#3b82f6">MIN_TREEIFY_CAPACITY = 64</tspan>: If Cap &lt; 64, resizes instead!</text>
    <text x="15" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#f8fafc">• <tspan font-weight="700" fill="#34d399">UNTREEIFY_THRESHOLD = 6</tspan>: Un-treeifies back to list</text>
    <text x="15" y="99" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Hysteresis (gap 6 vs 8) prevents resize thrashing oscillations.</text>
  </g>

  <!-- Bucket 4 Flow: Red-Black Tree (Expanded width 335px) -->
  <g transform="translate(585, 285)">
    <rect x="0" y="0" width="335" height="220" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="167" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f87171">Red-Black Tree (TreeNode&lt;K,V&gt;)</text>
    <text x="167" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Guaranteed O(log N) lookup under collisions</text>

    <!-- Root Node (Black) -->
    <circle cx="167" cy="85" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <text x="167" y="89" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">Root</text>

    <!-- Left Child (Red) -->
    <circle cx="100" cy="145" r="16" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="149" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#fca5a5">Left</text>

    <!-- Right Child (Black) -->
    <circle cx="235" cy="145" r="16" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="235" y="149" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">Right</text>

    <!-- Tree Edges -->
    <line x1="153" y1="97" x2="114" y2="133" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="181" y1="97" x2="221" y2="133" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Pointer connection from Bucket 4 -->
    <path d="M -395 135 C -200 135, -50 85, 149 85" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  </g>
</svg>