<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-cdc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="940" height="460" fill="#ffffff" rx="12" />
  <rect x="15" y="15" width="910" height="430" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10" />

  <text x="40" y="52" class="title">The Transactional Outbox Pattern (CDC + Kafka)</text>
  <text x="40" y="75" class="subtitle">Eliminating dual-write race conditions and guaranteeing at-least-once event delivery</text>

  <!-- Step 1: Order Service -->
  <rect x="35" y="160" width="160" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="50" y="195" class="box-title" fill="#1d4ed8">Order Service</text>
  <text x="50" y="220" class="box-desc">1. Starts Local DB Tx</text>
  <text x="50" y="240" class="box-desc">2. Inserts 'Order' entity</text>
  <text x="50" y="260" class="box-desc">3. Inserts 'Outbox' event</text>
  <text x="50" y="285" class="box-desc" font-weight="bold" fill="#15803d">4. COMMITS TX (ACID)</text>

  <!-- Step 2: RDBMS with Outbox Table -->
  <rect x="250" y="125" width="230" height="230" rx="12" fill="url(#grad-db)" stroke="#22c55e" stroke-width="2" />
  <text x="270" y="155" class="box-title" fill="#15803d">PostgreSQL / Oracle DB</text>

  <rect x="270" y="175" width="190" height="60" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="285" y="200" class="box-title" fill="#14532d">ORDERS Table</text>
  <text x="285" y="220" class="box-desc">id: 101, status: CREATED</text>

  <rect x="270" y="250" width="190" height="65" rx="6" fill="#ffffff" stroke="#86efac" />
  <text x="285" y="275" class="box-title" fill="#14532d">OUTBOX Table</text>
  <text x="285" y="295" class="box-desc">id: 55, event: OrderCreated</text>

  <text x="270" y="340" class="box-desc" fill="#166534"><b>WAL / Redo Log:</b> Records both inserts</text>

  <!-- Step 3: Debezium CDC Connector -->
  <rect x="535" y="175" width="170" height="120" rx="10" fill="url(#grad-cdc)" stroke="#d97706" stroke-width="2" />
  <text x="550" y="205" class="box-title" fill="#b45309">Debezium CDC</text>
  <text x="550" y="225" class="box-title" fill="#b45309">(Kafka Connect)</text>
  <text x="550" y="250" class="box-desc">• Tails DB Transaction Log</text>
  <text x="550" y="270" class="box-desc">• Zero Polling Overhead</text>

  <!-- Step 4: Apache Kafka -->
  <rect x="755" y="145" width="150" height="180" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="770" y="180" class="box-title" fill="#1e293b">Apache Kafka</text>
  <rect x="770" y="200" width="120" height="30" rx="4" fill="#38bdf8" />
  <text x="785" y="220" class="label" fill="#ffffff">order-events</text>
  <text x="770" y="255" class="box-desc">• Replicated commit log</text>
  <text x="770" y="275" class="box-desc">• Partition ordering</text>
  <text x="770" y="295" class="box-desc">• At-least-once delivery</text>

  <!-- Arrows -->
  <path d="M 195 235 L 240 235" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)" />
  <path d="M 480 235 L 525 235" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-amber)" />
  <text x="505" y="225" class="label" fill="#d97706">Tails WAL</text>
  <path d="M 705 235 L 745 235" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <text x="725" y="225" class="label" fill="#2563eb">Publishes</text>
</svg>
