<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <linearGradient id="grad-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="grad-micro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-gw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <rect width="920" height="460" fill="#ffffff" rx="12" />
  <rect x="15" y="15" width="890" height="430" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10" />

  <text x="40" y="52" class="title">The Strangler Fig Migration Pattern</text>
  <text x="40" y="75" class="subtitle">Safely decomposing an enterprise monolith incrementally without a high-risk 'big bang' rewrite</text>

  <!-- Clients -->
  <rect x="40" y="210" width="130" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <text x="55" y="245" class="box-title" fill="#1e293b">Clients</text>
  <text x="55" y="268" class="box-desc">(Web / Mobile)</text>

  <!-- Ingress Router / API Gateway -->
  <rect x="230" y="170" width="170" height="160" rx="10" fill="url(#grad-gw)" stroke="#d97706" stroke-width="2" />
  <text x="250" y="205" class="box-title" fill="#b45309">API Gateway</text>
  <text x="250" y="225" class="box-title" fill="#b45309">(Strangler Facade)</text>
  <text x="250" y="255" class="box-desc">• Path-based routing</text>
  <text x="250" y="275" class="box-desc">• Feature Flag weighted split</text>
  <text x="250" y="295" class="box-desc">• Canary percentage rollout</text>

  <!-- Monolith (Shrinking) -->
  <rect x="490" y="110" width="380" height="140" rx="12" fill="url(#grad-mono)" stroke="#f43f5e" stroke-width="2" />
  <text x="510" y="140" class="box-title" fill="#be123c">🏛️ Legacy Monolith (Shrinking)</text>
  <text x="510" y="165" class="box-desc">/orders (Strangled &amp; Deprecated)</text>
  <text x="510" y="185" class="box-desc">/accounts (Legacy execution)</text>
  <text x="510" y="205" class="box-desc">/reports (Legacy execution)</text>
  <rect x="710" y="130" width="140" height="100" rx="6" fill="#ffffff" stroke="#fda4af" />
  <text x="730" y="170" class="box-title" fill="#e11d48">Monolithic DB</text>
  <text x="730" y="195" class="box-desc">(Shared Tables)</text>

  <!-- New Microservices Fleet -->
  <rect x="490" y="280" width="380" height="140" rx="12" fill="url(#grad-micro)" stroke="#3b82f6" stroke-width="2" />
  <text x="510" y="310" class="box-title" fill="#1d4ed8">✨ New Order Microservice (Target Architecture)</text>
  <text x="510" y="335" class="box-desc">/orders $\to$ Modern Domain, Event-Driven, Auto-scaled</text>
  <rect x="710" y="300" width="140" height="100" rx="6" fill="#ffffff" stroke="#93c5fd" />
  <text x="730" y="340" class="box-title" fill="#2563eb">Dedicated DB</text>
  <text x="730" y="365" class="box-desc">(Database-per-service)</text>

  <!-- Connections -->
  <path d="M 170 250 L 220 250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)" />
  <path d="M 400 220 L 480 180" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="440" y="190" class="label" fill="#e11d48">Legacy Traffic</text>
  <path d="M 400 270 L 480 340" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)" />
  <text x="440" y="330" class="label" fill="#2563eb">Strangled Traffic</text>
</svg>
