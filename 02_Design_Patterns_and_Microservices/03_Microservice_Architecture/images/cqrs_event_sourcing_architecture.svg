<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #334155; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    </style>
    <linearGradient id="grad-cmd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="grad-query" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <linearGradient id="grad-store" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9333ea" />
    </marker>
  </defs>

  <rect width="1020" height="540" fill="#ffffff" rx="12" />
  <rect x="15" y="15" width="990" height="510" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10" />

  <text x="40" y="52" class="title">CQRS &amp; Event Sourcing Architecture</text>
  <text x="40" y="75" class="subtitle">Complete architectural decoupling: Write Path (Commands) vs. Read Path (Projections)</text>

  <!-- Client -->
  <rect x="35" y="200" width="135" height="125" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <text x="102" y="235" text-anchor="middle" class="box-title" fill="#1e293b">Client App</text>
  <text x="50" y="265" class="box-desc">• Sends Commands</text>
  <text x="50" y="285" class="box-desc">• Queries Read Models</text>
  <text x="50" y="305" class="box-desc">• UI State updates</text>

  <!-- Top Path: Command / Write Path -->
  <rect x="210" y="105" width="245" height="150" rx="10" fill="url(#grad-cmd)" stroke="#3b82f6" stroke-width="2" />
  <text x="225" y="135" class="box-title" fill="#1d4ed8">1. Command Handler (Write)</text>
  <text x="225" y="160" class="box-desc">• Validates business invariants</text>
  <text x="225" y="180" class="box-desc">• Rehydrates Aggregate from events</text>
  <text x="225" y="200" class="box-desc">• Applies state mutation</text>
  <text x="225" y="222" class="box-desc" font-weight="600" fill="#1e40af">📢 Emits: OrderPlacedEvent</text>

  <!-- Event Store -->
  <rect x="495" y="105" width="245" height="150" rx="10" fill="url(#grad-store)" stroke="#a855f7" stroke-width="2" />
  <text x="510" y="135" class="box-title" fill="#7e22ce">2. Event Store (Append-Only)</text>
  <text x="510" y="160" class="box-desc">• Immutable append-only log</text>
  <text x="510" y="180" class="box-desc">• Never updated or deleted</text>
  <text x="510" y="200" class="box-desc">• Absolute source of truth</text>
  <text x="510" y="222" class="box-desc" font-weight="600" fill="#6b21a8">• Supports time-travel replay</text>

  <!-- Projector / Event Handler in Middle -->
  <rect x="780" y="185" width="205" height="145" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="795" y="215" class="box-title" fill="#b45309">3. Event Projectors</text>
  <text x="795" y="240" class="box-desc">• Async event consumers</text>
  <text x="795" y="260" class="box-desc">• Denormalizes payload</text>
  <text x="795" y="280" class="box-desc">• Rebuilds read projections</text>
  <text x="795" y="300" class="box-desc" font-weight="600" fill="#92400e">• Handles out-of-order events</text>

  <!-- Bottom Path: Read / Query Path -->
  <rect x="495" y="315" width="245" height="160" rx="10" fill="url(#grad-query)" stroke="#22c55e" stroke-width="2" />
  <text x="510" y="345" class="box-title" fill="#15803d">4. Read Databases (Projections)</text>
  <text x="510" y="372" class="box-desc">🔍 Elasticsearch: Full text search</text>
  <text x="510" y="394" class="box-desc">⚡ Redis: High-speed key-value cache</text>
  <text x="510" y="416" class="box-desc">📊 PostgreSQL: Reporting views</text>
  <text x="510" y="442" class="box-desc" font-weight="600" fill="#14532d">✔ Tailored for specific query patterns</text>

  <rect x="210" y="315" width="245" height="160" rx="10" fill="url(#grad-query)" stroke="#22c55e" stroke-width="2" />
  <text x="225" y="345" class="box-title" fill="#15803d">5. Query Service (Read Path)</text>
  <text x="225" y="372" class="box-desc">• Single-digit millisecond reads</text>
  <text x="225" y="394" class="box-desc">• Reads pre-materialized records</text>
  <text x="225" y="416" class="box-desc">• Zero cross-table lock contention</text>
  <text x="225" y="442" class="box-desc" font-weight="600" fill="#14532d">• Horizontally scalable query layer</text>

  <!-- Arrows -->
  <path d="M 170 235 L 205 185" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="180" y="195" class="label" fill="#2563eb">Command</text>

  <path d="M 455 180 L 485 180" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arr-purple)" />
  <text x="470" y="170" class="label" fill="#9333ea">Append</text>

  <path d="M 740 180 Q 820 140 820 175" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-purple)" />
  <text x="795" y="155" class="label" fill="#d97706">Domain Event</text>

  <path d="M 820 330 Q 820 395 750 395" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="800" y="380" class="label" fill="#16a34a">Updates</text>

  <path d="M 495 395 L 465 395" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />

  <path d="M 210 395 L 170 295" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="180" y="360" class="label" fill="#16a34a">Query Res</text>
</svg>