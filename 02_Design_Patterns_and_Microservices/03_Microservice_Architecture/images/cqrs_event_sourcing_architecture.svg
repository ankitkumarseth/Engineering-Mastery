<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <linearGradient id="grad-cmd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="grad-query" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <linearGradient id="grad-store" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#9333ea" />
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff" rx="12" />
  <rect x="15" y="15" width="930" height="490" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10" />

  <text x="40" y="52" class="title">CQRS &amp; Event Sourcing Architecture</text>
  <text x="40" y="75" class="subtitle">Complete separation of write intent (Commands) from read optimization (Queries)</text>

  <!-- Client -->
  <rect x="35" y="210" width="130" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <text x="50" y="245" class="box-title" fill="#1e293b">Client App</text>
  <text x="50" y="270" class="box-desc">• Sends Commands</text>
  <text x="50" y="290" class="box-desc">• Sends Queries</text>

  <!-- Top Path: Command / Write Path -->
  <rect x="230" y="110" width="230" height="135" rx="10" fill="url(#grad-cmd)" stroke="#3b82f6" stroke-width="2" />
  <text x="250" y="140" class="box-title" fill="#1d4ed8">1. Command Handler (Write)</text>
  <text x="250" y="165" class="box-desc">• Validates business invariants</text>
  <text x="250" y="185" class="box-desc">• Rehydrates Aggregate from events</text>
  <text x="250" y="205" class="box-desc">• Emits: OrderPlacedEvent</text>

  <!-- Event Store -->
  <rect x="520" y="110" width="200" height="135" rx="10" fill="url(#grad-store)" stroke="#a855f7" stroke-width="2" />
  <text x="540" y="140" class="box-title" fill="#7e22ce">2. Event Store (Append-Only)</text>
  <text x="540" y="165" class="box-desc">• Immutable stream of facts</text>
  <text x="540" y="185" class="box-desc">• Never mutated or deleted</text>
  <text x="540" y="205" class="box-desc">• Source of absolute truth</text>

  <!-- Projector / Event Handler in Middle -->
  <rect x="760" y="190" width="170" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="775" y="220" class="box-title" fill="#b45309">3. Event Projectors</text>
  <text x="775" y="245" class="box-desc">• Subscribes to events</text>
  <text x="775" y="265" class="box-desc">• Denormalizes data</text>
  <text x="775" y="285" class="box-desc">• Updates Read Models</text>

  <!-- Bottom Path: Read / Query Path -->
  <rect x="520" y="315" width="200" height="145" rx="10" fill="url(#grad-query)" stroke="#22c55e" stroke-width="2" />
  <text x="540" y="345" class="box-title" fill="#15803d">4. Read Databases (Projections)</text>
  <text x="540" y="370" class="box-desc">🔍 Elasticsearch (Fast search)</text>
  <text x="540" y="390" class="box-desc">⚡ Redis (Key-value cache)</text>
  <text x="540" y="410" class="box-desc">📊 PostgreSQL (Denormalized reporting)</text>

  <rect x="230" y="315" width="230" height="145" rx="10" fill="url(#grad-query)" stroke="#22c55e" stroke-width="2" />
  <text x="250" y="345" class="box-title" fill="#15803d">5. Query Service (Read)</text>
  <text x="250" y="375" class="box-desc">• Single-digit millisecond latency</text>
  <text x="250" y="395" class="box-desc">• Pre-joined materialized views</text>
  <text x="250" y="415" class="box-desc">• Zero database locking</text>

  <!-- Arrows -->
  <path d="M 165 240 L 220 180" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="180" y="200" class="label" fill="#2563eb">Command</text>

  <path d="M 460 175 L 510 175" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arr-purple)" />
  <text x="485" y="165" class="label" fill="#9333ea">Append</text>

  <path d="M 720 175 Q 840 140 840 180" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-purple)" />
  <text x="800" y="160" class="label" fill="#d97706">Async Event</text>

  <path d="M 840 320 Q 840 390 730 390" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="810" y="380" class="label" fill="#16a34a">Updates</text>

  <path d="M 520 390 L 470 390" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />

  <path d="M 230 390 L 165 290" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="180" y="355" class="label" fill="#16a34a">Query Res</text>
</svg>
