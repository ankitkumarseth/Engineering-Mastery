<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #475569; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    </style>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-billing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-legacy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="grad-acl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-acl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="540" fill="#ffffff" rx="12" />
  <rect x="15" y="15" width="950" height="510" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10" />

  <!-- Title -->
  <text x="40" y="52" class="title">Strategic Domain-Driven Design: Bounded Contexts &amp; Context Map</text>
  <text x="40" y="75" class="subtitle">How ubiquitous language shifts across microservice boundaries and prevents model corruption</text>

  <!-- Context 1: Order Fulfillment (Core Domain) -->
  <rect x="35" y="110" width="375" height="395" rx="12" fill="url(#grad-core)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" />
  <text x="55" y="140" class="box-title" fill="#1d4ed8">📦 Order Management Bounded Context</text>
  <text x="55" y="160" class="box-desc">Language: "Customer", "Order", "LineItem", "Address"</text>

  <!-- Inside Context 1 Entities -->
  <rect x="55" y="180" width="335" height="120" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="75" y="208" class="box-title" fill="#1e3a8a">Order (Aggregate Root)</text>
  <text x="75" y="230" class="box-desc">• OrderStatus: CREATED, PAID, SHIPPED</text>
  <text x="75" y="250" class="box-desc">• LineItem (Entity): quantity, unitPrice</text>
  <text x="75" y="270" class="box-desc">• CustomerId: Value Object reference only</text>

  <rect x="55" y="315" width="335" height="110" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="75" y="343" class="box-title" fill="#1e3a8a">Published Events (Domain Events)</text>
  <text x="75" y="365" class="box-desc">📢 OrderPlacedEvent (orderId, total, items)</text>
  <text x="75" y="385" class="box-desc">📢 OrderCancelledEvent (orderId, reason)</text>
  <text x="75" y="405" class="box-desc">• Emitted asynchronously to Kafka topic</text>

  <!-- Context 2: Billing & Invoicing (Supporting Domain) -->
  <rect x="545" y="110" width="400" height="190" rx="12" fill="url(#grad-billing)" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" />
  <text x="565" y="140" class="box-title" fill="#047857">💳 Billing &amp; Invoicing Bounded Context</text>
  <text x="565" y="160" class="box-desc">Language: "Payer", "Invoice", "PaymentMethod", "Ledger"</text>

  <rect x="565" y="180" width="360" height="95" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
  <text x="585" y="208" class="box-title" fill="#064e3b">Invoice (Aggregate Root)</text>
  <text x="585" y="230" class="box-desc">• Notice: "Customer" is called "Payer" here!</text>
  <text x="585" y="250" class="box-desc">• "Order" is reduced to an external "ReferenceId"</text>

  <!-- Context 3: Legacy Mainframe -->
  <rect x="710" y="335" width="235" height="165" rx="12" fill="url(#grad-legacy)" stroke="#f43f5e" stroke-width="2" />
  <text x="725" y="365" class="box-title" fill="#be123c">🏛️ Legacy ERP / Switch</text>
  <text x="725" y="390" class="box-desc">• Monolithic DB schema</text>
  <text x="725" y="412" class="box-desc">• COBOL / Fixed-width bytes</text>
  <text x="725" y="434" class="box-desc">• Rigid unmaintainable model</text>
  <text x="725" y="456" class="box-desc">• Upstream dependency</text>

  <!-- Anti-Corruption Layer (ACL) in middle -->
  <rect x="460" y="355" width="210" height="125" rx="8" fill="url(#grad-acl)" stroke="#d97706" stroke-width="2" />
  <text x="565" y="385" class="box-title" text-anchor="middle" fill="#b45309">🛡️ Anti-Corruption Layer</text>
  <text x="565" y="405" class="box-title" text-anchor="middle" fill="#b45309">(ACL Adapter)</text>
  <text x="565" y="430" class="box-desc" text-anchor="middle">Translates legacy structures</text>
  <text x="565" y="448" class="box-desc" text-anchor="middle">⇄ Modern Domain Entities</text>
  <text x="565" y="466" class="box-desc" text-anchor="middle" font-weight="600" fill="#92400e">Protects Domain Integrity</text>

  <!-- Relationship Arrows -->
  <!-- Context 1 -> Context 2 (Customer-Supplier / Async Events) -->
  <path d="M 410 205 L 535 205" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="475" y="185" class="label" fill="#0284c7">Domain Events</text>
  <text x="475" y="200" class="label" fill="#64748b">(Kafka Topic)</text>

  <!-- Context 1 -> ACL -> Legacy -->
  <path d="M 410 415 L 450 415" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-acl)" />
  <path d="M 670 415 L 700 415" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-acl)" />
</svg>