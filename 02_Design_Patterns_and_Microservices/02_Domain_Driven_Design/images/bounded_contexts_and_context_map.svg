<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-billing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-legacy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="grad-acl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-acl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" fill="#ffffff" rx="12" />
  <rect x="15" y="15" width="920" height="490" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10" />

  <!-- Title -->
  <text x="40" y="55" class="title">Strategic Domain-Driven Design: Bounded Contexts &amp; Context Map</text>
  <text x="40" y="78" class="subtitle">How ubiquitous language shifts across microservice boundaries and prevents model corruption</text>

  <!-- Context 1: Order Fulfillment (Core Domain) -->
  <rect x="50" y="120" width="360" height="340" rx="12" fill="url(#grad-core)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" />
  <text x="70" y="155" class="box-title" fill="#1d4ed8">📦 Order Management Bounded Context</text>
  <text x="70" y="175" class="box-desc">Language: "Customer", "Order", "LineItem", "ShippingAddress"</text>

  <!-- Inside Context 1 Entities -->
  <rect x="70" y="200" width="320" height="110" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="90" y="228" class="box-title" fill="#1e3a8a">Order (Aggregate Root)</text>
  <text x="90" y="250" class="box-desc">• OrderStatus: CREATED, PAID, SHIPPED</text>
  <text x="90" y="270" class="box-desc">• LineItem (Entity) - quantity, unitPrice</text>
  <text x="90" y="290" class="box-desc">• CustomerId (Value Object reference only)</text>

  <rect x="70" y="330" width="320" height="105" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="90" y="358" class="box-title" fill="#1e3a8a">Published Events (Domain Events)</text>
  <text x="90" y="380" class="box-desc">📢 OrderPlacedEvent (orderId, total, items)</text>
  <text x="90" y="400" class="box-desc">📢 OrderCancelledEvent (orderId, reason)</text>

  <!-- Context 2: Billing & Invoicing (Supporting Domain) -->
  <rect x="530" y="120" width="370" height="180" rx="12" fill="url(#grad-billing)" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" />
  <text x="550" y="155" class="box-title" fill="#047857">💳 Billing &amp; Invoicing Bounded Context</text>
  <text x="550" y="175" class="box-desc">Language: "Payer", "Invoice", "PaymentMethod", "LedgerEntry"</text>

  <rect x="550" y="195" width="330" height="85" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
  <text x="570" y="222" class="box-title" fill="#064e3b">Invoice (Aggregate Root)</text>
  <text x="570" y="244" class="box-desc">• Notice: "Customer" is called "Payer" here!</text>
  <text x="570" y="264" class="box-desc">• "Order" is reduced to an external "ReferenceId"</text>

  <!-- Context 3: Legacy Mainframe (Anti-Corruption Layer) -->
  <rect x="670" y="340" width="230" height="120" rx="12" fill="url(#grad-legacy)" stroke="#f43f5e" stroke-width="2" />
  <text x="690" y="375" class="box-title" fill="#be123c">🏛️ Legacy ERP / Switch</text>
  <text x="690" y="395" class="box-desc">• Monolithic DB schema</text>
  <text x="690" y="415" class="box-desc">• COBOL / Fixed-width bytes</text>
  <text x="690" y="435" class="box-desc">• Rigid unmaintainable model</text>

  <!-- Anti-Corruption Layer (ACL) in middle -->
  <rect x="470" y="360" width="160" height="80" rx="8" fill="url(#grad-acl)" stroke="#d97706" stroke-width="2" />
  <text x="490" y="390" class="box-title" fill="#b45309">🛡️ Anti-Corruption</text>
  <text x="510" y="410" class="box-title" fill="#b45309">Layer (ACL)</text>
  <text x="485" y="428" class="box-desc">Translates legacy $\leftrightarrow$ modern</text>

  <!-- Relationship Arrows -->
  <!-- Context 1 -> Context 2 (Customer-Supplier / Async Events) -->
  <path d="M 410 210 L 520 210" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="465" y="195" class="label" fill="#0284c7">Domain Events<br/>(Kafka)</text>

  <!-- Context 1 -> ACL -> Legacy -->
  <path d="M 390 395 L 460 395" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-acl)" />
  <path d="M 630 395 L 660 395" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-acl)" />
</svg>
