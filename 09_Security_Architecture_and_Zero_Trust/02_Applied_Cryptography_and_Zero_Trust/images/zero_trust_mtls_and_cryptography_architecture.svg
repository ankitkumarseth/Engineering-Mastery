<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSec2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradSec2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cryptoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="mtlsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGradSec2)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Applied Cryptography, Zero Trust (NIST SP 800-207) &amp; mTLS Architecture</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">AES-256-GCM Authenticated Encryption, Memory-Hard Hashing (Argon2id), TLS 1.3 Forward Secrecy &amp; Dynamic Vault Secrets</text>
  </g>

  <!-- SECTION 1: Applied Cryptography & Password Hashing (Left Column) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradSec2)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#cryptoGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ff7b72">1. Applied Cryptography &amp; Key Derivation</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">AES-256-GCM AEAD, Envelope Encryption &amp; Argon2id Hashing</text>

    <g transform="translate(20, 75)">
      <!-- Sub-card 1: AES-GCM -->
      <g transform="translate(0, 0)">
        <rect width="505" height="165" rx="6" fill="#0d1117" stroke="#da3633" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#ff7b72">AES-256-GCM: Authenticated Encryption (AEAD)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Plaintext + 96-bit unique IV -> Ciphertext + 128-bit Auth Tag.</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• AAD (Associated Data): Authenticates headers without encrypting.</text>
        <text x="16" y="96" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">⚠️ THE FATAL GCM TRAP: NEVER reuse an IV with the same key!</text>
        <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Reusing an IV leaks the GHASH auth subkey, allowing ciphertext forgery.</text>
        <text x="16" y="144" font-family="monospace" font-size="12" fill="#7ee787">✓ Always use CSPRNG SecureRandom for IV generation</text>
      </g>

      <!-- Sub-card 2: Password Hashing -->
      <g transform="translate(0, 185)">
        <rect width="505" height="200" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Password Hashing: Argon2id vs Raw SHA Traps</text>
        <text x="16" y="48" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">The Raw SHA-256 Trap:</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Modern GPUs test 150 BILLION SHA-256 hashes/sec. Instant crack!</text>

        <!-- Memory-Hard Box -->
        <g transform="translate(14, 84)">
          <rect width="477" height="100" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Memory-Hard Standard: Argon2id (RFC 9106)</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Configures Memory (64MB), Iterations (t=3), Threads (p=4).</text>
          <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Defeats GPU &amp; ASIC parallel brute-force attacks completely.</text>
          <text x="12" y="90" font-family="monospace" font-size="12" fill="#7ee787">✓ BCrypt (cost >= 12) or Argon2id is mandatory in banking</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 2: Transport Security & mTLS (Right Column) -->
  <g transform="translate(615, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradSec2)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#mtlsGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">2. Transport Security &amp; Mutual TLS (mTLS)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">TLS 1.3 Handshake, Forward Secrecy &amp; Workload Identity</text>

    <g transform="translate(20, 75)">
      <!-- Sub-card 1: TLS 1.3 -->
      <g transform="translate(0, 0)">
        <rect width="505" height="175" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">TLS 1.3 Improvements (RFC 8446)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• 1-RTT Handshake: Key share sent in ClientHello (halves latency!).</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Deprecated weak ciphers: RSA key exchange, CBC mode, RC4, MD5.</text>
        <text x="16" y="96" font-family="monospace" font-size="13" fill="#3fb950">✓ Perfect Forward Secrecy (PFS): Ephemeral Diffie-Hellman (ECDHE)</text>
        <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Compromising server private key in future CANNOT decrypt past traffic!</text>
        <text x="16" y="144" font-family="monospace" font-size="12" fill="#7ee787">0-RTT Resumption enables instant reconnect for cached clients</text>
      </g>

      <!-- Sub-card 2: mTLS & SPIFFE -->
      <g transform="translate(0, 195)">
        <rect width="505" height="190" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Mutual TLS (mTLS) &amp; SPIFFE / SPIRE Workload ID</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Both Client AND Server present X.509 digital certificates.</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Verifies bidirectional cryptographic identity at OSI Layer 4.</text>

        <!-- SPIFFE Sub-box -->
        <g transform="translate(14, 82)">
          <rect width="477" height="92" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">SPIFFE Workload ID Architecture:</text>
          <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">spiffe://prod.corp/ns/banking/sa/payment-service</text>
          <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Short-lived X.509 SVIDs rotated automatically (1 to 24 hrs).</text>
          <text x="12" y="86" font-family="monospace" font-size="11" fill="#7ee787">✓ Eliminates static API keys between microservices entirely</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 3: Zero Trust & Dynamic Secrets Lifecycle (Bottom Row) -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradSec2)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#vaultGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">3. NIST SP 800-207 Zero Trust &amp; Dynamic Secrets Lifecycle (HashiCorp Vault)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">"Never Trust, Always Verify", Microsegmentation, Dynamic DB Credentials &amp; Instant Blast Radius Containment</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: NIST Zero Trust -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">NIST SP 800-207 Tenets</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Assume hostile internal network</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Perimeter VPN / IP firewalls obsolete</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#3fb950">3 Core Architectural Pillars:</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">1. Verify Explicitly | 2. Least Privilege</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">3. Assume Breach (micro-segmentation)</text>
      </g>

      <!-- Panel 2: Dynamic Secrets Engine -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Dynamic Secrets Engine (Vault)</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#7ee787">On-Demand Ephemeral Credentials</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Service requests DB login via K8s SA token</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Vault executes CREATE USER with 1-hr lease</text>
        <text x="16" y="118" font-family="monospace" font-size="13" fill="#e3b341">Heartbeat Renewal: drops on pod death</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Zero static database passwords in config files</text>
      </g>

      <!-- Panel 3: Blast Radius Containment -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Blast Radius &amp; Revocation</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#d2a8ff">Immediate Emergency Revocation:</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Compromised pods yield only 1 lease</text>
        <text x="16" y="92" font-family="monospace" font-size="12" fill="#f85149">vault lease revoke -prefix database/</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Revokes 10,000 DB logins in milliseconds.</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Immutable audit trail streamed to SIEM</text>
      </g>
    </g>
  </g>
</svg>