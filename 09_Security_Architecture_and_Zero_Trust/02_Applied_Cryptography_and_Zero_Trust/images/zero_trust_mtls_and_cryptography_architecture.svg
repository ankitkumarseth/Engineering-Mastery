<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSec2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradSec2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cryptoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="mtlsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="740" fill="url(#bgGradSec2)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Applied Cryptography, Zero Trust (NIST SP 800-207) &amp; mTLS Architecture</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">AES-256-GCM Authenticated Encryption, Memory-Hard Hashing (Argon2id), TLS 1.3 Forward Secrecy, and Dynamic Vault Secrets</text>

  <!-- Section 1: Applied Cryptography & Password Hashing (Left Column) -->
  <g transform="translate(40, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradSec2)" stroke="#da3633" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#cryptoGrad)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">1. Applied Cryptography &amp; Key Derivation</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">AES-256-GCM AEAD, Envelope Encryption &amp; Argon2id Memory-Hard Hashing</text>

    <g transform="translate(20, 72)">
      <rect width="460" height="275" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#ff7b72">Authenticated Encryption &amp; Hashing Traps</text>

      <g transform="translate(15, 34)">
        <!-- AES-GCM Box -->
        <g transform="translate(0, 0)">
          <rect width="430" height="88" rx="4" fill="#0d1117" stroke="#da3633"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#ff7b72">AES-256-GCM (Authenticated Encryption with Associated Data)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Plaintext + 96-bit unique IV -> Ciphertext + 128-bit Authentication Tag</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• AAD (Additional Authenticated Data): Authenticates headers without encrypting</text>
          <text x="10" y="60" font-family="monospace" font-size="8.5" fill="#f85149">⚠️ THE FATAL GCM TRAP: NEVER reuse an IV with the same key!</text>
          <text x="10" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Reusing an IV destroys authenticity and leaks the authentication subkey.</text>
        </g>

        <!-- Password Hashing -->
        <g transform="translate(0, 98)">
          <rect width="430" height="124" rx="4" fill="#0d1117" stroke="#388bfd"/>
          <text x="10" y="16" font-family="monospace" font-size="9.5" font-weight="700" fill="#58a6ff">Password Hashing: Argon2id / BCrypt vs Raw SHA</text>
          <text x="10" y="30" font-family="monospace" font-size="8.5" fill="#f85149">The Raw SHA-256 / MD5 Trap:</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Modern GPUs compute 100 BILLION SHA-256 hashes per second. Instant crack!</text>

          <g transform="translate(8, 52)">
            <rect width="414" height="62" rx="3" fill="#161b22" stroke="#238636"/>
            <text x="8" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#3fb950">Memory-Hard Defense: Argon2id (IETF RFC 9106)</text>
            <text x="8" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Configures Memory Cost (e.g. 64MB RAM), Time (Iterations), Parallelism (Threads)</text>
            <text x="8" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Defeats GPU &amp; ASIC parallel brute-force attacks completely!</text>
            <text x="8" y="54" font-family="monospace" font-size="7.5" fill="#7ee787">BCrypt cost factor >= 12 or Argon2id is enterprise standard</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 2: Transport Security & mTLS (Right Column) -->
  <g transform="translate(560, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradSec2)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#mtlsGrad)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#58a6ff">2. Transport Security &amp; Mutual TLS (mTLS)</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">TLS 1.3 Handshake, Forward Secrecy &amp; Service-to-Service Identity</text>

    <g transform="translate(20, 72)">
      <rect width="460" height="275" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#58a6ff">TLS 1.3 &amp; SPIFFE / SPIRE mTLS Architecture</text>

      <g transform="translate(15, 34)">
        <!-- TLS 1.3 Mechanics -->
        <g transform="translate(0, 0)">
          <rect width="430" height="88" rx="4" fill="#0d1117" stroke="#1f6feb"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#79c0ff">TLS 1.3 Improvements (RFC 8446)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• 1-RTT Handshake: Client sends key share in ClientHello (halves latency!)</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Deprecated insecure ciphers: RSA key exchange, CBC mode, RC4, MD5, SHA-1</text>
          <text x="10" y="60" font-family="monospace" font-size="8.5" fill="#3fb950">✓ Perfect Forward Secrecy (PFS): Ephemeral Diffie-Hellman (ECDHE)</text>
          <text x="10" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Compromising server private key in future CANNOT decrypt past traffic!</text>
        </g>

        <!-- mTLS & SPIFFE -->
        <g transform="translate(0, 98)">
          <rect width="430" height="124" rx="4" fill="#0d1117" stroke="#238636"/>
          <text x="10" y="16" font-family="monospace" font-size="9.5" font-weight="700" fill="#3fb950">Mutual TLS (mTLS) with Internal PKI</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Both Client AND Server present X.509 certificates</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Provides cryptographic mutual authentication + wire-level encryption</text>

          <g transform="translate(8, 52)">
            <rect width="414" height="62" rx="3" fill="#161b22" stroke="#30363d"/>
            <text x="8" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#7ee787">SPIFFE / SPIRE Workload Identity:</text>
            <text x="8" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• SPIFFE ID: spiffe://prod.corp/ns/banking/sa/payment-service</text>
            <text x="8" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Short-lived X.509 SVID certificates auto-rotated every 1 to 24 hours</text>
            <text x="8" y="54" font-family="monospace" font-size="7.5" fill="#7ee787">Eliminates static shared API keys between microservices entirely.</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 3: Zero Trust & Dynamic Secrets Lifecycle (Bottom Banner) -->
  <g transform="translate(40, 495)">
    <rect width="1020" height="215" rx="8" fill="url(#cardGradSec2)" stroke="#238636" stroke-width="2"/>
    <rect width="1020" height="6" rx="3" fill="url(#vaultGrad)"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">3. NIST SP 800-207 Zero Trust &amp; Dynamic Secrets Lifecycle (HashiCorp Vault)</text>
    <text x="25" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">"Never Trust, Always Verify", Microsegmentation, Dynamic Database Credentials &amp; Lease Revocation</text>

    <g transform="translate(25, 68)">
      <!-- Panel 1: NIST Zero Trust -->
      <g transform="translate(0, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#58a6ff">NIST SP 800-207 Core Tenets</text>
        <text x="15" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Assume the network is hostile (Hostile Interior)</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Perimeter defense (VPN / IP firewalls) is obsolete</text>
        <text x="15" y="68" font-family="monospace" font-size="8.5" fill="#3fb950">Core Tenets:</text>
        <text x="15" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">1. Every access request is authenticated &amp; authorized</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">2. Dynamic policy evaluation based on device + user context</text>
        <text x="15" y="112" font-family="monospace" font-size="7.5" fill="#7ee787">3. Continuous posture check &amp; microsegmentation</text>
      </g>

      <!-- Panel 2: Dynamic Secrets Engine -->
      <g transform="translate(345, 0)">
        <rect width="320" height="125" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#3fb950">Dynamic Secrets Engine (Vault)</text>
        <text x="15" y="38" font-family="monospace" font-size="8.5" fill="#7ee787">On-Demand Ephemeral Credentials</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Microservice authenticates to Vault via Kubernetes SA token</text>
        <text x="15" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Vault generates unique PostgreSQL user: v-app-db-12345</text>
        <text x="15" y="80" font-family="monospace" font-size="8.5" fill="#e3b341">Lease Duration: 1 Hour (Requires periodic heartbeat)</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• If app crashes or lease expires, Vault DROPS USER in DB!</text>
        <text x="15" y="110" font-family="monospace" font-size="7.5" fill="#7ee787">Zero static database passwords exist anywhere on earth!</text>
      </g>

      <!-- Panel 3: Revocation & Auditing -->
      <g transform="translate(685, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#8957e5"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#a371f7">Blast Radius &amp; Automated Revocation</text>
        <text x="15" y="38" font-family="monospace" font-size="8.5" fill="#d2a8ff">Immediate Blast Radius Containment:</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• If a container is compromised, the attacker only has</text>
        <text x="15" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">  ephemeral credentials valid for that single container.</text>
        <text x="15" y="82" font-family="monospace" font-size="8.5" fill="#f85149">vault lease revoke -prefix database/creds/</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Drops all compromised database users in milliseconds.</text>
        <text x="15" y="112" font-family="monospace" font-size="7.5" fill="#7ee787">✓ Immutable audit logs streamed to SIEM (Splunk/Elastic)</text>
      </g>
    </g>
  </g>
</svg>