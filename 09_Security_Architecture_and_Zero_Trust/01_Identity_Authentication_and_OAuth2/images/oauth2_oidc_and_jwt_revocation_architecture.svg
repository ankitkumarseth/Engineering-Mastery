<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSec1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradSec1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="oauthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="jwtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="authzGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowBlueS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowRedS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="740" fill="url(#bgGradSec1)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Enterprise Identity, OAuth2 / OIDC &amp; The Stateless JWT Dilemma</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">CORE.11: Auth Code with PKCE, M2M Client Credentials, RS256 JWKS Rotation, Redis Revocation &amp; ABAC vs RBAC</text>

  <!-- Section 1: OAuth2 Flows: User PKCE vs M2M (Left Column) -->
  <g transform="translate(40, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradSec1)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#oauthGrad)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#58a6ff">1. OAuth2 / OIDC Grant Flows: User vs M2M</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Proof Key for Code Exchange (PKCE) &amp; Service-to-Service Propagation</text>

    <g transform="translate(20, 72)">
      <rect width="460" height="275" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#79c0ff">Authorization Code + PKCE vs Client Credentials</text>

      <g transform="translate(15, 34)">
        <!-- Flow A: PKCE -->
        <g transform="translate(0, 0)">
          <rect width="430" height="92" rx="4" fill="#0d1117" stroke="#1f6feb"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#79c0ff">USER AUTH: Auth Code + PKCE (RFC 7636)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">1. SPA/Mobile generates code_verifier + SHA256(code_challenge).</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">2. User logs into IdP (Okta/Keycloak) -> Returns auth code via redirect.</text>
          <text x="10" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">3. Client trades code + plain code_verifier directly via POST.</text>
          <text x="10" y="74" font-family="monospace" font-size="8.5" fill="#7ee787">✓ Zero Client Secret in browser; immune to auth code interception!</text>
          <text x="10" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#8b949e">Returns ID Token (Identity profile) + Access Token (API authorization).</text>
        </g>

        <!-- Flow B: M2M -->
        <g transform="translate(0, 102)">
          <rect width="430" height="120" rx="4" fill="#0d1117" stroke="#388bfd"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#58a6ff">M2M AUTH: Client Credentials (RFC 6749)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">1. Service A sends client_id + client_secret directly to IdP /token.</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">2. Receives short-lived Access Token (scopes: "payments:write").</text>
          <text x="10" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">3. Calls Service B: Authorization: Bearer [token].</text>
          <text x="10" y="74" font-family="monospace" font-size="8.5" fill="#e3b341">⚠️ Context Loss Trap: Downstream service loses original User ID!</text>
          <text x="10" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">Solution: RFC 8693 Token Exchange (propagate original user subject + actor).</text>
          <text x="10" y="104" font-family="monospace" font-size="7.5" fill="#7ee787">Dynamic Secret Rotation: Automated via Vault / Secrets Manager</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 2: JWT Internals & The Revocation Dilemma (Right Column) -->
  <g transform="translate(560, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradSec1)" stroke="#da3633" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#jwtGrad)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">2. JWT Internals &amp; The Revocation Dilemma</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Asymmetric RS256 vs HS256 &amp; Stateless Token Revocation Architecture</text>

    <g transform="translate(20, 72)">
      <rect width="460" height="275" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#f85149">JWT Anatomy &amp; Immediate Revocation Defenses</text>

      <g transform="translate(15, 34)">
        <!-- JWT Anatomy & Signing -->
        <g transform="translate(0, 0)">
          <rect width="430" height="88" rx="4" fill="#0d1117" stroke="#da3633"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#ff7b72">JWT Signing: RS256 (Asymmetric) vs HS256 (Symmetric)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• HS256: Shared secret. If Service B verifies, it can FORGE tokens!</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• RS256: IdP signs with Private Key. Microservices verify via Public Key.</text>
          <text x="10" y="60" font-family="monospace" font-size="8.5" fill="#7ee787">✓ JWKS Endpoint: /.well-known/jwks.json (Dynamic Key Rotation with kid)</text>
          <text x="10" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Zero shared secret leaks across 100+ microservices.</text>
        </g>

        <!-- The Stateless Revocation Problem -->
        <g transform="translate(0, 98)">
          <rect width="430" height="124" rx="4" fill="#0d1117" stroke="#388bfd"/>
          <text x="10" y="16" font-family="monospace" font-size="9.5" font-weight="700" fill="#58a6ff">The Stateless Token Revocation Dilemma</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">Problem: A signed JWT is valid until "exp". If user is fired or token is</text>
          <text x="10" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">stolen, you cannot "un-sign" it without hitting a centralized store!</text>

          <g transform="translate(8, 50)">
            <rect width="414" height="66" rx="3" fill="#161b22" stroke="#30363d"/>
            <text x="8" y="14" font-family="monospace" font-size="8" font-weight="700" fill="#3fb950">Dual-Layer Architectural Solution:</text>
            <text x="8" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">1. Ultra-Short Access Token TTL: 5 to 15 minutes max.</text>
            <text x="8" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">2. Refresh Token Rotation (RTR): Stateful refresh tokens stored in DB/Redis.</text>
            <text x="8" y="54" font-family="monospace" font-size="7.5" fill="#7ee787">Emergency Kill-Switch: Distributed Redis Denylist checking jti with TTL = exp</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 3: Enterprise Authorization: RBAC vs ABAC (Bottom Banner) -->
  <g transform="translate(40, 495)">
    <rect width="1020" height="215" rx="8" fill="url(#cardGradSec1)" stroke="#238636" stroke-width="2"/>
    <rect width="1020" height="6" rx="3" fill="url(#authzGrad)"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">3. Enterprise Authorization: RBAC vs. Fine-Grained ABAC &amp; Policy Engines</text>
    <text x="25" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Role Explosion Mitigation, Dynamic Context Evaluation, and Open Policy Agent (OPA / Rego)</text>

    <g transform="translate(25, 68)">
      <!-- Panel 1: RBAC -->
      <g transform="translate(0, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#58a6ff">RBAC (Role-Based Access Control)</text>
        <text x="15" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Subject -> Role -> Permissions</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Coarse-grained: "Admin", "Manager", "Viewer"</text>
        <text x="15" y="68" font-family="monospace" font-size="8.5" fill="#f85149">The "Role Explosion" Antipattern:</text>
        <text x="15" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Manager_NorthAmerica_Tier2_Read_Only...</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">Roles multiply exponentially as business logic adds dimensions.</text>
        <text x="15" y="112" font-family="monospace" font-size="7.5" fill="#e3b341">Best for high-level UI permissions; fails for data ownership.</text>
      </g>

      <!-- Panel 2: ABAC -->
      <g transform="translate(345, 0)">
        <rect width="320" height="125" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#3fb950">ABAC (Attribute-Based Access Control)</text>
        <text x="15" y="38" font-family="monospace" font-size="8.5" fill="#7ee787">Evaluates 4 Dynamic Context Dimensions:</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">1. Subject: { department: "Finance", clearance: "L3" }</text>
        <text x="15" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">2. Resource: { ownerTenantId: "T-100", classification: "CONFIDENTIAL" }</text>
        <text x="15" y="76" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">3. Action: "READ" / "APPROVE_TRANSACTION"</text>
        <text x="15" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">4. Environment: { time: 09:00-17:00, ipInRange: "10.0.0.0/8" }</text>
        <text x="15" y="104" font-family="monospace" font-size="8" fill="#3fb950">✓ Natively prevents BOLA / IDOR multi-tenant breaches!</text>
      </g>

      <!-- Panel 3: Policy Engine -->
      <g transform="translate(685, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#8957e5"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#a371f7">Decoupled Policy Engine (OPA)</text>
        <text x="15" y="38" font-family="monospace" font-size="8.5" fill="#d2a8ff">Open Policy Agent (OPA) / AWS Verified Permissions</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Policies codified as code (Rego / Cedar)</text>
        <text x="15" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• PEP (Policy Enforcement Point) at API Gateway / Envoy</text>
        <text x="15" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• PDP (Policy Decision Point) evaluates in &lt; 1ms</text>
        <text x="15" y="96" font-family="monospace" font-size="8" fill="#3fb950">✓ Zero auth logic hardcoded in microservice code!</text>
        <text x="15" y="110" font-family="monospace" font-size="7.5" fill="#7ee787">Centralized auditing and instant enterprise policy updates</text>
      </g>
    </g>
  </g>
</svg>