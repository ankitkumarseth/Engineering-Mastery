<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSec1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradSec1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="oauthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="jwtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="authzGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGradSec1)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Enterprise Identity, OAuth2 / OIDC &amp; The Stateless JWT Dilemma</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">CORE.11: Auth Code with PKCE, M2M Client Credentials, RS256 JWKS Rotation, Redis Revocation &amp; ABAC vs RBAC</text>
  </g>

  <!-- SECTION 1: OAuth2 Flows: User PKCE vs M2M (Left Column) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradSec1)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#oauthGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">1. OAuth2 / OIDC Grant Flows: User vs M2M</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Proof Key for Code Exchange (PKCE) &amp; Service-to-Service Delegation</text>

    <g transform="translate(20, 75)">
      <!-- Sub-card 1: User PKCE -->
      <g transform="translate(0, 0)">
        <rect width="505" height="175" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">USER AUTH: Authorization Code + PKCE (RFC 7636)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. SPA/Mobile generates code_verifier + SHA-256 code_challenge.</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. User authenticates at IdP -> Returns auth code via browser redirect.</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">3. Client trades code + plain code_verifier via direct HTTPS POST.</text>
        <text x="16" y="118" font-family="monospace" font-size="13" fill="#7ee787">✓ Zero Client Secret in browser; immune to auth code interception!</text>
        <text x="16" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Issues: ID Token (OIDC user profile) + Access Token (API authorization).</text>
      </g>

      <!-- Sub-card 2: M2M Client Credentials -->
      <g transform="translate(0, 195)">
        <rect width="505" height="190" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">M2M AUTH: Client Credentials (RFC 6749)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Service A authenticates via client_id + client_secret directly.</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Receives scoped Access Token (e.g. scopes: "payments:write").</text>
        <text x="16" y="96" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">⚠️ The "Lost User Context" Problem in Microservices:</text>
        <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#c9d1d9">Downstream Service B only sees Service A; original end-user is lost!</text>
        <text x="16" y="144" font-family="monospace" font-size="13" fill="#3fb950">✓ RFC 8693 Token Exchange propagates user (sub) + actor (act)</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: JWT Internals & The Revocation Dilemma (Right Column) -->
  <g transform="translate(615, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradSec1)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#jwtGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f85149">2. JWT Internals &amp; The Revocation Dilemma</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Asymmetric RS256 vs HS256 &amp; Stateless Revocation Architecture</text>

    <g transform="translate(20, 75)">
      <!-- Sub-card 1: Signing -->
      <g transform="translate(0, 0)">
        <rect width="505" height="150" rx="6" fill="#0d1117" stroke="#da3633" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#ff7b72">JWT Signing: RS256 (Asymmetric) vs HS256 (Symmetric)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• HS256: Shared symmetric secret. Any verifying service can FORGE tokens!</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• RS256: IdP signs with Private Key. Microservices verify via Public Key.</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#7ee787">✓ JWKS Endpoint: /.well-known/jwks.json (Dynamic Key Rotation)</text>
        <text x="16" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Services cache public keys by 'kid'; zero shared secrets to leak.</text>
      </g>

      <!-- Sub-card 2: Revocation -->
      <g transform="translate(0, 170)">
        <rect width="505" height="215" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">The Stateless Token Revocation Dilemma</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">A signed JWT is valid until 'exp'. If an employee is terminated,</text>
        <text x="16" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">you cannot "un-sign" it without hitting a centralized store!</text>

        <!-- Solution Box -->
        <g transform="translate(14, 82)">
          <rect width="477" height="115" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Dual-Layer Architectural Defense:</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Ultra-Short Access Token TTL: 5 to 15 minutes max.</text>
          <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Refresh Token Rotation (RTR): Stateful refresh tokens in Redis.</text>
          <text x="12" y="92" font-family="monospace" font-size="12" fill="#7ee787">Emergency Kill-Switch: Redis Denylist storing jti with TTL = exp - now</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 3: Enterprise Authorization: RBAC vs ABAC (Bottom Row) -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradSec1)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#authzGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">3. Enterprise Authorization: RBAC vs. Fine-Grained ABAC &amp; Decoupled Policy Engines</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Role Explosion Mitigation, Dynamic Context Evaluation &amp; Open Policy Agent (OPA / Rego)</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: RBAC -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">RBAC (Role-Based)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Subject -> Role -> Permissions</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Coarse: "Admin", "Billing_User"</text>
        <text x="16" y="94" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">⚠️ The Role Explosion Antipattern:</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Roles multiply across region/tier/tenant.</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#e3b341">Best for high-level UI tabs; fails for data</text>
      </g>

      <!-- Panel 2: ABAC -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">ABAC (Attribute-Based)</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#7ee787">Evaluates 4 Dynamic Dimensions:</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Subject: { dept: "Finance", level: "L3" }</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Resource: { tenantId: "T-100", pii: true }</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">3. Action: "APPROVE" | 4. Env: { ip, time }</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Natively eliminates BOLA/IDOR data breaches</text>
      </g>

      <!-- Panel 3: Decoupled Policy Engine -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Decoupled Policy Engine</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#d2a8ff">Open Policy Agent (OPA / Rego)</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Policies codified as code (GitOps)</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Evaluates decisions in &lt; 1 millisecond</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Decouples security policy from business code</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Zero auth logic hardcoded in microservices</text>
      </g>
    </g>
  </g>
</svg>