<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSec3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradSec3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="bolaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="ssrfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
    <linearGradient id="cicdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGradSec3)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">OWASP API Security, SSRF IMDSv2 &amp; Enterprise CI/CD Governance</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">CORE.11: BOLA/IDOR Object Ownership, SSRF Cloud Metadata Defense (IMDSv2), SAST (Sonar/Checkmarx) &amp; SCA (Black Duck)</text>
  </g>

  <!-- SECTION 1: OWASP API #1: BOLA / IDOR Defense (Left Column) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradSec3)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#bolaGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ff7b72">1. OWASP API #1: Broken Object Level Auth (BOLA)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Predictable ID Enumeration &amp; Tenant-Aware Contextual Defense</text>

    <g transform="translate(20, 75)">
      <!-- Attack Flow -->
      <g transform="translate(0, 0)">
        <rect width="505" height="155" rx="6" fill="#0d1117" stroke="#da3633" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#ff7b72">THE EXPLOIT: Missing Ownership Verification</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Attacker logs in legitimately as Alice (receives valid JWT).</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Tampering URL parameter: GET /api/v1/accounts/1002 (Bob's!).</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#f85149">3. Vulnerable SQL: SELECT * FROM accounts WHERE id = 1002;</text>
        <text x="16" y="118" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">❌ Alice accesses Bob's private balance! Critical data breach!</text>
        <text x="16" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">BOLA / IDOR remains the #1 most exploited cloud API vulnerability.</text>
      </g>

      <!-- Defense -->
      <g transform="translate(0, 170)">
        <rect width="505" height="215" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">THE ANTIDOTE: Contextual Tenant-Aware Database Isolation</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Never rely on raw user-supplied IDs from HTTP path/query params!</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Extract caller Identity &amp; Tenant ID directly from verified JWT claims.</text>

        <!-- Code Box -->
        <g transform="translate(14, 82)">
          <rect width="477" height="115" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">Tenant-Aware Context Query (Automatic Multi-Tenant Barrier):</text>
          <text x="12" y="48" font-family="monospace" font-size="13" fill="#58a6ff">SELECT * FROM accounts</text>
          <text x="12" y="70" font-family="monospace" font-size="13" fill="#7ee787">WHERE id = :id AND tenant_id = :jwtTenant AND owner = :jwtUser;</text>
          <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Unmatched rows return HTTP 404 / 403; zero cross-tenant data leakage!</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 2: SSRF & Cloud Metadata IMDSv2 (Right Column) -->
  <g transform="translate(615, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradSec3)" stroke="#d29922" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#ssrfGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#e3b341">2. SSRF &amp; Cloud Metadata Defense (IMDSv2)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Server-Side Request Forgery &amp; Session-Token Hardening</text>

    <g transform="translate(20, 75)">
      <!-- Attack Box -->
      <g transform="translate(0, 0)">
        <rect width="505" height="155" rx="6" fill="#0d1117" stroke="#da3633" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">THE ATTACK: SSRF via Cloud Metadata (IMDSv1)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. Webhook accepts target URL: ?url=http://169.254.169.254/...</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Under IMDSv1, a simple HTTP GET steals EC2 IAM Role credentials!</text>
        <text x="16" y="94" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">❌ Attacker gains temporary IAM keys; exfiltrates cloud S3 buckets!</text>
        <text x="16" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">The exact attack vector responsible for the Capital One data breach.</text>
        <text x="16" y="140" font-family="monospace" font-size="12" fill="#f85149">IMDSv1 has NO session token challenge and allows simple GET traversal</text>
      </g>

      <!-- Defense Box -->
      <g transform="translate(0, 170)">
        <rect width="505" height="215" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">THE ANTIDOTE: AWS IMDSv2 Session Token Challenge</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">IMDSv2 strictly enforces a session-oriented two-step challenge:</text>

        <!-- 2-Step Box -->
        <g transform="translate(14, 62)">
          <rect width="477" height="135" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#58a6ff">Step 1: PUT Request to obtain Session Token</text>
          <text x="12" y="42" font-family="monospace" font-size="12" fill="#c9d1d9">PUT /latest/api/token (Header: X-aws-ec2-metadata-token-ttl: 21600)</text>
          <text x="12" y="68" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">Step 2: GET Request presenting Session Token</text>
          <text x="12" y="88" font-family="monospace" font-size="12" fill="#c9d1d9">GET /latest/meta-data/iam/ (Header: X-aws-ec2-metadata-token: [token])</text>
          <text x="12" y="116" font-family="monospace" font-size="12" fill="#7ee787">✓ Hop limit = 1 blocks proxy traversal; GET SSRFs cannot inject PUT headers</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 3: Enterprise CI/CD AppSec Pipeline (Bottom Row) -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradSec3)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#cicdGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">3. Enterprise CI/CD Security Pipeline: SAST (Sonar/Checkmarx) &amp; SCA (Black Duck)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Automated PR Quality Gates, Static Taint Analysis, Open-Source License Governance &amp; Supply Chain Signing</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: SAST -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">SAST (Static Code Analysis)</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#79c0ff">SonarQube &amp; Checkmarx</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Taint Analysis: untrusted HTTP sources</text>
        <text x="16" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">  tracked to sensitive DB/OS sinks</text>
        <text x="16" y="116" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">Gate: ZERO Critical / High CVEs</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Automatically blocks Pull Request merges</text>
      </g>

      <!-- Panel 2: SCA -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">SCA (Software Composition)</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#7ee787">Black Duck / Snyk Transitive Scans</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Detects Log4Shell, Spring4Shell in transitive dependencies</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• CVSS &gt;= 7.0 automatically breaks build</text>
        <text x="16" y="118" font-family="monospace" font-size="13" fill="#e3b341">License Governance: Blocks AGPL / GPL v3</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Shields proprietary IP from copyleft disclosure</text>
      </g>

      <!-- Panel 3: SBOM & Cosign -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Supply Chain Security</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#d2a8ff">SBOM &amp; Container Signing</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• CycloneDX / SPDX SBOM export</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Sigstore Cosign: signs Docker digest</text>
        <text x="16" y="118" font-family="monospace" font-size="13" fill="#3fb950">Kyverno K8s Admission Control:</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Rejects unsigned images at deploy time</text>
      </g>
    </g>
  </g>
</svg>