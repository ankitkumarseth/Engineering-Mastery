<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="400" fill="url(#bgGrad)" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="430" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Leader Election Quorums: Preventing Split-Brain</text>
  <text x="430" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Why two leaders can NEVER be elected in the same term (N=5 Majority Quorum)</text>

  <!-- Majority Math Banner -->
  <rect x="220" y="80" width="420" height="38" rx="6" fill="#0f172a" stroke="#f87171" stroke-width="1.2"/>
  <text x="430" y="104" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#fca5a5">Cluster Size (N) = 5  |  Majority Required = 3 Votes</text>

  <!-- Candidate A Quorum (Left) -->
  <rect x="60" y="140" width="380" height="170" rx="16" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="180" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#60a5fa">Candidate A (Needs 3 Votes)</text>

  <!-- Candidate E Quorum (Right) -->
  <rect x="420" y="140" width="380" height="170" rx="16" fill="#701a75" fill-opacity="0.3" stroke="#d946ef" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="680" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f5d0fe">Candidate E (Needs 3 Votes)</text>

  <!-- Node A (Candidate) -->
  <g transform="translate(100, 195)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Node A</text>
    <text x="35" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">Candidate</text>
  </g>

  <!-- Node B (Voter) -->
  <g transform="translate(200, 195)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Node B</text>
    <text x="35" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Votes A</text>
  </g>

  <!-- Node C (THE SHARED VOTER - CONFLICT!) -->
  <g transform="translate(395, 180)">
    <circle cx="35" cy="45" r="42" fill="#450a0a" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
    <text x="35" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#fca5a5">Node C</text>
    <text x="35" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ef4444">1 Vote Limit!</text>
    <text x="35" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" fill="#fecaca">Tie-Breaker</text>
  </g>

  <!-- Node D (Voter) -->
  <g transform="translate(590, 195)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#d946ef" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f5d0fe">Node D</text>
    <text x="35" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Votes E</text>
  </g>

  <!-- Node E (Candidate) -->
  <g transform="translate(690, 195)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#d946ef" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f5d0fe">Node E</text>
    <text x="35" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#e879f9">Candidate</text>
  </g>

  <!-- Explanation Footer Card -->
  <rect x="60" y="330" width="740" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="430" y="352" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">
    In Raft/Paxos, each node can cast <tspan fill="#f87171" font-weight="700">at most one vote per term</tspan> (first-come, first-served).
  </text>
  <text x="430" y="369" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
    Because any two majorities of size 3 in a 5-node cluster MUST share at least 1 node (Node C), both A and E cannot win!
  </text>
</svg>