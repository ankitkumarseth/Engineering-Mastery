<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="580" fill="url(#bgGrad)" rx="12"/>

  <!-- Title & Subtitle (Large Readable Typography) -->
  <text x="490" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Consensus (Raft/Paxos) vs. Atomic Commitment (2PC)</text>
  <text x="490" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">The Core Architectural Trade-off: High-Availability Majority vs. All-or-Nothing Unanimity</text>

  <!-- Left Column: Consensus (Raft / Paxos) -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="435" height="455" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect x="15" y="15" width="405" height="48" rx="6" fill="#1e3a8a"/>
    <text x="217" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#bfdbfe">CONSENSUS (Raft / Paxos)</text>

    <!-- Point 1: Goal -->
    <g transform="translate(20, 80)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">🎯 Core Objective:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#e2e8f0">Replicate the EXACT SAME state machine</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">across identical redundant nodes.</text>
    </g>

    <!-- Point 2: Quorum Rule -->
    <g transform="translate(20, 145)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">⚖️ Voting Rule:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">STRICT MAJORITY (⌊N/2⌋ + 1)</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">In a 5-node cluster, only 3 votes needed to commit.</text>
    </g>

    <!-- Point 3: Liveness & Blocking -->
    <g transform="translate(20, 210)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">🛡️ Liveness &amp; Fault Tolerance:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">NON-BLOCKING (Tolerates crashes!)</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">If 2 nodes crash or disconnect, the remaining 3</text>
      <text x="0" y="56" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">nodes continue processing writes seamlessly.</text>
    </g>

    <!-- Point 4: Failure Mode -->
    <g transform="translate(20, 290)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">⚠️ Failure Condition:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">Halts progress only if a strict majority</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">(≥ 3 of 5 nodes) crashes simultaneously.</text>
    </g>

    <!-- Point 5: Where Used -->
    <g transform="translate(20, 355)">
      <rect x="0" y="0" width="395" height="58" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Production Standards:</text>
      <text x="15" y="44" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">etcd (Kubernetes), ZooKeeper, CockroachDB, Spanner</text>
    </g>
  </g>

  <!-- Right Column: Two-Phase Commit (2PC) -->
  <g transform="translate(510, 95)">
    <rect x="0" y="0" width="435" height="455" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect x="15" y="15" width="405" height="48" rx="6" fill="#881337"/>
    <text x="217" y="45" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#fecdd3">ATOMIC COMMIT (Two-Phase Commit / 2PC)</text>

    <!-- Point 1: Goal -->
    <g transform="translate(20, 80)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fb7185">🎯 Core Objective:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#e2e8f0">Coordinate DIFFERENT heterogeneous services</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">to commit or abort ALL-OR-NOTHING.</text>
    </g>

    <!-- Point 2: Quorum Rule -->
    <g transform="translate(20, 145)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fb7185">⚖️ Voting Rule:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f87171">100% UNANIMOUS CONSENT</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">EVERY participant must vote YES. 1 NO = Abort.</text>
    </g>

    <!-- Point 3: Liveness & Blocking -->
    <g transform="translate(20, 210)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fb7185">🛡️ Liveness &amp; Fault Tolerance:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f87171">BLOCKING (Single Point of Failure!)</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">If Coordinator crashes during Phase 2, all</text>
      <text x="0" y="56" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">participants are left holding locks indefinitely!</text>
    </g>

    <!-- Point 4: Failure Mode -->
    <g transform="translate(20, 290)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fb7185">⚠️ Failure Condition:</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">If even ONE node crashes or slows down,</text>
      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">the entire transaction stalls and fails.</text>
    </g>

    <!-- Point 5: Where Used -->
    <g transform="translate(20, 355)">
      <rect x="0" y="0" width="395" height="58" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#fda4af">Production Standards:</text>
      <text x="15" y="44" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">XA Transactions, Distributed Relational DB cross-partition tx</text>
    </g>
  </g>
</svg>