<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="400" fill="url(#bgGrad)" rx="10"/>

  <!-- Title & Subtitle -->
  <text x="430" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Quorum Consistency: Read &amp; Write Overlap (w + r &gt; n)</text>
  <text x="430" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">The Pigeonhole Principle guarantees the Read Quorum intersects the Write Quorum</text>

  <!-- Formula Banner (Widened to 560px to easily fit text with 70px padding) -->
  <rect x="150" y="80" width="560" height="38" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="430" y="104" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="700" fill="#38bdf8">Total Replicas (n) = 5  |  Write (w) = 3  |  Read (r) = 3</text>

  <!-- Read Quorum Bubble (Left) -->
  <rect x="70" y="140" width="370" height="170" rx="16" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="170" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#60a5fa">📖 Read Quorum (r = 3)</text>

  <!-- Write Quorum Bubble (Right) -->
  <rect x="420" y="140" width="370" height="170" rx="16" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="690" y="170" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">✍️ Write Quorum (w = 3)</text>

  <!-- Node A (Read Only) -->
  <g transform="translate(110, 200)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Node A</text>
    <text x="35" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">v0</text>
  </g>

  <!-- Node B (Read Only) -->
  <g transform="translate(210, 200)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Node B</text>
    <text x="35" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">v0</text>
  </g>

  <!-- Node C (INTERSECTION NODE) -->
  <g transform="translate(395, 185)">
    <circle cx="35" cy="45" r="42" fill="#78350f" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
    <text x="35" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#fef08a">Node C</text>
    <text x="35" y="58" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#facc15">v1 (Latest!)</text>
    <text x="35" y="73" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" fill="#fde68a">Overlap</text>
  </g>

  <!-- Node D (Write Only) -->
  <g transform="translate(580, 200)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">Node D</text>
    <text x="35" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">v1</text>
  </g>

  <!-- Node E (Write Only) -->
  <g transform="translate(680, 200)">
    <circle cx="35" cy="35" r="32" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">Node E</text>
    <text x="35" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">v1</text>
  </g>

  <!-- Explanation Footer Card -->
  <rect x="70" y="330" width="720" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="430" y="352" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">
    Because <tspan fill="#facc15" font-weight="700">w + r = 3 + 3 = 6 &gt; 5</tspan>, every read quorum contains at least one node that participated in the latest write.
  </text>
  <text x="430" y="369" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
    Client compares returned version timestamps (Node A: v0, Node B: v0, Node C: v1) and deterministically picks v1.
  </text>
</svg>