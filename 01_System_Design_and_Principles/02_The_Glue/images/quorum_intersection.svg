<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bgGrad)" rx="12"/>

  <!-- Title & Subtitle -->
  <text x="480" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Quorum Consistency: Read &amp; Write Overlap (w + r &gt; n)</text>
  <text x="480" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">The Pigeonhole Principle guarantees the Read Quorum intersects the Write Quorum</text>

  <!-- Formula Banner -->
  <rect x="180" y="92" width="600" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="119" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8">Total Replicas (n) = 5  |  Write (w) = 3  |  Read (r) = 3</text>

  <!-- Read Quorum Bubble (Left) -->
  <rect x="50" y="155" width="410" height="205" rx="16" fill="#1e3a8a" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="180" y="188" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#60a5fa">📖 Read Quorum (r = 3)</text>

  <!-- Write Quorum Bubble (Right) -->
  <rect x="500" y="155" width="410" height="205" rx="16" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="780" y="188" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#34d399">✍️ Write Quorum (w = 3)</text>

  <!-- Node A (Read Only) -->
  <g transform="translate(90, 220)">
    <circle cx="40" cy="40" r="36" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="37" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">Node A</text>
    <text x="40" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">v0</text>
  </g>

  <!-- Node B (Read Only) -->
  <g transform="translate(200, 220)">
    <circle cx="40" cy="40" r="36" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="37" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">Node B</text>
    <text x="40" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">v0</text>
  </g>

  <!-- Node C (INTERSECTION NODE) -->
  <g transform="translate(435, 205)">
    <circle cx="45" cy="50" r="48" fill="#78350f" stroke="#f59e0b" stroke-width="3"/>
    <text x="45" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#fef08a">Node C</text>
    <text x="45" y="60" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#facc15">v1 (Latest!)</text>
    <text x="45" y="76" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#fde68a">Overlap</text>
  </g>

  <!-- Node D (Write Only) -->
  <g transform="translate(680, 220)">
    <circle cx="40" cy="40" r="36" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="37" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">Node D</text>
    <text x="40" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#34d399">v1</text>
  </g>

  <!-- Node E (Write Only) -->
  <g transform="translate(790, 220)">
    <circle cx="40" cy="40" r="36" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="37" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">Node E</text>
    <text x="40" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#34d399">v1</text>
  </g>

  <!-- Explanation Footer Card -->
  <rect x="50" y="385" width="860" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="480" y="412" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">
    Because <tspan fill="#facc15" font-weight="700">w + r = 3 + 3 = 6 &gt; 5</tspan>, every read quorum contains at least one node that participated in the latest write.
  </text>
  <text x="480" y="434" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" fill="#94a3b8">
    Client compares returned version timestamps (Node A: v0, Node B: v0, Node C: v1) and deterministically picks v1.
  </text>
</svg>