<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAws4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradAws4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="mgnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb84d" />
    </linearGradient>
    <linearGradient id="dmsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGradAws4)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">AWS Workload Migration, Database Replication &amp; Hybrid Storage</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">SAP-C02 Domain 4: The 7 Rs, AWS MGN Block Replication, DMS + SCT, Snow Family &amp; Storage Gateways</text>
  </g>

  <!-- SECTION 1: Server Migration via AWS MGN (Left Column) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws4)" stroke="#ff9900" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#mgnGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffb84d">1. Server Migration: AWS MGN &amp; The 7 Rs</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Continuous Block-Level Replication with Zero Downtime</text>

    <!-- Sub-cards: 3 MGN Steps -->
    <g transform="translate(20, 75)">
      <!-- Step 1: Agent Replication -->
      <g transform="translate(0, 0)">
        <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#ff9900" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#ffb84d">Step 1: Continuous Asynchronous Block Replication</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Agent installed on source server (Linux/Windows OS).</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Streams OS-level block changes over TLS (Port 1500) to AWS.</text>
        <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ Zero impact on source apps; writes mirrored to staging EBS disks</text>
      </g>

      <!-- Step 2: Staging Subnet -->
      <g transform="translate(0, 130)">
        <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Step 2: Low-Cost Staging Area Subnet</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Lightweight t3.micro Replication Servers manage target EBS.</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Production EC2 targets do NOT run until cutover (huge savings!).</text>
        <text x="16" y="94" font-family="monospace" font-size="12" fill="#e3b341">Continuous background sync keeps replication lag &lt; 1 second</text>
      </g>

      <!-- Step 3: Cutover -->
      <g transform="translate(0, 260)">
        <rect width="505" height="120" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Step 3: Non-Disruptive Testing &amp; Final Cutover</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Test Cutover: Spawns test EC2 without disrupting replication stream.</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Final Cutover: Stops source app, flushes blocks, launches live EC2.</text>
        <text x="16" y="96" font-family="monospace" font-size="12" fill="#7ee787">✓ Total cutover downtime reduced to minutes (DNS TTL / final sync)</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: Database Migration & Snow Family (Right Column) -->
  <g transform="translate(615, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws4)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#dmsGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">2. Database Migration &amp; Large Data Transfer</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">AWS DMS (Full Load + CDC), SCT &amp; Snowball Tipping Points</text>

    <g transform="translate(20, 75)">
      <!-- DMS & SCT -->
      <g transform="translate(0, 0)">
        <rect width="505" height="145" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">AWS DMS + Schema Conversion Tool (SCT)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Homogeneous: Oracle -> RDS Oracle (DMS alone, zero schema diff).</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Heterogeneous: Oracle -> Aurora PostgreSQL (SCT translates DDL).</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#e3b341">DMS Task: Full Load + Ongoing Change Data Capture (CDC)</text>
        <text x="16" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Mines source database redo/binlogs continuously until final cutover.</text>
      </g>

      <!-- DataSync vs Snowball -->
      <g transform="translate(0, 160)">
        <rect width="505" height="225" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#388bfd">Data Transfer: AWS DataSync vs Snow Family</text>

        <!-- DataSync Sub-panel -->
        <g transform="translate(14, 38)">
          <rect width="477" height="78" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">AWS DataSync (Online Network Transfer over DX)</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Automated agent-based transfer up to 10 Gbps with checksums.</text>
          <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Best for datasets &lt; 100TB where connection bandwidth is plentiful.</text>
        </g>

        <!-- Snowball Sub-panel -->
        <g transform="translate(14, 126)">
          <rect width="477" height="85" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1"/>
          <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">AWS Snow Family (Offline Physical Appliances)</text>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Snowcone: 8TB usable | Snowball Edge: 80TB storage + EC2 compute.</text>
          <text x="12" y="68" font-family="monospace" font-size="12" fill="#7ee787">Tipping Point: When network transfer exceeds 1 week (> 100TB), use Snowball!</text>
        </g>
      </g>
    </g>
  </g>

  <!-- SECTION 3: Hybrid Storage Gateway & FSx (Bottom Row) -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradAws4)" stroke="#8957e5" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#gwGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#a371f7">3. Hybrid Storage Gateway Architecture &amp; Amazon FSx Family</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Connecting On-Prem File Systems to S3 and Multi-Protocol FSx for NetApp ONTAP &amp; Windows</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: S3 File Gateway -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">AWS S3 File Gateway</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Standard NFS (v3/v4.1) &amp; SMB shares</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Maps 1:1 as native objects in S3</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#3fb950">Local Cache: Sub-millisecond SSD</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Hot files served from local SSD; cold data</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Ideal for hybrid backups &amp; file archiving</text>
      </g>

      <!-- Panel 2: Volume & Tape Gateway -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Volume &amp; Tape Gateways</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#7ee787">Volume Gateway (iSCSI Block Storage):</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Cached: data in S3, hot cache on-prem</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Stored: primary on-prem, async EBS snapshots</text>
        <text x="16" y="118" font-family="monospace" font-size="13" fill="#e3b341">Tape Gateway (VTL Virtual Tape Library):</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Drops into backup software -> S3 Glacier</text>
      </g>

      <!-- Panel 3: Amazon FSx Family -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Amazon FSx Family</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#d2a8ff">FSx for NetApp ONTAP (Multi-Protocol):</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• NFS, SMB &amp; iSCSI protocols concurrently</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• SnapMirror for zero-effort cloud migration</text>
        <text x="16" y="116" font-family="monospace" font-size="13" fill="#58a6ff">FSx for Windows File Server (Native SMB):</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Multi-AZ failover, DFS, Active Directory</text>
      </g>
    </g>
  </g>
</svg>