<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAws2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradAws2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="srvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGradAws2)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">AWS Serverless Compute, Edge Ingress &amp; Scalable Persistence</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">SAP-C02 Domain 2: Lambda Lifecycle, EventBridge, CloudFront Origin Failover, DynamoDB Global Tables &amp; Aurora Quorums</text>
  </g>

  <!-- SECTION 1: Serverless Compute & Event Mesh (Left Column) -->
  <g transform="translate(40, 105)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws2)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#srvGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ff7b72">1. Serverless Compute &amp; Event-Driven Core</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Concurrency Models, Cold Start Elimination &amp; EventBridge</text>

    <!-- Sub-card 1: Lambda -->
    <g transform="translate(20, 75)">
      <rect width="505" height="120" rx="6" fill="#0d1117" stroke="#da3633" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#ff7b72">Lambda Lifecycle: [INIT] -> [INVOKE] -> [SHUTDOWN]</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Cold Start (INIT): MicroVM spinup, runtime boot, static code init.</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Provisioned Concurrency: Keeps pre-warmed execution environments ready.</text>
      <text x="16" y="94" font-family="monospace" font-size="12" fill="#e3b341">✓ Eliminates P99 cold-start latency spikes on critical payment APIs</text>
    </g>

    <!-- Sub-card 2: Containers -->
    <g transform="translate(20, 210)">
      <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Container Orchestration: ECS Fargate vs EKS Karpenter</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• ECS on Fargate: Pure serverless pods, zero EC2 host management.</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• EKS Karpenter: Just-in-time autoscaler provisioning right-sized EC2s.</text>
      <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ Karpenter launches spot/on-demand instances in seconds vs minutes</text>
    </g>

    <!-- Sub-card 3: EventBridge -->
    <g transform="translate(20, 340)">
      <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Amazon EventBridge: Serverless Event Mesh</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Content-based filtering, archive &amp; replay for disaster recovery.</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• API Destinations: Routes events directly to webhooks with zero code.</text>
      <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ Built-in retry with exponential backoff &amp; dead-letter queues</text>
    </g>
  </g>

  <!-- SECTION 2: Edge Routing & High-Availability API (Right Column) -->
  <g transform="translate(615, 105)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws2)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#edgeGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">2. Edge Ingress &amp; API Acceleration</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">CloudFront Origin Failover, Edge Functions &amp; API Gateways</text>

    <!-- Sub-card 1: CloudFront Failover -->
    <g transform="translate(20, 75)">
      <rect width="505" height="120" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">CloudFront Origin Groups (Active-Standby Failover)</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Primary Origin: us-east-1 Application Load Balancer / S3 bucket.</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Secondary Origin: eu-west-1 Application Load Balancer / S3 bucket.</text>
      <text x="16" y="94" font-family="monospace" font-size="12" fill="#e3b341">Triggers failover automatically on HTTP 500, 502, 503, 504 errors</text>
    </g>

    <!-- Sub-card 2: Edge Compute -->
    <g transform="translate(20, 210)">
      <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Edge Compute: CloudFront Functions vs Lambda@Edge</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• CF Functions: Sub-millisecond, pure JS, header rewrites, cache keys.</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Lambda@Edge: Full Node.js/Python, network access, DB auth checks.</text>
      <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ Choose CF Functions for scale &amp; cost; Lambda@Edge for network I/O</text>
    </g>

    <!-- Sub-card 3: API Gateway -->
    <g transform="translate(20, 340)">
      <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">API Gateway: HTTP APIs vs REST APIs</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• HTTP APIs: 71% cheaper, 60% lower latency, native OIDC/JWT authorizers.</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• REST APIs: Needed ONLY for API Keys, Usage Plans, WAF, or transformations.</text>
      <text x="16" y="94" font-family="monospace" font-size="11.5" fill="#7ee787">✓ Default to HTTP APIs unless REST features strictly required</text>
    </g>
  </g>

  <!-- SECTION 3: Scalable Cloud Persistence Tier (Bottom Row) -->
  <g transform="translate(40, 605)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradAws2)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#dataGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">3. Scalable Cloud Persistence: DynamoDB Single-Table &amp; Aurora Distributed Storage</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Global Tables Active-Active Replication, Aurora 6-Way Storage Quorums &amp; Serverless v2 Scaling</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: DynamoDB -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">DynamoDB Architecture</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Single-Table Design: PK + SK modeling</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Global Tables: Active-Active Multi-Region</text>
        <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Sub-second stream replication;</text>
        <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f85149">⚠️ Last-Writer-Wins (LWW) conflict policy.</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ On-Demand auto-scaling for spiky traffic</text>
      </g>

      <!-- Panel 2: Aurora Storage Engine -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Aurora Distributed Storage</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• 6-way replication across 3 AZs (10GB chunks)</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Write Quorum: 4 of 6 nodes acknowledge</text>
        <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Read Quorum: 3 of 6 nodes acknowledge</text>
        <text x="16" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Self-healing peer-to-peer background disk repair.</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Survives AZ crash + 1 disk failure without loss</text>
      </g>

      <!-- Panel 3: Serverless v2 & Global DB -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Serverless v2 &amp; Global DB</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Instant ACU scaling (0.5 to 128 ACUs)</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Adjusts CPU/RAM in millisecond fractions</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#58a6ff">Aurora Global Database:</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Storage replication (&lt; 1 sec cross-region latency)</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ DR failover under 1 minute with RPO &lt; 1 sec</text>
      </g>
    </g>
  </g>
</svg>