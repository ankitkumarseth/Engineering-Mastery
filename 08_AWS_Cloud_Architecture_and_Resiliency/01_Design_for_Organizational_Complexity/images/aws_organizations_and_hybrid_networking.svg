<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAws1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradAws1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb84d" />
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="tgwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGradAws1)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">AWS Multi-Account Governance, Hybrid Connectivity &amp; Transit Gateway</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">SAP-C02 Domain 1: Organizations Hierarchy, SCP Precedence, Direct Connect Gateway &amp; Centralized Inspection</text>
  </g>

  <!-- SECTION 1: AWS Organizations & Identity Governance (Left Column) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws1)" stroke="#ff9900" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#orgGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffb84d">1. Organizations, SCP Inheritance &amp; Identity</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Guardrails via Explicit Deny &amp; Enterprise SSO Federation</text>

    <!-- Sub-card 1: Management Account -->
    <g transform="translate(20, 75)">
      <rect width="505" height="105" rx="6" fill="#0d1117" stroke="#ff9900" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#ffb84d">Management Account (Root) — Governance ONLY</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Root SCP: FullAWSAccess default. Never run workloads here.</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Delegated Admin: GuardDuty, Security Hub, Backup, Identity Center.</text>
      <text x="16" y="92" font-family="monospace" font-size="12" fill="#7ee787">✓ Prevents management account privilege escalation &amp; blast radius</text>
    </g>

    <!-- Sub-card 2: OUs & SCP Rule -->
    <g transform="translate(20, 195)">
      <rect width="505" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Organizational Units (OUs) &amp; SCP Inheritance</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Core OU (Shared Services, Central Network, Security/Audit)</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Workloads OU (Prod, Non-Prod, Sandbox) — Strong isolation</text>
      <text x="16" y="94" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">⚠️ SCP Rule: Explicit Deny TRUMPS all allows at any level!</text>
      <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">SCPs set max guardrails; IAM policies grant actual user permissions.</text>
    </g>

    <!-- Sub-card 3: IAM Identity Center -->
    <g transform="translate(20, 340)">
      <rect width="505" height="115" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">IAM Identity Center (AWS SSO) &amp; STS AssumeRole</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• SAML 2.0 / OIDC IdP (Okta / Entra ID) -> Central Web Portal</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Permission Sets deploy temporary IAM roles across 100+ accounts</text>
      <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ Eliminates static IAM user credentials &amp; long-lived access keys</text>
    </g>
  </g>

  <!-- SECTION 2: Hybrid Connectivity & Route 53 Resolver (Right Column) -->
  <g transform="translate(615, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws1)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#netGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">2. Hybrid Direct Connect &amp; Route 53 DNS</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Direct Connect Gateway, Transit VIF &amp; Split-Horizon Resolution</text>

    <!-- Sub-card 1: Direct Connect -->
    <g transform="translate(20, 75)">
      <rect width="505" height="130" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">AWS Direct Connect (DX) + DX Gateway (DXGW)</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Dedicated (1/10/100 Gbps) vs Hosted Connection</text>
      <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Transit VIF: Attaches DXGW to Transit Gateway (TGW) globally</text>
      <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Wire Security: IEEE 802.1AE MACsec (L2) or IPsec VPN over DX (L3)</text>
      <text x="16" y="114" font-family="monospace" font-size="12" fill="#e3b341">DXGW connects on-prem to multiple VPCs across multi-regions</text>
    </g>

    <!-- Sub-card 2: Route 53 Resolver -->
    <g transform="translate(20, 220)">
      <rect width="505" height="235" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
      <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#388bfd">Route 53 Resolver: Split-Horizon Hybrid DNS</text>

      <!-- Inbound Endpoint -->
      <g transform="translate(14, 38)">
        <rect width="477" height="82" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
        <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#7ee787">INBOUND ENDPOINT (On-Prem -> AWS Resolves Private Zones)</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• ENIs placed in VPC subnets with static private IPs.</text>
        <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">On-prem DNS forwards *.aws.internal queries to Inbound ENIs.</text>
      </g>

      <!-- Outbound Endpoint -->
      <g transform="translate(14, 134)">
        <rect width="477" height="86" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1"/>
        <text x="12" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#e3b341">OUTBOUND ENDPOINT + RULES (AWS -> On-Prem DNS)</text>
        <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Resolver Forwarding Rules: corp.example.com -> On-Prem DNS IP.</text>
        <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Shared across 100+ accounts via AWS RAM (zero duplicate config).</text>
      </g>
    </g>
  </g>

  <!-- SECTION 3: Transit Gateway & Centralized Inspection VPC (Bottom Row) -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradAws1)" stroke="#8957e5" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#tgwGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#a371f7">3. Transit Gateway (TGW) Hub-and-Spoke &amp; Centralized Inspection VPC</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">East-West &amp; North-South Inspection via Gateway Load Balancer (GWLB) &amp; Appliance Mode</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: Spoke VPCs -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Spoke VPC Attachments</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Spoke 1 (Prod), Spoke 2 (Dev)</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Route 0.0.0.0/0 -> TGW Attachment</text>
        <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">No direct peering mesh: eliminates</text>
        <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">N*(N-1)/2 exponential peering complexity.</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Centralized routing domains via RAM</text>
      </g>

      <!-- Panel 2: Centralized Inspection VPC -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#f85149">Central Inspection (GWLB)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• GWLB encapsulates traffic via GENEVE (Port 6081)</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Next-Gen Firewalls inspect raw packet payloads</text>
        <text x="16" y="98" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">⚠️ CRITICAL: TGW Appliance Mode Enabled!</text>
        <text x="16" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Guarantees symmetric bidirectional flow to same AZ,</text>
        <text x="16" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">preventing stateful firewall TCP session drops.</text>
      </g>

      <!-- Panel 3: Central Egress & Inter-Region -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Central Egress &amp; Peering</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Shared NAT Gateways in Egress VPC</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Saves massive hourly NAT Gateway costs</text>
        <text x="16" y="94" font-family="monospace" font-size="13" fill="#3fb950">Inter-Region TGW Peering:</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Encrypted over AWS Global Backbone</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Global enterprise transit network</text>
      </g>
    </g>
  </g>
</svg>