<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAws3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradAws3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="drGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#010409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGradAws3)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">AWS Multi-Region Disaster Recovery, Security &amp; FinOps Optimization</text>
    <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e">SAP-C02 Domain 3: 4 DR Strategies (RPO vs RTO), KMS Envelope Encryption, Multi-Region CMKs &amp; Savings Plans</text>
  </g>

  <!-- SECTION 1: Disaster Recovery Spectrum (Left Column) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws3)" stroke="#da3633" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#drGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#f85149">1. Disaster Recovery Spectrum (RPO vs RTO)</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Cost vs Recovery Speed Trade-Off Across 4 Production Models</text>

    <!-- Sub-cards: 4 Tiers -->
    <g transform="translate(20, 75)">
      <!-- Tier 1: Backup & Restore -->
      <g transform="translate(0, 0)">
        <rect width="505" height="85" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="22" font-family="monospace" font-size="14" font-weight="700" fill="#8b949e">1. Backup &amp; Restore (Hours to Days)</text>
        <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Snapshots shipped to cross-region S3; no running infrastructure.</text>
        <text x="16" y="68" font-family="monospace" font-size="12" fill="#7ee787">Lowest Cost ($) | Highest RPO/RTO (24+ hours)</text>
      </g>

      <!-- Tier 2: Pilot Light -->
      <g transform="translate(0, 95)">
        <rect width="505" height="85" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
        <text x="16" y="22" font-family="monospace" font-size="14" font-weight="700" fill="#e3b341">2. Pilot Light (Tens of Minutes)</text>
        <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Data replicated continuously (Aurora Replica, DynamoDB Streams).</text>
        <text x="16" y="68" font-family="monospace" font-size="12" fill="#e3b341">App compute (ASG/EKS) launched via CloudFormation on failover</text>
      </g>

      <!-- Tier 3: Warm Standby -->
      <g transform="translate(0, 190)">
        <rect width="505" height="85" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="16" y="22" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">3. Warm Standby (Minutes)</text>
        <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Scaled-down fleet running 24/7 in DR region handling canary traffic.</text>
        <text x="16" y="68" font-family="monospace" font-size="12" fill="#58a6ff">Failover scales ASG capacity from 20% to 100% in minutes</text>
      </g>

      <!-- Tier 4: Multi-Site Active-Active -->
      <g transform="translate(0, 285)">
        <rect width="505" height="95" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="22" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">4. Multi-Site Active-Active (Near Zero)</text>
        <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• 100% production traffic served simultaneously from 2+ regions.</text>
        <text x="16" y="66" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">RPO = 0 (or &lt; 1s) | RTO = 0 | Route 53 ARC Routing Controls</text>
        <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f85149">Highest Cost ($$$$) | Requires conflict-free data modeling</text>
      </g>
    </g>
  </g>

  <!-- SECTION 2: Cryptography & Network Security (Right Column) -->
  <g transform="translate(615, 105)" filter="url(#shadow)">
    <rect width="545" height="475" rx="10" fill="url(#cardGradAws3)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="545" height="6" rx="3" fill="url(#secGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#58a6ff">2. Cryptography, KMS &amp; Threat Detection</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">KMS Envelope Encryption, Multi-Region CMKs &amp; GuardDuty</text>

    <g transform="translate(20, 75)">
      <!-- Envelope Encryption -->
      <g transform="translate(0, 0)">
        <rect width="505" height="150" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">KMS Envelope Encryption: GenerateDataKey</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">1. KMS returns Plaintext Data Key (PDK) + Encrypted Data Key (EDK).</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">2. Application encrypts payload using PDK in local memory (AES-256-GCM).</text>
        <text x="16" y="94" font-family="monospace" font-size="13" font-weight="700" fill="#f85149">⚠️ CRITICAL: Application zeroes out PDK in RAM immediately!</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">3. Stores [Ciphertext + EDK] together; KMS never touches payload.</text>
        <text x="16" y="138" font-family="monospace" font-size="12" fill="#7ee787">✓ Bypasses KMS 4KB limit and eliminates KMS API rate throttling</text>
      </g>

      <!-- Multi-Region CMKs -->
      <g transform="translate(0, 160)">
        <rect width="505" height="105" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Multi-Region CMKs (Primary &amp; Replicas)</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Primary Key in us-east-1 replicated to eu-west-1 (Same Key Material).</text>
        <text x="16" y="72" font-family="monospace" font-size="13" fill="#3fb950">✓ Encrypt in US -> Decrypt in EU directly with zero cross-region latency</text>
        <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Eliminates cross-region KMS network dependencies during DR failover.</text>
      </g>

      <!-- GuardDuty & WAF -->
      <g transform="translate(0, 275)">
        <rect width="505" height="105" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Threat Detection: GuardDuty &amp; AWS WAF</text>
        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• GuardDuty: ML threat analysis on VPC Flow, DNS, CloudTrail, EKS logs.</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• AWS WAF: Rate-based rules (block IP exceeding 2,000 req/5min).</text>
        <text x="16" y="94" font-family="monospace" font-size="12" fill="#7ee787">✓ 100% agentless threat detection &amp; DDoS edge mitigation</text>
      </g>
    </g>
  </g>

  <!-- SECTION 3: FinOps & Observability Engine (Bottom Row) -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1120" height="260" rx="10" fill="url(#cardGradAws3)" stroke="#238636" stroke-width="2"/>
    <rect width="1120" height="6" rx="3" fill="url(#finGrad)"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3fb950">3. FinOps Cost Optimization &amp; Cross-Account Observability</text>
    <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">Savings Plans vs RIs, Spot ASG Allocation Strategies &amp; CloudWatch Cross-Account Tracing</text>

    <g transform="translate(20, 72)">
      <!-- Panel 1: Savings Plans -->
      <g transform="translate(0, 0)">
        <rect width="345" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#58a6ff">Savings Plans vs RIs</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#3fb950">Compute Savings Plans (Flexible):</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Applies to EC2, Fargate &amp; Lambda</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Switch family (m5 -> c6g) or region</text>
        <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">EC2 Instance Plans: locked to family</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Standard RIs deprecated in favor of SP</text>
      </g>

      <!-- Panel 2: Spot ASG Allocation -->
      <g transform="translate(365, 0)">
        <rect width="360" height="165" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">Spot Allocation &amp; Interruption</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#7ee787">price-capacity-optimized Strategy</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Launches from pools with deepest spare capacity</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Cuts Spot interruption frequency by &gt; 80%</text>
        <text x="16" y="118" font-family="monospace" font-size="13" fill="#f85149">2-Min Interruption Handling via EventBridge:</text>
        <text x="16" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">Drains ALB connections &amp; checkpoints cleanly.</text>
      </g>

      <!-- Panel 3: Observability & S3 -->
      <g transform="translate(745, 0)">
        <rect width="335" height="165" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
        <text x="16" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#a371f7">Observability &amp; S3 Tiering</text>
        <text x="16" y="48" font-family="monospace" font-size="13" fill="#d2a8ff">CloudWatch Cross-Account Observability:</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Single central monitoring account</text>
        <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#c9d1d9">• Unified traces (X-Ray), metrics &amp; logs</text>
        <text x="16" y="116" font-family="monospace" font-size="13" fill="#58a6ff">S3 Intelligent-Tiering (Zero Retrieval):</text>
        <text x="16" y="142" font-family="monospace" font-size="12" fill="#7ee787">✓ Moves idle objects automatically without fees</text>
      </g>
    </g>
  </g>
</svg>