<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAws3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="cardGradAws3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="drGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <marker id="arrowRed3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowBlue3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="740" fill="url(#bgGradAws3)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">AWS Multi-Region Disaster Recovery, Security &amp; FinOps Optimization</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">SAP-C02 Domain 3: 4 DR Strategies (RPO/RTO), KMS Envelope Encryption, Multi-Region CMKs, and FinOps</text>

  <!-- Section 1: Disaster Recovery Strategies Spectrum (Left Column) -->
  <g transform="translate(40, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradAws3)" stroke="#da3633" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#drGrad)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f85149">1. Disaster Recovery Spectrum (RPO vs RTO)</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Cost vs Recovery Speed Trade-Off Across 4 Architectural Models</text>

    <!-- Sub-card: 4 DR Tiers -->
    <g transform="translate(20, 72)">
      <rect width="460" height="275" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#f85149">The 4 Disaster Recovery Architectures</text>

      <g transform="translate(15, 32)">
        <!-- Tier 1: Backup & Restore -->
        <g transform="translate(0, 0)">
          <rect width="430" height="48" rx="4" fill="#0d1117" stroke="#30363d"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#8b949e">1. Backup &amp; Restore (Hours to Days)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Snapshots shipped to cross-region S3; no running infrastructure</text>
          <text x="10" y="42" font-family="monospace" font-size="8" fill="#7ee787">Lowest Cost ($) | Highest RPO/RTO (24+ hrs)</text>
        </g>

        <!-- Tier 2: Pilot Light -->
        <g transform="translate(0, 54)">
          <rect width="430" height="48" rx="4" fill="#0d1117" stroke="#d29922"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#e3b341">2. Pilot Light (Tens of Minutes)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Core data replicated continuously (Aurora Read Replica, DynamoDB)</text>
          <text x="10" y="42" font-family="monospace" font-size="8" fill="#e3b341">App compute (ASG/EKS) launched via CloudFormation on failover</text>
        </g>

        <!-- Tier 3: Warm Standby -->
        <g transform="translate(0, 108)">
          <rect width="430" height="52" rx="4" fill="#0d1117" stroke="#1f6feb"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#58a6ff">3. Warm Standby (Minutes)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Scaled-down fleet running 24/7 in DR region handling test traffic</text>
          <text x="10" y="44" font-family="monospace" font-size="8" fill="#58a6ff">Failover scales ASG capacity from 20% to 100% in minutes</text>
        </g>

        <!-- Tier 4: Multi-Site Active-Active -->
        <g transform="translate(0, 166)">
          <rect width="430" height="56" rx="4" fill="#0d1117" stroke="#238636"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#3fb950">4. Multi-Site Active-Active (Near Zero)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• 100% production traffic served simultaneously from 2+ regions</text>
          <text x="10" y="44" font-family="monospace" font-size="8" fill="#3fb950">RPO = 0 (or &lt; 1s) | RTO = 0 | Route 53 ARC Routing Controls</text>
          <text x="10" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#f85149">Highest Cost ($$$$) | Complex conflict resolution</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 2: Cryptography & Threat Detection (Right Column) -->
  <g transform="translate(560, 100)">
    <rect width="500" height="375" rx="8" fill="url(#cardGradAws3)" stroke="#1f6feb" stroke-width="2"/>
    <rect width="500" height="6" rx="3" fill="url(#secGrad)"/>
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#58a6ff">2. Cryptography, KMS &amp; Network Security</text>
    <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">KMS Envelope Encryption, Multi-Region CMKs &amp; AWS Network Firewall</text>

    <g transform="translate(20, 72)">
      <rect width="460" height="275" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#79c0ff">KMS Envelope Encryption Mechanics</text>

      <g transform="translate(15, 34)">
        <!-- Envelope Encryption Steps -->
        <g transform="translate(0, 0)">
          <rect width="430" height="92" rx="4" fill="#0d1117" stroke="#1f6feb"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#79c0ff">Step 1: GenerateDataKey(KeyId='arn:...CMK')</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">1. KMS returns Plaintext Data Key (PDK) + Encrypted Data Key (EDK).</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">2. Application encrypts 10GB payload using PDK in memory (AES-256-GCM).</text>
          <text x="10" y="60" font-family="monospace" font-size="8.5" fill="#f85149">⚠️ CRITICAL: Application zeroes out PDK in RAM immediately!</text>
          <text x="10" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">3. Stores [Ciphertext + EDK] together on disk or in S3.</text>
          <text x="10" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#7ee787">Eliminates KMS API rate-limiting; KMS never sees the payload!</text>
        </g>

        <!-- Multi-Region CMKs -->
        <g transform="translate(0, 98)">
          <rect width="430" height="54" rx="4" fill="#0d1117" stroke="#388bfd"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#58a6ff">Multi-Region CMKs (Primary &amp; Replicas)</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• Primary Key in us-east-1 replicated to eu-west-1 (Same Key Material)</text>
          <text x="10" y="44" font-family="monospace" font-size="8" fill="#3fb950">✓ Encrypt in US -> Decrypt in EU directly without cross-region KMS calls!</text>
        </g>

        <!-- Network Security & Threat Detection -->
        <g transform="translate(0, 158)">
          <rect width="430" height="60" rx="4" fill="#0d1117" stroke="#238636"/>
          <text x="10" y="16" font-family="monospace" font-size="9" font-weight="700" fill="#3fb950">Threat Detection: GuardDuty &amp; AWS WAF</text>
          <text x="10" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• GuardDuty: ML threat detection on VPC Flow, DNS, CloudTrail, EKS logs</text>
          <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#c9d1d9">• AWS WAF: Rate-based rules (block IP exceeding 2,000 req/5min)</text>
          <text x="10" y="56" font-family="monospace" font-size="7.5" fill="#7ee787">✓ Zero-agent, serverless intrusion detection and edge mitigation</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 3: FinOps & Observability Engine (Bottom Banner) -->
  <g transform="translate(40, 495)">
    <rect width="1020" height="215" rx="8" fill="url(#cardGradAws3)" stroke="#238636" stroke-width="2"/>
    <rect width="1020" height="6" rx="3" fill="url(#finGrad)"/>
    <text x="25" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#3fb950">3. FinOps Cost Optimization &amp; Cross-Account Observability</text>
    <text x="25" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Savings Plans vs Reserved Instances, Spot ASG Allocation Strategies, and CloudWatch Cross-Account Tracing</text>

    <g transform="translate(25, 68)">
      <!-- Panel 1: Savings Plans -->
      <g transform="translate(0, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#58a6ff">Savings Plans vs RIs</text>
        <text x="15" y="38" font-family="monospace" font-size="8.5" fill="#3fb950">Compute Savings Plans (Most Flexible):</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Applies to EC2, Fargate &amp; Lambda automatically</text>
        <text x="15" y="64" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Changes family (m5 -> c6g), OS, or region freely</text>
        <text x="15" y="78" font-family="monospace" font-size="8" fill="#e3b341">EC2 Instance Savings Plans (Up to 72%):</text>
        <text x="15" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">• Locked to specific instance family in 1 region</text>
        <text x="15" y="108" font-family="monospace" font-size="7.5" fill="#7ee787">Standard RIs deprecated in favor of Savings Plans</text>
      </g>

      <!-- Panel 2: Spot ASG Allocation -->
      <g transform="translate(345, 0)">
        <rect width="320" height="125" rx="6" fill="#161b22" stroke="#238636"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#3fb950">Spot Allocation &amp; Termination</text>
        <text x="15" y="38" font-family="monospace" font-size="8.5" fill="#7ee787">capacity-optimized-prioritized Strategy</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Launches from Spot pools with deepest spare capacity</text>
        <text x="15" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Reduces Spot interruption rate by &gt; 80%</text>
        <text x="15" y="82" font-family="monospace" font-size="8.5" fill="#f85149">2-Minute Interruption Notice Handling:</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#8b949e">• EventBridge catches "EC2 Spot Instance Interruption Notice"</text>
        <text x="15" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#7ee787">Drains ALB connections &amp; checkpoints state cleanly.</text>
      </g>

      <!-- Panel 3: Observability & Tracing -->
      <g transform="translate(685, 0)">
        <rect width="310" height="125" rx="6" fill="#161b22" stroke="#8957e5"/>
        <text x="15" y="20" font-family="monospace" font-size="10.5" font-weight="700" fill="#a371f7">Observability &amp; S3 Tiering</text>
        <text x="15" y="38" font-family="monospace" font-size="8.5" fill="#d2a8ff">CloudWatch Cross-Account Observability:</text>
        <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Monitor accounts link to single central monitoring account</text>
        <text x="15" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Unified traces (X-Ray), metrics &amp; logs across 100+ accounts</text>
        <text x="15" y="82" font-family="monospace" font-size="8.5" fill="#58a6ff">S3 Intelligent-Tiering (Zero Retrieval Fee):</text>
        <text x="15" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#c9d1d9">• Frequent, Infrequent, Archive Instant, Deep Archive tiers</text>
        <text x="15" y="110" font-family="monospace" font-size="7.5" fill="#7ee787">✓ Moves idle objects automatically without tier change fees</text>
      </g>
    </g>
  </g>
</svg>